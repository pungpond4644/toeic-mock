essays:[
{t:'subst',title:'การตรวจลูกหนี้การค้า',q:`บริษัทมีลูกหนี้การค้า 18,000,000 บาท จากลูกค้า 900 ราย ลูกหนี้เกินกำหนดเพิ่มขึ้นจากปีก่อน ผู้บริหารตั้งค่าเผื่อผลขาดทุนด้านเครดิตลดลง

ให้ (1) ระบุสิ่งยืนยันที่มีความเสี่ยงสูง (2) อธิบายวิธีการตรวจสอบเนื้อหาสาระอย่างน้อย 4 วิธี (3) อธิบายสิ่งที่ต้องทำเมื่อไม่ได้รับคำตอบจากหนังสือยืนยัน`,pts:[['ระบุการมีอยู่จริงและการตีราคา พร้อมเหตุผลจากข้อเท็จจริง',4],['ขอคำยืนยันและคุมการส่งรับเอง',4],['ทดสอบรายงานอายุหนี้และสูตรคำนวณ',3],['ประเมินวิธีตั้งค่าเผื่อ ประวัติการเก็บเงิน ข้อมูลคาดการณ์',3],['ตรวจการรับชำระหลังวันสิ้นงวดและการตัดยอด',3],['วิธีทางเลือกเมื่อไม่ตอบ: เงินรับภายหลัง ใบส่งของ ใบกำกับภาษี',3]],model:`สิ่งยืนยันหลักคือการตีราคา เพราะหนี้เกินกำหนดเพิ่มแต่ค่าเผื่อลด และการมีอยู่จริงเพราะยอดใหญ่

วิธีตรวจ
- ส่งหนังสือยืนยันแบบตอบรับโดยผู้สอบบัญชีควบคุมการส่งและรับ
- ทดสอบความถูกต้องของรายงานอายุหนี้กับเอกสารขาย
- ประเมินแบบจำลองการตั้งค่าเผื่อ เทียบประวัติและข้อมูลคาดการณ์
- ตรวจการรับชำระหลังวันสิ้นงวด
- ตรวจตัดยอดขายและการคืนสินค้าหลังวันสิ้นงวด

กรณีไม่ตอบ ใช้วิธีทางเลือกโดยตรวจเงินรับภายหลัง พร้อมใบส่งของและใบกำกับภาษี`},
{t:'subst',title:'การสังเกตการณ์ตรวจนับสินค้า',q:`บริษัทผลิตอาหารมีคลัง 3 แห่ง และมีสินค้าฝากไว้ที่คลังบุคคลภายนอก 1 แห่ง จะตรวจนับสินค้าวันที่ 31 ธันวาคม

ให้อธิบายขั้นตอนของผู้สอบบัญชีก่อน ระหว่าง และหลังการตรวจนับ รวมถึงวิธีปฏิบัติสำหรับสินค้าที่อยู่กับบุคคลภายนอก`,pts:[['ก่อนนับ: อ่านคำสั่งตรวจนับ ประเมินแผน เลือกสถานที่',4],['ระหว่างนับ: สังเกตการปฏิบัติตามคำสั่ง และการแยกสินค้าเสีย',4],['ทดสอบนับสองทาง',4],['เก็บข้อมูลตัดยอดรับและส่งของ',3],['หลังนับ: ตามยอดนับเข้าบัญชีสรุป',2],['สินค้าที่บุคคลภายนอก: ขอคำยืนยันหรือเข้าตรวจ',3]],model:`- ก่อนนับ อ่านคำสั่งตรวจนับ เข้าใจธุรกิจ เลือกสถานที่ที่มีความเสี่ยง
- ระหว่างนับ สังเกตว่าพนักงานทำตามคำสั่ง แยกสินค้าเสียหมดอายุ ไม่มีการเคลื่อนย้าย
- ทดสอบนับทั้งจากรายการไปของจริง และจากของจริงไปรายการ
- จดเลขเอกสารรับส่งสุดท้ายเพื่อทดสอบตัดยอด
- หลังนับ ตรวจว่ายอดนับสุดท้ายถูกนำเข้ารายงานสินค้าถูกต้อง
- สินค้าที่บุคคลภายนอกถือไว้ ขอคำยืนยันโดยตรง หรือเข้าตรวจถ้ามีสาระสำคัญ`},
{t:'samp',title:'การฉายผลจากการเลือกตัวอย่าง',q:`ลูกหนี้การค้า 12,000,000 บาท ผู้สอบบัญชีกำหนดข้อผิดพลาดที่ยอมรับได้ 300,000 บาท เลือกตัวอย่างมูลค่า 1,500,000 บาท พบแสดงยอดเกิน 45,000 บาท

ให้ (1) ประมาณข้อผิดพลาดของประชากรด้วยวิธีอัตราส่วน (2) สรุปผล (3) อธิบายสิ่งที่ผู้สอบบัญชีควรทำต่อ`,pts:[['อัตราข้อผิดพลาด 3%',4],['ประมาณข้อผิดพลาด 360,000 บาท',5],['สรุปว่าเกินข้อผิดพลาดที่ยอมรับได้',4],['ขยายการตรวจหรือหาสาเหตุ',4],['ขอให้ผู้บริหารแก้ไข ถ้าไม่แก้พิจารณาผลต่อความเห็น',3]],model:`อัตราผิด 45,000 ÷ 1,500,000 = 3%

ประมาณข้อผิดพลาด 12,000,000 × 3% = 360,000 บาท สูงกว่า 300,000 บาท จึงยังสรุปไม่ได้ว่าประชากรแสดงถูกต้อง

ควรหาสาเหตุว่าข้อผิดพลาดเกิดจากอะไร ขยายการตรวจ ขอให้ผู้บริหารตรวจและแก้ไข แล้วประเมินข้อผิดพลาดที่เหลือตาม TSA 450 ถ้ายังมีสาระสำคัญ พิจารณาเปลี่ยนแปลงความเห็น`},
{t:'it',title:'จุดอ่อนการควบคุมทั่วไป',q:`บริษัทมีระบบขายอัตโนมัติ พบว่า (ก) โปรแกรมเมอร์นำโปรแกรมขึ้นระบบจริงได้เอง (ข) พนักงานที่ลาออกแล้ว 3 เดือนยังมีบัญชีผู้ใช้ (ค) ไม่มีการทดสอบกู้คืนข้อมูล

ให้ระบุความเสี่ยง การควบคุมที่ควรมี และผลต่อแผนการตรวจสอบ`,pts:[['ความเสี่ยงการแก้โปรแกรมโดยไม่ได้รับอนุมัติ',4],['ควบคุมด้วยการแบ่งแยกหน้าที่ การอนุมัติ และทดสอบ',4],['ความเสี่ยงการเข้าถึงโดยไม่มีสิทธิ และการทบทวนสิทธิ',4],['ความเสี่ยงข้อมูลสูญหาย และแผนสำรองข้อมูล',3],['ลดการไว้วางใจการควบคุมอัตโนมัติ เพิ่มงานเนื้อหาสาระและใช้เทคนิคคอมพิวเตอร์ช่วย',5]],model:`|จุดอ่อน|ความเสี่ยง|การควบคุมที่ควรมี|
|โปรแกรมเมอร์ขึ้นระบบจริงเอง|แก้ไขตรรกะการขายหรือราคาโดยไม่ได้รับอนุมัติ|แยกหน้าที่ มีการอนุมัติ ทดสอบ และบันทึกการเปลี่ยนแปลง|
|บัญชีผู้ใช้ไม่ถูกปิด|เข้าถึงระบบโดยมิชอบ|ปิดสิทธิทันทีเมื่อพ้นสภาพ ทบทวนสิทธิเป็นระยะ|
|ไม่ทดสอบกู้คืน|ข้อมูลหายและกู้ไม่ได้|สำรองและทดสอบกู้คืนตามแผน|

ผลต่อแผน: ลดการไว้วางใจการควบคุมอัตโนมัติ เพิ่มการตรวจเนื้อหาสาระ และใช้ซอฟต์แวร์ตรวจสอบทดสอบข้อมูลขายทั้งประชากร`}

- ลักษณะเฉพาะของรายการที่ทดสอบ เช่น เลขที่ใบแจ้งหนี้ หรือวันที่ช่วงที่เลือก
- ผู้จัดทำและวันที่ทำ ผู้สอบทานและวันที่สอบทาน รวมถึงขอบเขตของการสอบทาน
- การหารือเรื่องที่มีนัยสำคัญกับผู้บริหาร ผู้มีหน้าที่กำกับดูแล และบุคคลอื่น
- ข้อมูลที่ไม่สอดคล้องกับข้อสรุปสุดท้าย และวิธีที่ผู้สอบบัญชีจัดการ
- ถ้าจำเป็นต้องไม่ปฏิบัติตามข้อกำหนดที่เกี่ยวข้อง ต้องบันทึกเหตุผลและวิธีตรวจทางเลือก
> กระดาษทำการเหมือนสมุดทำการบ้านคณิตที่ครูให้แสดงวิธีทำ คำตอบถูกแต่ไม่แสดงวิธี ครูให้คะแนนไม่ได้ ผู้ตรวจคุณภาพงานก็เช่นกัน
## การรวบรวมแฟ้มงานและการเก็บรักษา
|เรื่อง|กำหนด|
|รวบรวมแฟ้มงานสุดท้ายให้เสร็จ|โดยปกติไม่เกิน 60 วันหลังวันที่ในรายงานของผู้สอบบัญชี|
|เก็บรักษาแฟ้มงาน|โดยปกติไม่น้อยกว่า 5 ปีนับจากวันที่ในรายงานของผู้สอบบัญชี|
|หลังรวบรวมเสร็จ|ห้ามลบหรือทิ้งเอกสาร ถ้าต้องเพิ่มหรือแก้ ต้องบันทึกเหตุผล ผู้ทำ วันที่ทำ และผู้สอบทาน|
@fig wp-timeline
- งานรวบรวมแฟ้มเป็นงานธุรการ เช่น จัดเรียง อ้างอิง ทิ้งร่างที่ถูกแทนที่ ไม่ใช่ช่วงทำวิธีตรวจใหม่
- กระดาษทำการเป็นสมบัติของสำนักงานสอบบัญชี ลูกค้าขอดูหรือขอสำเนาได้ตามที่ผู้สอบบัญชีเห็นสมควร โดยไม่กระทบความเป็นอิสระ
## แฟ้มถาวรและแฟ้มปีปัจจุบัน
|แฟ้ม|เก็บอะไร|
|แฟ้มถาวร|ข้อมูลที่ใช้ได้หลายปี เช่น หนังสือรับรองบริษัท ข้อบังคับ สัญญาระยะยาว ผังองค์กร โครงสร้างระบบควบคุม|
|แฟ้มปีปัจจุบัน|แผนการสอบบัญชี การประเมินความเสี่ยง กระดาษทำการแต่ละบัญชี หนังสือยืนยัน หนังสือรับรองจากผู้บริหาร|
## เครื่องหมายและการอ้างอิง
ใช้รหัสอ้างอิงเชื่อมกระดาษทำการถึงกัน เช่น งบทดลองโยงไป A1 สำหรับเงินสด และใช้เครื่องหมายการตรวจ เช่น ✓ ตรวจกับเอกสารแล้ว และต้องมีคำอธิบายเครื่องหมายในแฟ้มเสมอ

## ออกสอบแบบไหน

- ถามสิ่งที่ทำได้และทำไม่ได้หลังรวบรวมแฟ้มเสร็จ
- ถามเกณฑ์ผู้สอบบัญชีที่มีประสบการณ์ซึ่งไม่เกี่ยวข้องกับงาน`,

- จากเอกสารมาหาบัญชี หรือ tracing: เลือกเอกสารต้นทาง แล้วดูว่าบันทึกบัญชีไว้หรือไม่ พิสูจน์ความครบถ้วน เหมาะกับความเสี่ยงแสดงต่ำเกินไป

- ความเสี่ยงที่มีนัยสำคัญ ต้องมีวิธีตรวจเนื้อหาสาระที่ตอบสนองเฉพาะ ถ้าใช้วิธีตรวจเนื้อหาสาระอย่างเดียว ต้องมีการทดสอบรายละเอียดด้วย

@fig ext-confirm

## เรื่องเฉพาะใน TSA 501
- สินค้าคงเหลือที่มีสาระสำคัญ ต้องเข้าสังเกตการณ์การตรวจนับ ประเมินวิธีการของผู้บริหาร สังเกตการปฏิบัติ ตรวจสินค้า และทดลองนับ ถ้าไปในวันตรวจนับไม่ได้ ต้องนับในวันอื่นแล้วตรวจรายการระหว่างวัน ถ้าทำไม่ได้ในทางปฏิบัติ ต้องใช้วิธีทางเลือก ถ้ายังได้หลักฐานไม่พอ ต้องเปลี่ยนแปลงความเห็น
- คดีความและข้อเรียกร้อง: สอบถามผู้บริหารและที่ปรึกษากฎหมายภายใน ตรวจรายงานการประชุมและค่าที่ปรึกษากฎหมาย ถ้ามีความเสี่ยง ต้องติดต่อที่ปรึกษากฎหมายภายนอกโดยตรง ถ้าผู้บริหารไม่อนุญาต อาจต้องเปลี่ยนแปลงความเห็น
- ข้อมูลส่วนงาน: ทำความเข้าใจวิธีที่ผู้บริหารใช้กำหนดข้อมูลส่วนงาน และทดสอบตามความเหมาะสม
## ยอดยกมา TSA 510
ใช้เมื่อเป็นงานสอบบัญชีปีแรก ผู้สอบบัญชีต้องได้หลักฐานว่ายอดยกมาไม่มีข้อผิดพลาดที่กระทบงบงวดปัจจุบันอย่างมีสาระสำคัญ
- อ่านงบการเงินงวดล่าสุดและรายงานของผู้สอบบัญชีคนก่อน
- ตรวจว่ายอดยกมาโอนมาถูกต้อง และนโยบายการบัญชีใช้สม่ำเสมอ
- สอบทานกระดาษทำการของผู้สอบบัญชีคนก่อน หรือทำวิธีตรวจกับยอดยกมาเอง เช่น ตรวจการรับชำระลูกหนี้ยกมาในงวดปัจจุบัน
- ถ้าได้หลักฐานไม่พอ แสดงความเห็นอย่างมีเงื่อนไขหรือไม่แสดงความเห็น ในส่วนที่เกี่ยวกับยอดยกมา
## วิธีการวิเคราะห์เปรียบเทียบ TSA 520
ใช้เป็นวิธีตรวจเนื้อหาสาระได้ และต้องใช้ตอนใกล้สิ้นสุดงานเพื่อสรุปภาพรวมว่างบการเงินสอดคล้องกับความเข้าใจในกิจการ
- กำหนดความคาดหวังที่แม่นยำพอ จากข้อมูลที่เชื่อถือได้
- กำหนดผลต่างที่ยอมรับได้โดยไม่ต้องสืบสวนเพิ่ม

> ลูกหนี้รายหนึ่งไม่ตอบหนังสือยืนยัน แต่มีการรับเงินโอนจากลูกค้ารายนั้นในเดือน ม.ค. ตรงกับใบแจ้งหนี้ที่ค้าง ณ 31 ธ.ค. เป็นหลักฐานที่ดีว่าหนี้มีอยู่จริง
## สินค้าคงเหลือ
- สังเกตการณ์การตรวจนับ และทดลองนับเองทั้งสองทิศทาง
@fig subst-count
- ตรวจการตัดยอด โดยจดเลขที่เอกสารรับและส่งสินค้าลำดับสุดท้ายในวันตรวจนับ แล้วตามไปดูการบันทึก
- ทดสอบราคาทุนกับเอกสารซื้อ และทดสอบมูลค่าสุทธิที่จะได้รับด้วยราคาขายหลังวันสิ้นงวด
- สินค้าฝากขายที่อยู่กับตัวแทน ต้องขอคำยืนยันจากผู้รับฝาก สินค้าที่ผู้อื่นฝากไว้ที่กิจการ ต้องแยกไม่ให้นับรวม
- สินค้าเก่าเก็บ เสียหาย หรือเคลื่อนไหวช้า ที่พบระหว่างสังเกตการตรวจนับ ต้องนำไปพิจารณาการลดมูลค่า
## ที่ดิน อาคาร และอุปกรณ์
- ตรวจรายการซื้อเพิ่มกับเอกสาร และดูของจริงสำหรับรายการที่มีสาระสำคัญ
- ตรวจโฉนดและเอกสารสิทธิ ดูภาระผูกพันและการจำนอง
- ตรวจรายการจำหน่ายและกำไรขาดทุน และค้นหาสินทรัพย์ที่เลิกใช้แต่ยังไม่ได้ตัดบัญชี
- ตรวจบัญชีค่าซ่อมแซม เพื่อหารายจ่ายลงทุนที่บันทึกเป็นค่าใช้จ่าย หรือกลับกัน
- คำนวณค่าเสื่อมราคาซ้ำ และพิจารณาข้อบ่งชี้การด้อยค่า
## เงินลงทุน
ขอคำยืนยันจากผู้รับฝากหลักทรัพย์ ตรวจมูลค่ายุติธรรมกับแหล่งข้อมูลอิสระ และตรวจการจัดประเภทตาม TFRS 9 กับเจตนาของผู้บริหาร

## ออกสอบแบบไหน
- ข้อกาจับคู่วิธีตรวจกับสิ่งยืนยันของเงินสด ลูกหนี้ สินค้า และอุปกรณ์
- ถามวิธีทางเลือกเมื่อลูกหนี้ไม่ตอบ
- ถามทิศทางการทดลองนับ และการตรวจตัดยอด
- ถามการหมุนเงินรับชำระ และการตรวจโอนเงินระหว่างบัญชี`,

liab:`## ภาพรวม
ฝั่งหนี้สิน ความเสี่ยงหลักคือแสดงต่ำเกินจริง เพราะผู้บริหารอยากให้หนี้ดูน้อย วิธีตรวจจึงเน้นความครบถ้วน คือค้นหาหนี้สินที่ไม่ได้บันทึก ส่วนรายได้เน้นการเกิดขึ้นจริงและการตัดยอด ค่าใช้จ่ายเน้นความครบถ้วนและการจัดประเภท
@fig liab-search
## เจ้าหนี้การค้าและค่าใช้จ่ายค้างจ่าย
- ค้นหาหนี้สินที่ไม่ได้บันทึก: ตรวจรายการจ่ายเงินหลังวันสิ้นงวด ใบแจ้งหนี้ที่ได้รับหลังวันสิ้นงวด และใบรับสินค้าที่ยังไม่มีใบแจ้งหนี้
- กระทบยอดเจ้าหนี้กับใบแจ้งยอดของผู้ขาย ซึ่งเป็นหลักฐานจากภายนอก
- เลือกตัวอย่างจากผู้ขายที่ซื้อเป็นประจำ แม้ยอดค้างเป็นศูนย์ ไม่ใช่เลือกเฉพาะรายที่ยอดค้างสูง เพราะกลัวว่าหนี้ไม่ได้บันทึก
> เดือน ม.ค. 2570 บริษัทจ่ายเงินค่าวัตถุดิบ 480,000 บาท ใบรับสินค้าลงวันที่ 28 ธ.ค. 2569 แต่ไม่พบในยอดเจ้าหนี้ ณ 31 ธ.ค. 2569 เป็นหนี้สินที่ไม่ได้บันทึก ต้องเสนอปรับปรุง ทั้งเจ้าหนี้และสินค้าหรือต้นทุนขาย
## เงินกู้ยืม
ขอคำยืนยันยอดและเงื่อนไขจากผู้ให้กู้ อ่านสัญญา คำนวณดอกเบี้ยค้างจ่าย ตรวจการปฏิบัติตามเงื่อนไขทางการเงิน และการจัดประเภทหมุนเวียนตาม TAS 1 ถ้าผิดเงื่อนไข ณ วันสิ้นงวด และผู้ให้กู้ไม่ได้ผ่อนผันก่อนหรือ ณ วันสิ้นงวดโดยให้เวลาอย่างน้อย 12 เดือน ต้องแสดงเป็นหนี้สินหมุนเวียน
## ประมาณการหนี้สินและหนี้สินที่อาจเกิดขึ้น
ถามผู้บริหาร ตรวจรายงานการประชุม ค่าที่ปรึกษากฎหมาย และขอคำยืนยันจากที่ปรึกษากฎหมายเกี่ยวกับคดีความ แล้วประเมินการรับรู้และเปิดเผยตาม TAS 37
## ส่วนของผู้ถือหุ้น
ตรวจรายงานการประชุมผู้ถือหุ้นและกรรมการ ทะเบียนผู้ถือหุ้น หนังสือรับรองบริษัท การเพิ่มทุน และการจ่ายเงินปันผล ให้สอดคล้องกับกฎหมายบริษัทในวิชากฎหมาย 1 เช่น ทุนสำรองตามกฎหมาย
## รายได้
- ตาม TSA 240 ให้สันนิษฐานว่ามีความเสี่ยงจากการทุจริตในการรับรู้รายได้ ถ้าไม่ถือว่ามี ต้องบันทึกเหตุผล
- วิเคราะห์เปรียบเทียบรายได้รายเดือน รายผลิตภัณฑ์ และอัตรากำไรขั้นต้น
- ตรวจการตัดยอดกับเอกสารส่งของช่วงก่อนและหลังวันสิ้นงวด และตรวจการรับคืนสินค้าหลังวันสิ้นงวด ซึ่งอาจบอกว่าขายปลายปีเพื่อดันยอด
- ตรวจสัญญาสำคัญกับหลัก 5 ขั้นของ TFRS 15
## ค่าใช้จ่าย
- เงินเดือนและค่าจ้าง: ตรวจพนักงานในทะเบียนกับฝ่ายบุคคล เพื่อหาพนักงานที่ไม่มีตัวตน และกระทบยอดกับแบบนำส่งภาษีหัก ณ ที่จ่ายและประกันสังคม
- ค่าใช้จ่ายอื่น: วิเคราะห์เปรียบเทียบกับปีก่อนและงบประมาณ และตรวจเอกสารรายการที่ผิดปกติ
- ตรวจการแยกรายจ่ายลงทุนกับค่าใช้จ่าย
## ภาษีเงินได้
ตรวจการคำนวณภาษีปัจจุบัน ภาษีเงินได้รอการตัดบัญชีตาม TAS 12 และการกระทบยอดอัตราภาษี ซึ่งต้องใช้ความรู้จากวิชากฎหมาย 2

## ออกสอบแบบไหน
- ข้อกาถามวิธีค้นหาหนี้สินที่ไม่ได้บันทึก และเหตุผลที่เลือกผู้ขายยอดศูนย์
- ถามสิ่งยืนยันหลักของหนี้สิน รายได้ และค่าใช้จ่าย
- ถามความเสี่ยงที่สันนิษฐานไว้ในการรับรู้รายได้
- ข้อเขียนชอบให้วางแผนวิธีตรวจบัญชีหนึ่งบัญชีพร้อมสิ่งยืนยัน`,

it:`## ภาพรวม
กิจการส่วนใหญ่ประมวลผลบัญชีด้วยระบบคอมพิวเตอร์ ผู้สอบบัญชีจึงต้องเข้าใจว่าเทคโนโลยีสร้างความเสี่ยงอะไร และการควบคุมในระบบทำงานหรือไม่ ขอบเขตตั้งแต่ครั้งที่ 63 (2/2569) ใช้หนังสือคู่มือของสภาวิชาชีพบัญชีฉบับใหม่ 5 บท คือ การตรวจสอบเมื่อกิจการใช้เทคโนโลยีและการประเมินความเสี่ยง การควบคุมทั่วไปของเทคโนโลยีสารสนเทศ การควบคุมระบบงาน เทคนิคการตรวจสอบโดยใช้คอมพิวเตอร์ช่วย และองค์กรที่ให้บริการ
## การควบคุมสองชั้น
@fig it-layers
|ประเภท|ลักษณะ|ตัวอย่าง|
|การควบคุมทั่วไปของเทคโนโลยีสารสนเทศ|ใช้กับระบบทั้งหมด เป็นฐานให้การควบคุมอัตโนมัติทำงานได้ต่อเนื่อง|การจัดการสิทธิการเข้าถึง การควบคุมการเปลี่ยนแปลงโปรแกรม การพัฒนาระบบ การปฏิบัติการคอมพิวเตอร์ การสำรองและกู้คืนข้อมูล|
|การควบคุมระบบงาน|อยู่ในแต่ละกระบวนการธุรกิจ ดูแลข้อมูลเข้า การประมวลผล และข้อมูลออก|ตรวจรูปแบบข้อมูล จำกัดวงเงิน ห้ามเลขเอกสารซ้ำ จับคู่ใบสั่งซื้อ ใบรับของ และใบแจ้งหนี้ ยอดควบคุม|
> ถ้าการควบคุมทั่วไปอ่อน เช่น โปรแกรมเมอร์แก้โปรแกรมในระบบจริงได้เองโดยไม่มีใครอนุมัติ ผู้สอบบัญชีจะเชื่อถือการควบคุมอัตโนมัติไม่ได้ เพราะไม่รู้ว่าโปรแกรมที่ทดสอบวันนี้เป็นตัวเดียวกับที่ทำงานทั้งปีหรือไม่ เหมือนห้องมีกุญแจอย่างดี แต่ทุกคนถือกุญแจสำรอง
### การแบ่งแยกหน้าที่ในระบบ
ผู้พัฒนาโปรแกรม ผู้ดูแลระบบ และผู้ใช้งาน ควรแยกกัน ผู้ใช้งานไม่ควรมีสิทธิทั้งสร้างผู้ขายใหม่และอนุมัติการจ่ายเงิน และควรสอบทานสิทธิการเข้าถึงสม่ำเสมอ โดยเฉพาะพนักงานที่ลาออก
## การทดสอบการควบคุมอัตโนมัติ
การควบคุมอัตโนมัติทำงานแบบเดิมทุกครั้งตราบที่โปรแกรมไม่ถูกเปลี่ยน ถ้าการควบคุมทั่วไปมีประสิทธิผล ทดสอบด้วยตัวอย่างน้อยรายการก็พอ ต่างจากการควบคุมด้วยมือที่ต้องทดสอบตัวอย่างมากกว่า

|เทคนิค|วิธีทำ|ใช้ทำอะไร|

## องค์กรที่ให้บริการ TSA 402
เมื่อกิจการใช้บริการภายนอกที่เกี่ยวกับระบบบัญชี เช่น บริษัทรับทำเงินเดือน หรือระบบบัญชีบนคลาวด์ ผู้สอบบัญชีของผู้ใช้บริการต้องเข้าใจการควบคุมขององค์กรนั้น

|ประเภทที่ 2|เพิ่มประสิทธิผลของการปฏิบัติงานของการควบคุมตลอดช่วงเวลา|ใช้เป็นหลักฐานการทดสอบการควบคุมได้|

- รายงานที่แสดงความเห็นแบบไม่มีการเปลี่ยนแปลง ห้ามอ้างถึงงานของผู้สอบบัญชีขององค์กรที่ให้บริการ เว้นแต่กฎหมายกำหนด ถ้าอ้างถึงในรายงานที่เปลี่ยนแปลงความเห็นเพื่ออธิบายเหตุ ต้องระบุว่าการอ้างนั้นไม่ลดความรับผิดชอบของผู้สอบบัญชี

- ข้อกาแยกการควบคุมทั่วไปกับการควบคุมระบบงาน

ทำข้อตกลงเป็นหนังสือ ระบุวัตถุประสงค์ ความรับผิดชอบของแต่ละฝ่าย แม่บทการรายงาน และรูปแบบรายงานที่คาดไว้

! ถ้าผู้บริหารจำกัดขอบเขตตั้งแต่ก่อนรับงาน และจะทำให้ต้องไม่แสดงความเห็น ไม่ควรรับงาน เว้นแต่กฎหมายบังคับ`},
{id:'quality',name:'การบริหารคุณภาพ',ref:'TSQM 1, TSQM 2, TSA 220',body:`|มาตรฐาน|ระดับ|สาระสำคัญ|
|การบริหารคุณภาพ ฉบับที่ 1|สำนักงาน|ออกแบบระบบบริหารคุณภาพ ประเมินความเสี่ยงด้านคุณภาพ|
|การบริหารคุณภาพ ฉบับที่ 2|ผู้สอบทาน|การแต่งตั้ง คุณสมบัติ และการสอบทานคุณภาพงาน|
|TSA 220 (ปรับปรุง)|งานแต่ละงาน|ผู้สอบบัญชีที่รับผิดชอบงานเป็นผู้รับผิดชอบคุณภาพงาน|

องค์ประกอบของระบบ เช่น การกำกับดูแลและภาวะผู้นำ จรรยาบรรณ การรับงาน การปฏิบัติงาน ทรัพยากร สารสนเทศและการสื่อสาร การประเมินความเสี่ยง และการติดตามแก้ไข

ผู้สอบทานคุณภาพงานต้องไม่ใช่ทีมงาน และต้องมีความรู้ เวลา และความเที่ยงธรรมเพียงพอ`},
{id:'comm',name:'กฎหมาย การสื่อสาร และข้อบกพร่องของการควบคุม',ref:'TSA 250, 260, 265',body:`## TSA 250
กฎหมายมีสองกลุ่ม กลุ่มที่มีผลโดยตรงต่อตัวเลขในงบ เช่น ภาษี และกลุ่มที่สำคัญต่อการดำเนินธุรกิจ เช่น ใบอนุญาต ถ้าพบการไม่ปฏิบัติตาม ให้ทำความเข้าใจ หารือผู้บริหาร และสื่อสารผู้มีหน้าที่กำกับดูแล

## TSA 260
สื่อสารความรับผิดชอบของผู้สอบบัญชี ขอบเขตและช่วงเวลาตรวจ ข้อตรวจพบสำคัญ และเรื่องความเป็นอิสระ

## TSA 265
ข้อบกพร่องที่มีนัยสำคัญต้องแจ้งผู้มีหน้าที่กำกับดูแลเป็นลายลักษณ์อักษรอย่างทันเวลา ข้อบกพร่องอื่นที่ควรทราบแจ้งผู้บริหารได้`},
{id:'fraud',name:'ความรับผิดชอบเกี่ยวกับการทุจริต',ref:'TSA 240',body:`การทุจริตมีสองแบบ คือการรายงานทางการเงินอันเป็นเท็จ และการยักยอกสินทรัพย์

สามเหลี่ยมการทุจริต: แรงจูงใจหรือแรงกดดัน โอกาส และการหาเหตุผลเข้าข้างตนเอง

|ข้อสันนิษฐาน|ผ่อนคลายได้หรือไม่|
|ความเสี่ยงทุจริตในการรับรู้รายได้|หักล้างได้ ถ้ามีเหตุผลและบันทึกไว้|
|ผู้บริหารแทรกแซงการควบคุม|หักล้างไม่ได้|

ทุกงานต้องทำสามอย่างเพื่อตอบสนองการแทรกแซงการควบคุม: ทดสอบรายการบันทึกบัญชี ตรวจความลำเอียงในประมาณการ และตรวจรายการสำคัญที่ผิดปกติ

! ผู้บริหารและผู้มีหน้าที่กำกับดูแลเป็นผู้รับผิดชอบหลักในการป้องกันและตรวจพบทุจริต ผู้สอบบัญชีรับผิดชอบเรื่องความเชื่อมั่นต่องบการเงินโดยรวม`},
{id:'plan',name:'การวางแผนและความมีสาระสำคัญ',ref:'TSA 300, 320',body:`กลยุทธ์โดยรวมกำหนดขอบเขต ช่วงเวลา และทิศทางของงาน แผนการสอบบัญชีลงรายละเอียดวิธีตรวจ

## ความมีสาระสำคัญ
|ระดับ|ตัวอย่างการตั้งตามแนวปฏิบัติ|ใช้ทำอะไร|
|ความมีสาระสำคัญสำหรับงบการเงินโดยรวม|5% ของกำไรก่อนภาษี|ตัดสินผลรวมข้อผิดพลาด|
|ความมีสาระสำคัญในการปฏิบัติงาน|ต่ำกว่าระดับบน เช่น 75%|กำหนดขอบเขตการตรวจ|
|ระดับชัดเจนว่าเล็กน้อย|เล็กมาก เช่น 5% ของระดับบน|ไม่ต้องสะสม|

> กำไร 40 ล้าน ตั้ง 5% ได้ 2 ล้าน ถ้าใช้ 75% ได้ 1.5 ล้าน เราตั้งงานให้ต่ำกว่า เพราะความผิดเล็ก ๆ หลายรายการรวมกันอาจเกินระดับบน

ตัวเลข 5% และ 75% เป็นแนวปฏิบัติ ไม่ใช่ข้อกำหนดในมาตรฐาน ระดับปฏิบัติงานมักตั้งราว 50–75% ของระดับโดยรวม ยิ่งความเสี่ยงสูงยิ่งตั้งต่ำ`},
{id:'risk',name:'การประเมินและตอบสนองความเสี่ยง',ref:'TSA 315, 330, 450',body:`## ทำความเข้าใจระบบการควบคุมภายใน 5 องค์ประกอบ
สภาพแวดล้อมการควบคุม กระบวนการประเมินความเสี่ยง กระบวนการติดตามผล ระบบสารสนเทศและการสื่อสาร และกิจกรรมการควบคุม

ความเสี่ยงสืบเนื่องประเมินเป็นช่วงความรุนแรง โดยดูความซับซ้อน ความไม่แน่นอน การเปลี่ยนแปลง ความเป็นอัตวิสัย และความอ่อนไหวต่อความลำเอียงของผู้บริหารหรือการทุจริต ความเสี่ยงที่มีนัยสำคัญอยู่ปลายบนของช่วง

## การตอบสนอง
- ระดับงบการเงินโดยรวม: จัดทีมที่เหมาะสม เพิ่มการกำกับดูแล เพิ่มความไม่คาดเดา
- ระดับสิ่งยืนยัน: ทดสอบการควบคุมและตรวจเนื้อหาสาระ

ทดสอบการควบคุมเมื่อจะไว้วางใจการควบคุม หรือเมื่อการตรวจเนื้อหาสาระอย่างเดียวไม่พอ และไม่ว่าจะประเมินอย่างไร ต้องตรวจเนื้อหาสาระกับรายการที่มีสาระสำคัญทุกประเภท

## TSA 450
สะสมข้อผิดพลาดที่ไม่เล็กน้อย แจ้งผู้บริหารและขอให้แก้ไข ถ้าไม่แก้ให้ประเมินผลรวมต่อความเห็น`},
{id:'others',name:'การใช้ผลงานของบุคคลอื่น',ref:'TSA 600, 610, 620',body:`|มาตรฐาน|ใช้กับใคร|สิ่งที่ประเมิน|
|TSA 600 (ปรับปรุง)|ผู้สอบบัญชีของกิจการภายในกลุ่ม|ความสามารถ ความเป็นอิสระ และการกำกับดูแลงาน|
|TSA 610 (ปรับปรุง)|ผู้ตรวจสอบภายใน|ความเที่ยงธรรม ความสามารถ และวิธีการเป็นระบบ|
|TSA 620|ผู้เชี่ยวชาญของผู้สอบบัญชี|ความรู้ความสามารถ ความเที่ยงธรรม ขอบเขตงาน และความเพียงพอของผลงาน|

ผู้สอบบัญชีกลุ่มรับผิดชอบเต็มต่อความเห็นต่องบการเงินของกลุ่ม ใช้งานคนอื่นได้ แต่ความรับผิดชอบไม่ลดลง

! รายงานที่ไม่เปลี่ยนแปลงความเห็นไม่อ้างถึงผู้เชี่ยวชาญ เว้นแต่กฎหมายกำหนด`},
{id:'report',name:'การแสดงความเห็นและรายงาน',ref:'TSA 700, 701, 705, 706, 710, 720',body:`## ตาราง TSA 705
|สาเหตุ|มีสาระสำคัญ ไม่แผ่กระจาย|มีสาระสำคัญ และแผ่กระจาย|
|งบแสดงข้อมูลขัดต่อข้อเท็จจริง|อย่างมีเงื่อนไข|งบการเงินไม่ถูกต้อง|
|ไม่ได้หลักฐานเพียงพอ|อย่างมีเงื่อนไข|ไม่แสดงความเห็น|

แผ่กระจาย หมายถึงผลกระทบไม่จำกัดอยู่ที่รายการใดรายการหนึ่ง หรือเป็นสัดส่วนสูงของงบ หรือเกี่ยวกับการเปิดเผยที่สำคัญต่อความเข้าใจงบ

## ลำดับในรายงาน
ชื่อรายงาน ผู้รับรายงาน ความเห็น เกณฑ์ในการแสดงความเห็น การดำเนินงานต่อเนื่อง (ถ้ามี) เรื่องสำคัญในการตรวจสอบ ข้อมูลอื่น ความรับผิดชอบของผู้บริหาร ความรับผิดชอบของผู้สอบบัญชี ลายมือชื่อ ที่อยู่ และวันที่

essays:[
{t:'report',title:'เลือกรูปแบบความเห็น',q:`ให้ระบุรูปแบบรายงานและเหตุผลของแต่ละกรณี

กรณี 1 กิจการไม่ตั้งค่าเผื่อลูกหนี้รายหนึ่งที่ล้มละลาย ยอด 12,000,000 บาท กำไรก่อนภาษี 80,000,000 บาท สินทรัพย์รวม 900,000,000 บาท ผู้บริหารไม่ยอมแก้ไข

กรณี 2 ผู้สอบบัญชีไม่สามารถเข้าตรวจนับสินค้าซึ่งเป็น 60% ของสินทรัพย์รวม และไม่มีวิธีทางเลือก

กรณี 3 กิจการจดทะเบียนมีคดีละเมิดสิทธิบัตรใหญ่ เปิดเผยเพียงพอในหมายเหตุ ผู้สอบบัญชีเห็นว่าสำคัญมากต่อความเข้าใจงบ

## เรื่องที่ต้องใช้มติพิเศษ

ผู้ถือหุ้นที่มีส่วนได้เสียเป็นพิเศษในเรื่องใด ออกเสียงในเรื่องนั้นไม่ได้ แต่ยังเข้าประชุมได้

essays:[
{t:'ptn',title:'หุ้นส่วนจำกัดความรับผิดสอดเข้าจัดการ',q:`ห้างหุ้นส่วนจำกัด รุ่งเรือง มีนาย ก เป็นหุ้นส่วนไม่จำกัดความรับผิดและผู้จัดการ นาย ข เป็นหุ้นส่วนจำกัดความรับผิดลงหุ้น 1,000,000 บาท

ขณะที่นาย ก ไปต่างประเทศ นาย ข ลงนามในสัญญาซื้อสินค้า 5,000,000 บาทในนามห้าง ต่อมาห้างจ่ายหนี้ไม่ได้ เจ้าหนี้ฟ้องนาย ข ให้รับผิดเต็มจำนวน

ให้วินิจฉัยว่านาย ข ต้องรับผิดเพียงใด`,pts:[['อ้างหลักว่าหุ้นส่วนจำกัดความรับผิดรับผิดไม่เกินจำนวนที่ลงหุ้น',4],['อ้างหลักการสอดเข้าไปจัดการงานตามมาตรา 1088',6],['วินิจฉัยว่าการลงนามสัญญาเป็นการจัดการงาน',5],['สรุปว่านาย ข รับผิดไม่จำกัดจำนวนเหมือนหุ้นส่วนไม่จำกัดความรับผิด',5]],model:`หลักกฎหมาย หุ้นส่วนจำกัดความรับผิดรับผิดเฉพาะจำนวนที่รับลงหุ้น แต่ถ้าสอดเข้าไปเกี่ยวข้องจัดการงานของห้าง ต้องรับผิดร่วมกันในบรรดาหนี้ทั้งหลายของห้างโดยไม่จำกัดจำนวน ตามมาตรา 1088

วินิจฉัย การลงนามทำสัญญาซื้อสินค้าในนามห้างเป็นการจัดการงาน ไม่ใช่แค่การออกความเห็นหรือแนะนำ

สรุป นาย ข ต้องรับผิดในหนี้ 5,000,000 บาท ไม่จำกัดเพียงจำนวนที่ลงหุ้น`},
{t:'div',title:'การจ่ายเงินปันผลของบริษัทจำกัด',q:`บริษัท สยาม จำกัด ทุนจดทะเบียน 10,000,000 บาท มีขาดทุนสะสมต้นปี 800,000 บาท ปี 2569 กำไรสุทธิ 2,000,000 บาท ทุนสำรองเดิมไม่มี กรรมการเสนอจ่ายเงินปันผล 1,200,000 บาท

ให้วินิจฉัยว่าจ่ายได้หรือไม่ ต้องจัดสรรทุนสำรองอย่างน้อยเท่าใด และสรุปจำนวนเงินปันผลสูงสุดที่จ่ายได้ โดยคิดทุนสำรองจากกำไรปีนี้`,pts:[['หลักจ่ายปันผลจากกำไร และห้ามจ่ายถ้าขาดทุน',5],['หักขาดทุนสะสมเหลือกำไรสะสม 1,200,000 บาท',5],['จัดสรรทุนสำรองอย่างน้อย 5% ของกำไร 100,000 บาท',5],['เงินปันผลสูงสุด 1,100,000 บาท ข้อเสนอ 1,200,000 บาทจึงจ่ายไม่ได้เต็มจำนวน',5]],model:`หลักกฎหมาย เงินปันผลจ่ายจากเงินกำไรเท่านั้น ถ้ายังมีขาดทุนห้ามจ่าย และทุกครั้งที่จ่ายต้องจัดสรรทุนสำรองอย่างน้อย 5% ของกำไร จนกว่าทุนสำรองถึง 10% ของทุน

|รายการ|บาท|
|กำไรปี 2569|2,000,000|
|หัก ขาดทุนสะสม|(800,000)|
|กำไรสะสมก่อนจัดสรร|1,200,000|
|หัก ทุนสำรอง 5% ของ 2,000,000|(100,000)|
|จ่ายปันผลได้สูงสุด|1,100,000|

สรุป จ่าย 1,200,000 บาทไม่ได้ จ่ายได้ไม่เกิน 1,100,000 บาท`},
{t:'plc2',title:'การเรียกประชุมวิสามัญบริษัทมหาชน',q:`ผู้ถือหุ้นกลุ่มหนึ่งของบริษัท มหาชน จำกัด ถือหุ้นรวม 12% ของหุ้นที่จำหน่ายได้ทั้งหมด ทำหนังสือขอให้คณะกรรมการเรียกประชุมวิสามัญ แต่ผ่านไป 50 วันคณะกรรมการไม่ได้จัดประชุม

ให้อธิบายสิทธิของผู้ถือหุ้นกลุ่มนี้ และผลหากจำนวนผู้เข้าประชุมไม่ครบองค์ประชุม`,pts:[['ผู้ถือหุ้นรวมกันไม่น้อยกว่า 10% ขอให้เรียกประชุมได้',5],['คณะกรรมการต้องจัดภายใน 45 วัน',5],['ถ้าไม่จัด ผู้ถือหุ้นเรียกประชุมเองได้ภายใน 45 วันนับจากครบกำหนด',5],['ถ้าไม่ครบองค์ประชุม ผู้ถือหุ้นที่เรียกต้องร่วมรับผิดชอบค่าใช้จ่าย',5]],model:`หลักกฎหมาย ผู้ถือหุ้นรวมกันไม่น้อยกว่า 10% ของหุ้นที่จำหน่ายได้ทั้งหมด ขอให้คณะกรรมการเรียกประชุมวิสามัญได้ โดยระบุเรื่องและเหตุผล คณะกรรมการต้องจัดภายใน 45 วัน ถ้าไม่จัด ผู้ถือหุ้นดังกล่าวหรือผู้ถือหุ้นอื่นที่รวมจำนวนหุ้นได้ตามกำหนดเรียกประชุมเองได้ภายใน 45 วันนับแต่ครบกำหนด

วินิจฉัย กลุ่มนี้ถือ 12% มีสิทธิ และเวลาครบ 45 วันแล้ว จึงเรียกประชุมเองได้

ถ้าประชุมแล้วองค์ประชุมไม่ครบ ผู้ถือหุ้นผู้เรียกประชุมต้องร่วมกันชดใช้ค่าใช้จ่ายการจัดประชุมให้บริษัท`},
{t:'fbl',title:'สถานะคนต่างด้าวของบริษัท',q:`บริษัท A จดทะเบียนในไทย ผู้ถือหุ้นคือ นาย จอห์น สัญชาติอังกฤษ 49% และบริษัท B จดทะเบียนในไทย 51%

บริษัท B ผู้ถือหุ้นคือ นาง เอมิลี่ สัญชาติอังกฤษ 50% และคนไทย 50%

บริษัท A ต้องการเปิดสำนักงานบริการบัญชีในไทย ให้วินิจฉัยว่าบริษัท A เป็นคนต่างด้าวหรือไม่ และต้องปฏิบัติอย่างไร`,pts:[['ระบุเกณฑ์มาตรา 4 หุ้นตั้งแต่กึ่งหนึ่ง',5],['บริษัท B เป็นคนต่างด้าวเพราะถือโดยต่างด้าวครบกึ่งหนึ่ง',5],['หุ้นของ B นับเป็นหุ้นคนต่างด้าวใน A ทำให้ A เป็นคนต่างด้าว',5],['บริการบัญชีอยู่ในบัญชีสาม ต้องขออนุญาตอธิบดี',5]],model:`หลักกฎหมาย นิติบุคคลไทยที่มีหุ้นตั้งแต่กึ่งหนึ่งถือโดยคนต่างด้าว ถือเป็นคนต่างด้าว และให้นับหุ้นที่นิติบุคคลต่างด้าวถือด้วย

วินิจฉัย บริษัท B มีต่างด้าวถือ 50% จึงเป็นคนต่างด้าว หุ้นของ B ใน A จึงนับเป็นหุ้นคนต่างด้าว รวมกับนาย จอห์น เป็น 100%

สรุป บริษัท A เป็นคนต่างด้าว บริการบัญชีอยู่ในบัญชีสาม ต้องได้รับอนุญาตจากอธิบดีโดยอนุมัติคณะกรรมการ และมีทุนขั้นต่ำตามกฎหมาย`}

## การสอดเข้าไปจัดการงานของห้าง
ตาม ป.พ.พ. มาตรา 1088 ถ้าหุ้นส่วนจำกัดความรับผิดสอดเข้าไปเกี่ยวข้องจัดการงานของห้าง ต้องรับผิดร่วมกันในบรรดาหนี้ทั้งหลายของห้างโดยไม่จำกัดจำนวน
- ไม่ถือว่าสอดเข้าไปจัดการ: ออกความเห็นแนะนำ และออกเสียงในการตั้งหรือถอดถอนผู้จัดการ
- ถือว่าสอดเข้าไปจัดการ: ทำสัญญากับบุคคลภายนอกแทนห้าง สั่งงานลูกจ้าง อนุมัติการสั่งซื้อในนามห้าง
> หุ้นส่วนจำกัดความรับผิดเหมือนคนใส่เงินแล้วนั่งดู ถ้าลุกขึ้นมาเซ็นสัญญาซื้อรถแทนห้างเอง ก็หมดสิทธิ์เป็นผู้นั่งดู กลายเป็นต้องรับผิดในหนี้ทั้งหมดเหมือนผู้จัดการ

## เจ้าหนี้ฟ้องหุ้นส่วนได้เมื่อไร
- หุ้นส่วนไม่จำกัดความรับผิดในห้างจดทะเบียน: เจ้าหนี้เรียกให้ชำระได้เมื่อห้างผิดนัด
- หุ้นส่วนจำกัดความรับผิด: ตราบใดที่ห้างยังไม่เลิก เจ้าหนี้ของห้างฟ้องหุ้นส่วนจำพวกนี้ไม่ได้ เมื่อห้างเลิกแล้ว เรียกได้เท่าค่าหุ้นที่ยังไม่ได้ส่ง หรือที่ถอนคืนไปจากห้าง
> ห้างหุ้นส่วนจำกัดมี ก. เป็นหุ้นส่วนไม่จำกัดความรับผิด และ ข. เป็นหุ้นส่วนจำกัดความรับผิด รับลงหุ้น 200,000 บาท ส่งแล้ว 150,000 บาท ห้างค้างหนี้ 1,000,000 บาท ระหว่างที่ห้างยังไม่เลิก เจ้าหนี้ฟ้อง ข. ไม่ได้ แต่เรียกจาก ก. ได้เมื่อห้างผิดนัด เมื่อห้างเลิกแล้ว เจ้าหนี้เรียกจาก ข. ได้ไม่เกิน 50,000 บาท ซึ่งเป็นค่าหุ้นที่ยังไม่ได้ส่ง ถ้า ข. เคยเซ็นสัญญาแทนห้าง ข. ต้องรับผิดในหนี้ทั้ง 1,000,000 บาทโดยไม่จำกัด

## หุ้นส่วนเข้าใหม่และออกไป
- การรับคนนอกเข้าเป็นหุ้นส่วน ต้องได้รับความยินยอมจากหุ้นส่วนทุกคน เว้นแต่ตกลงไว้เป็นอย่างอื่น
- หุ้นส่วนที่เข้ามาใหม่ ต้องรับผิดในหนี้ที่ห้างก่อขึ้นก่อนตนเข้ามาด้วย
- หุ้นส่วนที่ออกไป ยังต้องรับผิดในหนี้ที่ห้างก่อขึ้นก่อนตนออก แต่จำกัดเวลาไว้ไม่เกิน 2 ปีนับแต่ออกจากห้าง

## การเลิกห้าง
- ห้างไม่มีกำหนดเวลา หุ้นส่วนบอกเลิกได้ โดยบอกล่วงหน้าไม่น้อยกว่า 6 เดือนก่อนสิ้นรอบปีบัญชี
- เลิกเมื่อครบกำหนดเวลาหรือทำกิจการเสร็จ เกิดเหตุตามที่ตกลงไว้ หุ้นส่วนไม่จำกัดความรับผิดตาย ล้มละลาย หรือไร้ความสามารถ เว้นแต่ตกลงไว้เป็นอย่างอื่น
- หุ้นส่วนร้องขอให้ศาลสั่งเลิกได้ เช่น หุ้นส่วนอีกคนผิดสัญญาร้ายแรง หรือกิจการขาดทุนจนไม่มีหวังฟื้น
- ห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด แปรสภาพเป็นบริษัทจำกัดได้

## ออกสอบแบบไหน
- ข้อกาเทียบสิทธิและหน้าที่ของหุ้นส่วนสองจำพวก
- ถามว่าการกระทำใดถือว่าสอดเข้าไปจัดการงาน และผลคือต้องรับผิดอย่างไร
- ถามว่าเจ้าหนี้ฟ้องหุ้นส่วนจำกัดความรับผิดได้เมื่อไร และได้เท่าไร
- ข้อเขียนชอบให้สถานการณ์หุ้นส่วนจำกัดความรับผิดทำสัญญาแทนห้าง แล้วให้วินิจฉัยตามมาตรา 1088`,

co:`## ภาพรวม
บริษัทจำกัดคือบริษัทที่แบ่งทุนเป็นหุ้นมีมูลค่าเท่ากัน ผู้ถือหุ้นรับผิดจำกัดไม่เกินจำนวนเงินที่ยังส่งใช้ไม่ครบมูลค่าหุ้นที่ตนถือ กฎหมายแก้ไขที่มีผลตั้งแต่ 7 กุมภาพันธ์ 2566 เปลี่ยนเรื่องสำคัญหลายเรื่อง
|เรื่อง|ก่อน 7 ก.พ. 2566|ตั้งแต่ 7 ก.พ. 2566|
|ผู้เริ่มก่อการ|อย่างน้อย 3 คน|อย่างน้อย 2 คน|
|หนังสือบริคณห์สนธิสิ้นผล ถ้าไม่จดทะเบียนตั้งบริษัท|ภายใน 10 ปี|ภายใน 3 ปี|
|การควบรวมกิจการ|มีแบบควบรวมตั้งบริษัทใหม่|เพิ่มแบบควบรวมเข้ากับบริษัทเดิม โดยไม่ต้องตั้งบริษัทใหม่|
> กฎหมายใหม่ทำให้ตั้งบริษัทได้ด้วยคน 2 คน ช่วยธุรกิจเริ่มต้นขนาดเล็ก ข้อสอบเก่าที่ตอบ 3 คน หรือ 10 ปี จึงใช้ไม่ได้แล้ว

## ขั้นตอนการจัดตั้ง
@fig co-steps
- ผู้เริ่มก่อการจัดทำและจดทะเบียนหนังสือบริคณห์สนธิ ระบุชื่อบริษัท ที่ตั้งสำนักงาน วัตถุประสงค์ ความรับผิดจำกัดของผู้ถือหุ้น ทุนที่จะจดทะเบียน และผู้เริ่มก่อการ
- ผู้เริ่มก่อการแต่ละคนต้องซื้อหุ้นอย่างน้อย 1 หุ้น
- เมื่อมีผู้ซื้อหุ้นครบตามจำนวนที่จะจดทะเบียน ให้นัดประชุมจัดตั้งบริษัท เพื่อทำข้อบังคับ ตั้งกรรมการและผู้สอบบัญชี และให้สัตยาบันกิจการที่ผู้เริ่มก่อการทำไป
- ผู้เริ่มก่อการส่งมอบกิจการให้กรรมการ กรรมการเรียกให้ผู้ซื้อหุ้นชำระเงินค่าหุ้น
- กรรมการขอจดทะเบียนตั้งบริษัท บริษัทเป็นนิติบุคคลตั้งแต่วันจดทะเบียน
- ถ้าผู้เริ่มก่อการ ผู้ซื้อหุ้น และกรรมการเป็นกลุ่มเดียวกัน และทำครบในวันเดียว จดทะเบียนหนังสือบริคณห์สนธิและตั้งบริษัทในวันเดียวกันได้

## หุ้นและการชำระค่าหุ้น
|เรื่อง|กำหนด|
|มูลค่าหุ้น|ไม่ต่ำกว่าหุ้นละ 5 บาท และทุกหุ้นต้องมีมูลค่าเท่ากัน|
|ชำระค่าหุ้นครั้งแรก|ไม่น้อยกว่า 25% ของมูลค่าหุ้น|
|ออกหุ้นต่ำกว่ามูลค่า|ห้าม|
|ออกหุ้นสูงกว่ามูลค่า|ได้ ถ้าหนังสือบริคณห์สนธิให้อำนาจ และส่วนที่เกินต้องชำระพร้อมงวดแรก|
|หักกลบลบหนี้ค่าหุ้น|ผู้ถือหุ้นขอหักกลบกับหนี้ที่บริษัทค้างตนไม่ได้|
|บริษัทถือหุ้นของตนเอง หรือรับจำนำหุ้นของตนเอง|ห้าม ตามมาตรา 1143|
> หุ้นมูลค่า 10 บาท ออกขายหุ้นละ 12 บาท งวดแรกต้องชำระอย่างน้อย 25% ของ 10 บาท คือ 2.50 บาท บวกส่วนเกิน 2 บาท รวม 4.50 บาทต่อหุ้น
### การโอนหุ้นชนิดระบุชื่อ
- ต้องทำเป็นหนังสือ ระบุเลขหุ้น ลงลายมือชื่อผู้โอนและผู้รับโอน และมีพยานอย่างน้อย 1 คนลงชื่อรับรองลายมือชื่อ ถ้าไม่ทำตามแบบนี้ การโอนเป็นโมฆะ
- การโอนใช้ยันบริษัทและบุคคลภายนอกได้ เมื่อบริษัทลงชื่อผู้รับโอนและที่อยู่ในทะเบียนผู้ถือหุ้นแล้ว
- หุ้นที่ยังชำระค่าหุ้นไม่ครบ ผู้โอนยังต้องรับผิดค่าหุ้นที่ยังไม่ได้ชำระในหนี้ที่บริษัทก่อขึ้นก่อนการโอน ภายในเวลาที่กฎหมายกำหนด
### ทะเบียนผู้ถือหุ้นและการเรียกชำระค่าหุ้น
- บริษัทต้องมีทะเบียนผู้ถือหุ้นไว้ที่สำนักงาน และผู้ถือหุ้นตรวจดูได้
- การเรียกชำระค่าหุ้นเพิ่ม ต้องบอกกล่าวล่วงหน้าไม่น้อยกว่า 21 วัน ถ้าผู้ถือหุ้นไม่ชำระ กรรมการริบหุ้นและนำออกขายทอดตลาดได้ตามขั้นตอน

## ออกสอบแบบไหน
- ข้อกาถามจำนวนผู้เริ่มก่อการ อายุหนังสือบริคณห์สนธิ และมูลค่าหุ้นขั้นต่ำ ระวังตัวเลขก่อนและหลังปี 2566
- ถามแบบของการโอนหุ้นชนิดระบุชื่อ และผลถ้าทำไม่ครบ
- ถามการออกหุ้นสูงกว่ามูลค่า การหักกลบลบหนี้ และการถือหุ้นของตนเอง`,

mgmt:`## ภาพรวม
บริษัทจำกัดมีสองกลไกหลัก คือ คณะกรรมการที่บริหารงานประจำ และที่ประชุมผู้ถือหุ้นที่ตัดสินเรื่องสำคัญ
## กรรมการ
- มีจำนวนตามข้อบังคับ อย่างน้อย 1 คน ที่ประชุมใหญ่เป็นผู้เลือกตั้ง
- ในการประชุมสามัญประจำปีทุกครั้ง กรรมการต้องออกจากตำแหน่ง 1 ใน 3 ถ้าข้อบังคับไม่กำหนดเป็นอย่างอื่น กรรมการที่ออกไปอาจได้รับเลือกกลับมาใหม่
- ต้องใช้ความระมัดระวังเหมือนบุคคลค้าขายผู้ประกอบด้วยความระมัดระวัง และห้ามเข้าเป็นหุ้นส่วนไม่จำกัดความรับผิดในห้างที่ทำกิจการแข่งกับบริษัท เว้นแต่ที่ประชุมใหญ่ยินยอม
- องค์ประชุมของคณะกรรมการ ที่ประชุมกรรมการกำหนดเองได้ ถ้าไม่ได้กำหนดไว้และมีกรรมการเกิน 3 คน ต้องมีกรรมการมาประชุม 3 คนจึงเป็นองค์ประชุม ตามมาตรา 1160 ต่างจากบริษัทมหาชนจำกัดที่ต้องมาไม่น้อยกว่ากึ่งหนึ่ง
## การประชุมผู้ถือหุ้น
|เรื่อง|กำหนด|
|ประชุมใหญ่ครั้งแรก|ภายใน 6 เดือนนับแต่วันจดทะเบียนบริษัท|
|ประชุมสามัญ|อย่างน้อยทุก 12 เดือน|
|ประชุมวิสามัญ|กรรมการเรียกเมื่อใดก็ได้ และต้องเรียกเมื่อบริษัทขาดทุนถึงกึ่งหนึ่งของทุน|
|ผู้ถือหุ้นขอให้เรียกประชุม|ถือหุ้นรวมกันไม่น้อยกว่า 1 ใน 5 ของหุ้นทั้งหมด กรรมการต้องเรียกภายใน 30 วัน ถ้าไม่เรียก ผู้ถือหุ้นเรียกเองได้|
|คำบอกกล่าวนัดประชุม|ส่งล่วงหน้าไม่น้อยกว่า 7 วัน|
|คำบอกกล่าวนัดประชุมเพื่อลงมติพิเศษ|ส่งล่วงหน้าไม่น้อยกว่า 14 วัน|
|องค์ประชุม|ผู้ถือหุ้นที่มาประชุมมีหุ้นรวมกันไม่น้อยกว่า 1 ใน 4 ของทุน|
|การออกเสียง|หุ้นหนึ่งมีหนึ่งเสียง ถ้าข้อบังคับไม่กำหนดเป็นอย่างอื่น|
### ถ้าองค์ประชุมไม่ครบ
ถ้าพ้นเวลานัดไป 1 ชั่วโมงแล้วองค์ประชุมยังไม่ครบ
- ถ้าเป็นการประชุมที่ผู้ถือหุ้นร้องขอให้เรียก ให้ระงับการประชุม
- ถ้าเป็นการประชุมแบบอื่น ให้นัดประชุมใหม่ภายใน 14 วัน ส่งคำบอกกล่าวไม่น้อยกว่า 7 วัน และการประชุมครั้งใหม่ไม่ต้องครบองค์ประชุม
@fig mgmt-quorum
## มติที่ประชุม
|มติ|เกณฑ์|ใช้กับ|
|มติธรรมดา|เสียงข้างมากของผู้ถือหุ้นที่มาประชุมและออกเสียง|เรื่องทั่วไป เช่น อนุมัติงบดุล เลือกกรรมการ ตั้งผู้สอบบัญชี ประกาศจ่ายเงินปันผล|
|มติพิเศษ|ไม่น้อยกว่า 3 ใน 4 ของจำนวนเสียงของผู้ถือหุ้นที่มาประชุมและมีสิทธิออกเสียง|แก้หนังสือบริคณห์สนธิหรือข้อบังคับ เพิ่มทุน ลดทุน ควบบริษัท และเลิกบริษัท|
> มีผู้ถือหุ้นมาประชุมถือหุ้นรวม 10,000 หุ้น หุ้นละ 1 เสียง ผู้ถือหุ้นที่มีส่วนได้เสียพิเศษ 2,000 หุ้นออกเสียงไม่ได้ เหลือผู้มีสิทธิออกเสียง 8,000 เสียง มติพิเศษต้องได้อย่างน้อย 6,000 เสียง
- ผู้ถือหุ้นที่มีส่วนได้เสียเป็นพิเศษในเรื่องใด ออกเสียงในเรื่องนั้นไม่ได้ แต่ยังเข้าประชุมได้
- มอบฉันทะต้องทำเป็นหนังสือ
- ผู้ถือหุ้นหรือกรรมการร้องขอให้ศาลเพิกถอนมติที่ประชุมที่นัดเรียกหรือประชุมหรือลงมติฝ่าฝืนกฎหมายหรือข้อบังคับได้ ภายใน 1 เดือนนับแต่วันลงมติ
- กฎหมายปัจจุบันอนุญาตให้ประชุมผ่านสื่ออิเล็กทรอนิกส์และส่งคำบอกกล่าวทางอิเล็กทรอนิกส์ได้ตามหลักเกณฑ์ที่กำหนด

## ออกสอบแบบไหน
- ข้อกาถามระยะเวลาคำบอกกล่าว 7 วันหรือ 14 วัน และองค์ประชุม 1 ใน 4
- คำนวณคะแนนเสียงมติพิเศษ ต้องหักผู้ที่ไม่มีสิทธิออกเสียงก่อน
- ถามเรื่องที่ต้องใช้มติพิเศษ และขั้นตอนเมื่อองค์ประชุมไม่ครบ
- ถามระยะเวลาขอเพิกถอนมติ 1 เดือน`,

div:`## ภาพรวม
หัวข้อนี้รวมเรื่องเงินที่ออกจากบริษัทไปให้ผู้ถือหุ้น และการตรวจสอบตัวเลขของบริษัท หลักใหญ่คือคุ้มครองเจ้าหนี้ บริษัทจ่ายเงินปันผลได้จากกำไรเท่านั้น
## เงินปันผล
- จ่ายจากเงินกำไรเท่านั้น ถ้ายังมีขาดทุนสะสม ห้ามจ่ายเงินปันผลจนกว่าจะแก้ขาดทุนนั้นหมด
- ต้องได้รับอนุมัติจากที่ประชุมใหญ่ ยกเว้นเงินปันผลระหว่างกาลที่กรรมการจ่ายได้เป็นครั้งคราว เมื่อเห็นว่าบริษัทมีกำไรพอ แล้วรายงานที่ประชุมใหญ่คราวถัดไป
- ถ้าข้อบังคับไม่กำหนดเป็นอย่างอื่น เงินปันผลแบ่งตามจำนวนหุ้น
- ถ้าจ่ายเงินปันผลฝ่าฝืนกฎหมาย เจ้าหนี้ของบริษัทเรียกให้ผู้ถือหุ้นคืนเงินที่ได้รับได้
## ทุนสำรองตามกฎหมาย
ทุกครั้งที่จ่ายเงินปันผล ต้องจัดสรรเงินไว้เป็นทุนสำรองอย่างน้อย 1 ใน 20 คือ 5% ของกำไรที่บริษัททำมาหาได้ จนกว่าทุนสำรองจะมีจำนวน 1 ใน 10 คือ 10% ของทุนของบริษัท

plc2:`## ภาพรวม
หัวข้อนี้เป็นภาคต่อของบริษัทมหาชนจำกัด เน้นการประชุมผู้ถือหุ้น การเปลี่ยนแปลงทุน และการจ่ายเงินปันผล ตัวเลขหลายตัวต่างจากบริษัทจำกัด ต้องจำแยกให้ได้
## การประชุมผู้ถือหุ้น
|เรื่อง|บริษัทมหาชนจำกัด|บริษัทจำกัด|
|ประชุมสามัญ|ภายใน 4 เดือนนับแต่สิ้นรอบปีบัญชี|อย่างน้อยทุก 12 เดือน|
|ผู้ถือหุ้นขอเรียกประชุมวิสามัญ|ถือหุ้นรวมกันไม่น้อยกว่า 10% บริษัทต้องจัดประชุมภายใน 45 วัน|ถือหุ้นรวมกันไม่น้อยกว่า 1 ใน 5 กรรมการต้องเรียกภายใน 30 วัน|
|หนังสือนัดประชุม|ส่งล่วงหน้าไม่น้อยกว่า 7 วัน และโฆษณาติดต่อกัน 3 วัน ก่อนวันประชุมไม่น้อยกว่า 3 วัน|ส่งล่วงหน้า 7 วัน หรือ 14 วันถ้าเป็นมติพิเศษ|
|องค์ประชุม|ผู้ถือหุ้นมาประชุมไม่น้อยกว่า 25 คน หรือไม่น้อยกว่ากึ่งหนึ่งของผู้ถือหุ้นทั้งหมด และถือหุ้นรวมกันไม่น้อยกว่า 1 ใน 3 ของหุ้นที่จำหน่ายได้ทั้งหมด|หุ้นรวมกันไม่น้อยกว่า 1 ใน 4 ของทุน|
|มติสำคัญ|ไม่น้อยกว่า 3 ใน 4 ของจำนวนเสียงของผู้ถือหุ้นที่มาประชุมและมีสิทธิออกเสียง|มติพิเศษ 3 ใน 4 เช่นกัน|
@fig plc2-quorum
### เรื่องที่ต้องใช้มติ 3 ใน 4
ขายหรือโอนกิจการทั้งหมดหรือบางส่วนที่สำคัญ ซื้อหรือรับโอนกิจการของบริษัทอื่น ทำ แก้ไข หรือเลิกสัญญาให้เช่ากิจการหรือมอบหมายให้ผู้อื่นจัดการ แก้ไขหนังสือบริคณห์สนธิหรือข้อบังคับ เพิ่มทุน ลดทุน ออกหุ้นกู้ ควบบริษัท และเลิกบริษัท
> ผู้ถือหุ้นมาประชุม 40 คน ถือหุ้นรวม 300 ล้านหุ้น จากหุ้นที่จำหน่ายได้ทั้งหมด 800 ล้านหุ้น ต้องผ่านทั้งสองเงื่อนไข จำนวนคน 40 คนผ่านเกณฑ์ 25 คน และหุ้น 300 ล้านหุ้นเกิน 1 ใน 3 ของ 800 ล้านหุ้น ซึ่งคือประมาณ 266.7 ล้านหุ้น จึงครบองค์ประชุม ถ้ามาประชุมถือหุ้นรวมเพียง 250 ล้านหุ้น แม้จำนวนคนครบ ก็ยังไม่ครบองค์ประชุม

## ทุนและหุ้น
- ออกหุ้นต่ำกว่ามูลค่าได้ เมื่อบริษัทดำเนินกิจการมาแล้วไม่น้อยกว่า 1 ปี มีขาดทุนสะสม และที่ประชุมผู้ถือหุ้นอนุมัติ
- ลดทุนห้ามลดลงต่ำกว่า 1 ใน 4 ของทุนทั้งหมด และต้องแจ้งเจ้าหนี้ให้คัดค้านตามขั้นตอน ยกเว้นการลดทุนเพื่อชดเชยขาดทุนสะสมตามเงื่อนไขของกฎหมาย
- ซื้อหุ้นคืนได้ในกรณีที่กฎหมายกำหนด เช่น ซื้อจากผู้ถือหุ้นที่ออกเสียงไม่เห็นด้วยกับมติแก้ไขข้อบังคับเรื่องสิทธิออกเสียงและสิทธิรับเงินปันผล หรือซื้อเพื่อบริหารทางการเงินเมื่อมีกำไรสะสมและสภาพคล่องส่วนเกิน และหุ้นที่ซื้อคืนไม่นับเป็นองค์ประชุม ไม่มีสิทธิออกเสียงและไม่มีสิทธิรับเงินปันผล

## เงินปันผลและทุนสำรอง
- จ่ายจากกำไรเท่านั้น ถ้ายังมีขาดทุนสะสม ห้ามจ่าย
- ต้องจัดสรรทุนสำรองไม่น้อยกว่า 5% ของกำไรสุทธิประจำปี หักด้วยยอดขาดทุนสะสมยกมา จนกว่าทุนสำรองมีไม่น้อยกว่า 10% ของทุนจดทะเบียน
- คณะกรรมการจ่ายเงินปันผลระหว่างกาลได้เมื่อเห็นว่าบริษัทมีกำไรสมควร แล้วรายงานที่ประชุมผู้ถือหุ้นคราวต่อไป
- จ่ายเงินปันผลภายใน 1 เดือนนับแต่วันที่ที่ประชุมผู้ถือหุ้นหรือคณะกรรมการลงมติ และแจ้งผู้ถือหุ้นพร้อมโฆษณาตามที่กฎหมายกำหนด
> กำไรสุทธิปีนี้ 12,000,000 บาท ขาดทุนสะสมยกมา 2,000,000 บาท ต้องจัดสรรทุนสำรองอย่างน้อย 5% × (12,000,000 − 2,000,000) = 500,000 บาท

## ผู้สอบบัญชี
- ที่ประชุมผู้ถือหุ้นสามัญประจำปีแต่งตั้งผู้สอบบัญชีและกำหนดค่าสอบบัญชีทุกปี
- ผู้สอบบัญชีต้องไม่เป็นกรรมการ พนักงาน ลูกจ้าง หรือผู้ดำรงตำแหน่งหน้าที่ใดของบริษัท
- ผู้สอบบัญชีมีอำนาจตรวจบัญชี เอกสาร และหลักฐาน และมีหน้าที่เข้าร่วมประชุมผู้ถือหุ้นทุกครั้งที่พิจารณางบการเงิน เพื่อชี้แจง

## ออกสอบแบบไหน
- ข้อกาถามองค์ประชุมของบริษัทมหาชน ต้องครบทั้งเรื่องจำนวนคนและจำนวนหุ้น
- ถามเรื่องที่ต้องใช้มติ 3 ใน 4 และสัดส่วนผู้ถือหุ้นที่ขอเรียกประชุมวิสามัญ
- คำนวณทุนสำรองขั้นต่ำ ต้องหักขาดทุนสะสมยกมาก่อน
- ถามเงื่อนไขการออกหุ้นต่ำกว่ามูลค่าและการซื้อหุ้นคืน`,

sec:`## ภาพรวม
พ.ร.บ.หลักทรัพย์และตลาดหลักทรัพย์ พ.ศ. 2535 คุ้มครองผู้ลงทุนในตลาดทุน 3 ด้าน คือ การเสนอขายหลักทรัพย์ต้องเปิดเผยข้อมูลครบ บริษัทจดทะเบียนต้องรายงานต่อเนื่อง และห้ามการกระทำอันไม่เป็นธรรม หน่วยงานกำกับคือสำนักงานคณะกรรมการ ก.ล.ต.
## การเสนอขายหลักทรัพย์ต่อประชาชน
- บริษัทมหาชนจำกัดที่จะเสนอขายหุ้นใหม่ต่อประชาชน ต้องได้รับอนุญาตจากสำนักงาน ก.ล.ต.
- ยื่นแบบแสดงรายการข้อมูลการเสนอขายหลักทรัพย์และร่างหนังสือชี้ชวน และขายได้เมื่อแบบนั้นมีผลใช้บังคับแล้ว
- ถ้าข้อมูลในแบบแสดงรายการหรือหนังสือชี้ชวนเป็นเท็จหรือขาดข้อความที่ควรแจ้ง ผู้ซื้อหลักทรัพย์ที่เสียหายเรียกค่าเสียหายได้ และกรรมการกับผู้บริหารต้องร่วมรับผิด เว้นแต่พิสูจน์ได้ว่าไม่รู้ตามฐานะ
@fig sec-flow
## การเปิดเผยข้อมูลต่อเนื่อง
|รายงาน|กำหนด|
|งบการเงินประจำปีที่ผู้สอบบัญชีตรวจสอบแล้ว|ภายใน 3 เดือนนับแต่วันสิ้นรอบปีบัญชี|
|งบการเงินรายไตรมาสที่ผู้สอบบัญชีสอบทานแล้ว|ภายใน 45 วันนับแต่วันสิ้นไตรมาส|
|แบบแสดงรายการข้อมูลประจำปีและรายงานประจำปี|ตามที่ ก.ล.ต. กำหนด ปัจจุบันรวมเป็นแบบ 56-1 One Report|
|เหตุการณ์สำคัญที่กระทบสิทธิผู้ถือหุ้นหรือราคา|รายงานทันทีตามประกาศ|
- กรรมการ ผู้บริหาร และผู้สอบบัญชีของบริษัท ต้องรายงานการถือหลักทรัพย์ของตน คู่สมรส และบุตรที่ยังไม่บรรลุนิติภาวะ เมื่อมีการเปลี่ยนแปลง
## ผู้สอบบัญชีในตลาดทุน
งบการเงินของบริษัทจดทะเบียนและบริษัทที่ออกหลักทรัพย์ต่อประชาชน ต้องตรวจสอบโดยผู้สอบบัญชีที่ได้รับความเห็นชอบจากสำนักงาน ก.ล.ต. ผู้สอบบัญชีที่พบหรือสงสัยการกระทำผิดบางประเภทของกรรมการหรือผู้บริหาร ต้องแจ้งตามที่กฎหมายกำหนด

## การได้มาซึ่งหลักทรัพย์เพื่อครอบงำกิจการ
- ได้มาหรือจำหน่ายหลักทรัพย์จนถึงหรือข้ามทุก 5% ของสิทธิออกเสียง ต้องรายงาน
- ได้มาถึงหรือข้ามจุด 25% 50% หรือ 75% ของสิทธิออกเสียง ต้องทำคำเสนอซื้อหลักทรัพย์ทั้งหมดของกิจการ ตามหลักเกณฑ์ที่ประกาศ
> นักลงทุนถือหุ้นบริษัทจดทะเบียน 22% แล้วซื้อเพิ่มอีก 4% เป็น 26% ข้ามจุด 25% ต้องทำคำเสนอซื้อหลักทรัพย์ทั้งหมด และข้ามจุด 25% ซึ่งเป็นช่วงทุก 5% ด้วย จึงต้องรายงานการได้มาด้วย

## การกระทำอันไม่เป็นธรรม
|การกระทำ|ตัวอย่าง|
|บอกกล่าว เผยแพร่ หรือรับรองข้อความอันเป็นเท็จ|ปล่อยข่าวว่าบริษัทได้สัญญาใหญ่ทั้งที่ไม่จริง เพื่อให้ราคาขึ้น|
|ใช้ข้อมูลภายใน|รู้ผลกำไรที่ยังไม่ประกาศ แล้วซื้อหุ้นหรือบอกคนอื่นให้ซื้อ|
|สร้างราคาหรือปริมาณซื้อขาย|ซื้อขายกันเองหลายบัญชีให้ดูเหมือนมีคนสนใจมาก|
บุคคลที่สันนิษฐานว่าล่วงรู้ข้อมูลภายใน ได้แก่ กรรมการ ผู้บริหาร ผู้สอบบัญชี ที่ปรึกษา และพนักงานที่มีหน้าที่เกี่ยวกับข้อมูลนั้น รวมถึงคู่สมรสและบุตรที่ยังไม่บรรลุนิติภาวะ
> ผู้ช่วยผู้สอบบัญชีรู้จากงานตรวจว่าลูกค้าจะประกาศกำไรดีมาก แล้วชวนญาติซื้อหุ้นก่อนข่าวออก เข้าข่ายใช้ข้อมูลภายใน และผิดจรรยาบรรณเรื่องการรักษาความลับด้วย ซึ่งเชื่อมกับวิชากฎหมาย 2
- นอกจากโทษอาญา ก.ล.ต. ใช้มาตรการลงโทษทางแพ่งได้ เช่น ค่าปรับทางแพ่ง ชดใช้ผลประโยชน์ที่ได้รับ และห้ามเป็นกรรมการหรือผู้บริหาร

## ออกสอบแบบไหน
- ข้อกาถามกำหนดส่งงบการเงินประจำปี 3 เดือน และรายไตรมาส 45 วัน
- ถามจุดที่ต้องทำคำเสนอซื้อ 25% 50% 75% และการรายงานทุก 5%
- ถามสถานการณ์ว่าเข้าข่ายใช้ข้อมูลภายในหรือไม่ และใครถูกสันนิษฐานว่าล่วงรู้`,

fbl:`## ภาพรวม
พ.ร.บ.การประกอบธุรกิจของคนต่างด้าว พ.ศ. 2542 จำกัดว่าคนต่างด้าวทำธุรกิจอะไรในไทยได้บ้าง และต้องขออนุญาตแบบใด ผู้สอบบัญชีต้องรู้เพราะบริการบัญชีเป็นธุรกิจที่คนต่างด้าวต้องขออนุญาต และลูกค้าต่างชาติหลายรายต้องดูโครงสร้างผู้ถือหุ้น
## คนต่างด้าวคือใคร
- บุคคลธรรมดาที่ไม่มีสัญชาติไทย
- นิติบุคคลที่ไม่ได้จดทะเบียนในประเทศไทย
- นิติบุคคลที่จดทะเบียนในประเทศไทย ซึ่งมีหุ้นตั้งแต่กึ่งหนึ่งของทุนถือโดยคนต่างด้าว หรือมีคนต่างด้าวลงทุนมีมูลค่าตั้งแต่กึ่งหนึ่งของทุนทั้งหมด
- ห้างหุ้นส่วนจำกัดหรือห้างหุ้นส่วนสามัญนิติบุคคล ที่หุ้นส่วนผู้จัดการหรือผู้จัดการเป็นคนต่างด้าว
@fig fbl-test
> บริษัทไทยทุน 10 ล้านบาท มีชาวญี่ปุ่นถือหุ้น 49% และคนไทยถือ 51% ไม่เป็นคนต่างด้าวตามกฎหมายนี้ แต่ถ้าชาวญี่ปุ่นถือ 50% พอดี ถือว่าเป็นคนต่างด้าว เพราะกฎหมายใช้คำว่าตั้งแต่กึ่งหนึ่ง
! การใช้คนไทยถือหุ้นแทนคนต่างด้าว เพื่อหลบเลี่ยงกฎหมาย เป็นความผิดทั้งคนไทยที่ถือแทนและคนต่างด้าว
## บัญชีธุรกิจ 3 บัญชี
|บัญชี|ลักษณะ|ตัวอย่าง|ใครอนุญาต|
|บัญชีหนึ่ง|ธุรกิจที่ห้ามคนต่างด้าวประกอบ ด้วยเหตุผลพิเศษ|กิจการหนังสือพิมพ์ วิทยุ โทรทัศน์ ทำนา ทำไร่ ทำสวน ค้าที่ดิน|ห้าม ขออนุญาตไม่ได้|
|บัญชีสอง|เกี่ยวกับความปลอดภัยหรือความมั่นคงของประเทศ หรือมีผลกระทบต่อศิลปวัฒนธรรม จารีตประเพณี หัตถกรรมพื้นบ้าน หรือทรัพยากรธรรมชาติและสิ่งแวดล้อม|ผลิตอาวุธ ขนส่งภายในประเทศทางอากาศ ทำเหมืองแร่บางประเภท|รัฐมนตรีโดยอนุมัติของคณะรัฐมนตรี|
|บัญชีสาม|ธุรกิจที่คนไทยยังไม่พร้อมแข่งขัน|บริการทางบัญชี บริการทางกฎหมาย บริการทางสถาปัตยกรรม การค้าปลีกและค้าส่งบางขนาด ธุรกิจบริการอื่น|อธิบดีกรมพัฒนาธุรกิจการค้า โดยความเห็นชอบของคณะกรรมการ|
- ธุรกิจตามบัญชีสอง คนไทยหรือนิติบุคคลที่ไม่ใช่คนต่างด้าวต้องถือหุ้นไม่น้อยกว่า 40% ของทุน และต้องมีกรรมการเป็นคนไทยไม่น้อยกว่า 2 ใน 5 ของจำนวนกรรมการทั้งหมด เว้นแต่คณะรัฐมนตรีผ่อนผัน
## ทุนขั้นต่ำ
|กรณี|ทุนขั้นต่ำที่นำเข้ามาในประเทศ|
|ธุรกิจที่ไม่ต้องขออนุญาต|ไม่น้อยกว่า 2 ล้านบาท|
|ธุรกิจที่ต้องขออนุญาตตามบัญชีสองหรือสาม|ไม่น้อยกว่า 3 ล้านบาทต่อธุรกิจ หรือตามกฎกระทรวงกำหนด|
## หนังสือรับรองแทนใบอนุญาต
คนต่างด้าวที่ได้รับอนุญาตตามสนธิสัญญาหรือกฎหมายอื่น ขอหนังสือรับรองการประกอบธุรกิจแทนใบอนุญาตได้ เช่น
- ผู้ได้รับการส่งเสริมการลงทุนจาก BOI
- ผู้ประกอบธุรกิจในนิคมอุตสาหกรรมตามกฎหมายการนิคมอุตสาหกรรม
- คนต่างด้าวสัญชาติอเมริกันตามสนธิสัญญาทางไมตรีและความสัมพันธ์ทางเศรษฐกิจ ซึ่งมีข้อยกเว้นธุรกิจบางประเภท เช่น บริการวิชาชีพบางสาขา

## ออกสอบแบบไหน
- ข้อกาถามว่าบริษัทใดเป็นคนต่างด้าว จากสัดส่วนผู้ถือหุ้นหรือผู้จัดการ
- ถามว่าธุรกิจใดอยู่บัญชีใด และใครเป็นผู้อนุญาต
- ถามทุนขั้นต่ำ 2 ล้านกับ 3 ล้านบาท และเงื่อนไขคนไทย 40% กับกรรมการ 2 ใน 5 ของบัญชีสอง`
});

{id:'gen',name:'บททั่วไปของประมวลรัษฎากร',ref:'ลักษณะ 1 และลักษณะ 2 หมวด 1-2',body:`|เรื่อง|กำหนด|

{id:'cit',name:'ภาษีเงินได้นิติบุคคล หลักทั่วไป',ref:'ประมวลรัษฎากร มาตรา 65-70',body:`## ใครเสียภาษีจากอะไร

|บริษัทไทย|กำไรสุทธิจากทั่วโลก|

|บริษัทต่างประเทศไม่ได้ประกอบกิจการในไทย|เงินได้ที่จ่ายจากไทย มาตรา 70 หัก ณ ที่จ่าย|
|จำหน่ายกำไรออกนอกประเทศ|10% ตามมาตรา 70 ทวิ|

|SME|300,001 - 3,000,000|15%|
|SME|ส่วนที่เกิน 3,000,000|20%|

|ภ.ง.ด.51|ภายใน 2 เดือนนับแต่วันสุดท้ายของ 6 เดือนแรก|

{id:'exp',name:'การคำนวณกำไรสุทธิและรายจ่ายต้องห้าม',ref:'ประมวลรัษฎากร มาตรา 65 ทวิ และ 65 ตรี',body:`เริ่มจากกำไรบัญชี แล้วปรับเป็นกำไรทางภาษี บวกรายจ่ายที่ภาษีไม่ให้ หักรายได้ที่ภาษีไม่เก็บ

## เงื่อนไขในมาตรา 65 ทวิ ที่ต้องรู้
- สินค้าคงเหลือ: คำนวณตามราคาทุนหรือราคาตลาด แล้วแต่อย่างใดน้อยกว่า และเปลี่ยนวิธีได้เมื่ออธิบดีอนุมัติ
- โอนทรัพย์สิน ให้บริการ หรือให้กู้ยืมเงิน โดยไม่มีค่าตอบแทน หรือต่ำกว่าราคาตลาดโดยไม่มีเหตุอันสมควร เจ้าพนักงานประเมินตามราคาตลาดได้ เช่น ให้บริษัทในเครือกู้โดยไม่คิดดอกเบี้ย
- ทรัพย์สินหรือหนี้สินที่เป็นเงินตราต่างประเทศ ณ วันสิ้นรอบ ให้คำนวณเป็นเงินบาทตามอัตราที่กฎหมายกำหนด สำหรับธนาคารพาณิชย์อ้างอิงอัตราที่ธนาคารแห่งประเทศไทยคำนวณ
- หนี้สูญ: จำหน่ายได้เมื่อทำตามหลักเกณฑ์ในกฎกระทรวง เช่น มีหลักฐานการติดตามทวงถามแล้ว หรือฟ้องร้องแล้วแล้วแต่จำนวนหนี้
## ค่าสึกหรอและค่าเสื่อมราคา
|ทรัพย์สิน|อัตราสูงสุดต่อปี|
|อาคารถาวร|5%|
|อาคารชั่วคราว|100%|
|ต้นทุนเพื่อให้ได้มาซึ่งทรัพยากรธรรมชาติที่สิ้นเปลืองได้|ตามปริมาณที่ได้ใช้ไป|
|สิทธิการเช่าและสิทธิที่ไม่จำกัดอายุ|10%|

|ทรัพย์สินอื่น เช่น เครื่องจักร ยานพาหนะ|20%|
- ถ้าบัญชีคิดค่าเสื่อมสูงกว่าอัตราสูงสุด ส่วนที่เกินต้องบวกกลับ
- รถยนต์นั่งหรือรถยนต์โดยสารไม่เกิน 10 ที่นั่ง หักค่าเสื่อมได้จากมูลค่าไม่เกิน 1,000,000 บาท และค่าเช่าหักได้ไม่เกินคันละ 36,000 บาทต่อเดือน เว้นแต่ธุรกิจขายหรือให้เช่ารถ
## เงินปันผลรับ
|ผู้รับ|ยกเว้น|

prof:`## ภาพรวม
พ.ร.บ.วิชาชีพบัญชี พ.ศ. 2547 ตั้งสภาวิชาชีพบัญชีขึ้นมากำกับดูแลวิชาชีพบัญชี ออกมาตรฐานการบัญชีและการสอบบัญชี ขึ้นทะเบียนและออกใบอนุญาตผู้สอบบัญชีรับอนุญาต และดูแลจรรยาบรรณ

|การทำบัญชี|ผู้ทำบัญชีของบริษัท|
|การสอบบัญชี|ผู้สอบบัญชีรับอนุญาต|

## โครงสร้างการกำกับ
- สภาวิชาชีพบัญชี มีคณะกรรมการสภาวิชาชีพบัญชีเป็นผู้บริหาร และคณะกรรมการจรรยาบรรณพิจารณาเรื่องร้องเรียน
- คณะกรรมการกำกับดูแลการประกอบวิชาชีพบัญชี เรียกย่อว่า กกบ. ทำหน้าที่ให้ความเห็นชอบมาตรฐาน และพิจารณาอุทธรณ์คำวินิจฉัยของคณะกรรมการจรรยาบรรณ
- ขอบเขตปี 2569 อ้างข้อบังคับสภาวิชาชีพบัญชีว่าด้วยสมาชิก และข้อบังคับว่าด้วยจรรยาบรรณ พ.ศ. 2569 ฉบับใหม่

ethics:`## ภาพรวม
จรรยาบรรณของผู้ประกอบวิชาชีพบัญชีตามข้อบังคับสภาวิชาชีพบัญชี พ.ศ. 2569 วางหลักการพื้นฐาน และใช้กรอบแนวคิดเพื่อจัดการสถานการณ์ที่อาจทำให้หลักการถูกละเมิด คำถามข้อเขียนมักให้สถานการณ์แล้วถามว่ามีอุปสรรคอะไร และควรทำอย่างไร
## หลักการพื้นฐาน
- ความซื่อสัตย์สุจริต: ตรงไปตรงมา ไม่เกี่ยวข้องกับข้อมูลที่เป็นเท็จหรือทำให้เข้าใจผิด
- ความเที่ยงธรรมและความเป็นอิสระ: ไม่ให้ความลำเอียง ผลประโยชน์ขัดกัน หรืออิทธิพลของผู้อื่นมีผลต่อดุลยพินิจ
- ความรู้ ความสามารถ ความเอาใจใส่ และการรักษามาตรฐาน
- การรักษาความลับ: ไม่เปิดเผยหรือใช้ข้อมูลของลูกค้าเพื่อประโยชน์ตนเอง แม้สิ้นสุดงานแล้ว
- พฤติกรรมทางวิชาชีพ: ปฏิบัติตามกฎหมาย และไม่ทำสิ่งที่ทำให้วิชาชีพเสื่อมเสีย
- ความโปร่งใส
! การสรุปเป็น 6 ข้อนี้มาจากบทความที่อธิบายข้อบังคับใหม่ ก่อนสอบให้เทียบถ้อยคำกับข้อบังคับฉบับเต็มอีกครั้ง
## กรอบแนวคิด 3 ขั้น
@fig ethics-frame
- ระบุอุปสรรคที่อาจทำให้ไม่ปฏิบัติตามหลักการพื้นฐาน
- ประเมินว่าอุปสรรคอยู่ในระดับที่ยอมรับได้หรือไม่ โดยใช้มุมมองของบุคคลที่สามที่มีเหตุผลและมีข้อมูลครบ
- จัดการอุปสรรค โดยขจัดสถานการณ์ที่ก่อให้เกิดอุปสรรค ใช้มาตรการป้องกันเพื่อลดอุปสรรค หรือปฏิเสธหรือยุติงาน
## อุปสรรค 5 ประเภท
|อุปสรรค|ความหมาย|ตัวอย่าง|มาตรการที่อาจใช้|
|ผลประโยชน์ส่วนตน|มีผลประโยชน์ทางการเงินหรืออื่น ๆ ที่กระทบดุลยพินิจ|ผู้สอบบัญชีถือหุ้นลูกค้า หรือค่าสอบบัญชีจากลูกค้ารายเดียวสูงมาก|ขายหุ้นออก ให้ผู้สอบทานอิสระตรวจงาน|
|การสอบทานงานตนเอง|ต้องประเมินงานที่ตนเองหรือคนในสำนักงานทำไว้|ทำบัญชีให้ลูกค้าแล้วตรวจสอบเอง|ใช้ทีมที่แยกกัน หรือไม่รับงานนั้น|
|การเป็นตัวแทน|สนับสนุนจุดยืนของลูกค้าจนกระทบความเที่ยงธรรม|ไปเป็นทนายหรือพยานแก้ต่างแทนลูกค้าในคดี|ไม่รับงานที่เป็นตัวแทน|
|ความคุ้นเคย|สนิทหรือคุ้นเคยนานจนเห็นใจลูกค้าเกินไป|ตรวจลูกค้ารายเดิมนานมาก หรือมีญาติเป็นผู้บริหารลูกค้า|หมุนเวียนผู้สอบบัญชี หรือเปลี่ยนสมาชิกทีม|
|การข่มขู่|ถูกกดดันจริงหรือรู้สึกว่าถูกกดดัน|ลูกค้าขู่จะเปลี่ยนผู้สอบบัญชีถ้าไม่ยอมตามรายการบัญชีที่ต้องการ|หารือผู้มีหน้าที่กำกับดูแล ปรึกษาผู้บริหารสำนักงาน|
> ผู้สอบบัญชีได้รับเชิญไปพักรีสอร์ตฟรีจากลูกค้าในช่วงที่กำลังตรวจสอบ เป็นอุปสรรคจากผลประโยชน์ส่วนตนและความคุ้นเคย ถ้ามูลค่าไม่ใช่ระดับเล็กน้อยและไม่สำคัญ ต้องปฏิเสธ
## ความเป็นอิสระในงานสอบบัญชี
- ห้ามผู้สอบบัญชีและทีมงานมีส่วนได้เสียทางการเงินโดยตรงในลูกค้า หรือทางอ้อมที่มีสาระสำคัญ
- ห้ามกู้ยืมหรือค้ำประกันกับลูกค้า เว้นแต่ลูกค้าเป็นสถาบันการเงินที่ให้กู้ตามเงื่อนไขปกติ
- ค่าธรรมเนียมแบบขึ้นกับผลลัพธ์ ห้ามใช้กับงานสอบบัญชี
- การให้บริการที่ไม่ใช่งานให้ความเชื่อมั่นแก่ลูกค้างานสอบบัญชี เช่น ทำบัญชี ต้องพิจารณาอุปสรรคการสอบทานงานตนเอง และสำหรับกิจการที่มีส่วนได้เสียสาธารณะมีข้อห้ามเข้มกว่า
- บริษัทจดทะเบียนต้องหมุนเวียนผู้สอบบัญชีตามหลักเกณฑ์ของ ก.ล.ต. เมื่อตรวจครบจำนวนรอบปีบัญชีที่กำหนด และต้องเว้นช่วงก่อนกลับมาตรวจใหม่
## การรักษาความลับ และเมื่อใดเปิดเผยได้
- เปิดเผยได้เมื่อกฎหมายกำหนด เช่น ศาลสั่ง หรือแจ้งการกระทำผิดตามกฎหมายฟอกเงิน
- เปิดเผยได้เมื่อลูกค้าอนุญาต
- เปิดเผยได้เมื่อเป็นหน้าที่ทางวิชาชีพ เช่น การตรวจคุณภาพงานโดยสภาวิชาชีพบัญชี หรือการตอบข้อซักถามในกระบวนการจรรยาบรรณ
- ข้อมูลที่ได้จากลูกค้าเดิม ห้ามนำไปใช้ประโยชน์กับลูกค้ารายใหม่หรือประโยชน์ส่วนตัว
## การไม่ปฏิบัติตามกฎหมายและข้อบังคับของลูกค้า
เมื่อผู้ประกอบวิชาชีพพบหรือสงสัยว่าลูกค้าไม่ปฏิบัติตามกฎหมายที่สำคัญ ต้องทำความเข้าใจเรื่องนั้น หารือกับผู้บริหารระดับที่เหมาะสมหรือผู้มีหน้าที่กำกับดูแล พิจารณาว่าต้องรายงานต่อหน่วยงานภายนอกหรือไม่ และบันทึกเรื่องไว้ เรื่องนี้เชื่อมกับ TSA 250 ในวิชาการสอบบัญชี 2

## ออกสอบแบบไหน
- ข้อกาให้สถานการณ์แล้วถามว่าเป็นอุปสรรคประเภทใด
- ถามเมื่อใดเปิดเผยข้อมูลลูกค้าได้

const SUB=CPA.subjects,byId=Object.fromEntries(SUB.map(s=>[s.id,s]));
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const KEY='cpa-notebook-v1';
const blank=()=>({v:1,ts:0,ans:{},read:{},cards:{},essays:{},lib:{},mocks:[],target:'',hrs:15,plan:['ac1','ac2','law1','law2'],cur:null});
let store='memory',st=load(),dbRef=null,dbTimer=0,dbBusy=false,dbAgain=false;
function load(){
 try{const r=localStorage.getItem(KEY);store='local';if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){store='memory'}
 return blank();
}
function save(){
 st.ts=Date.now();
 try{localStorage.setItem(KEY,JSON.stringify(st));if(store==='memory')store='local'}catch(e){store='memory'}
 if(dbRef){clearTimeout(dbTimer);dbTimer=setTimeout(pushDb,1600)}
}
async function pushDb(){
 if(dbBusy){dbAgain=true;return}
 dbBusy=true;
 try{const json=JSON.stringify(st);if(json.length<240000)await dbRef.set({json,ts:st.ts})}catch(e){}
 dbBusy=false;
 if(dbAgain){dbAgain=false;pushDb()}
}
async function attachDb(){
 try{
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.collection('data/users/'+id).doc('progress');
  const snap=await ref.get();
  dbRef=ref;store='db';
  if(snap.exists){
   const d=snap.data();
   if(d&&d.ts>st.ts&&d.json){
    st=Object.assign(blank(),JSON.parse(d.json));
    try{localStorage.setItem(KEY,d.json)}catch(e){}
    const a=document.activeElement;
    if(!(a&&/TEXTAREA|INPUT/.test(a.tagName))&&!st.cur)route();
   }else if(st.ts>(d&&d.ts||0))pushDb();
  }else if(st.ts)pushDb();

}

/* ---------- ตัวแปลงเนื้อหา ---------- */
function table(g){
 const rows=g.map(l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim()));
 const n=Math.max(...rows.map(r=>r.length));
 const isNum=c=>/^[-–(]?\d[\d,]*(\.\d+)?\)?%?$/.test(c);
 const numCol=[];
 for(let c=0;c<n;c++){const b=rows.slice(1).map(r=>r[c]||'').filter(Boolean);numCol[c]=b.length>0&&b.filter(isNum).length/b.length>=.6}
 const cell=(tag,c,i)=>`<${tag}${numCol[i]?' class="num"':''}>${esc(c)}</${tag}>`;
 const last=rows[rows.length-1][0]||'';
 const calc=rows.length>2&&numCol.some(Boolean)&&/^(รวม|คงเหลือ|สุทธิ|ยอดรวม)/.test(last);
 const fill=r=>{const o=r.slice();while(o.length<n)o.push('');return o};
 return `<div class="tw"><table${calc?' class="calc"':''}><thead><tr>${fill(rows[0]).map((c,i)=>cell('th',c,i)).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${fill(r).map((c,i)=>cell('td',c,i)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function md(src){
 const lines=String(src||'').trim().split('\n');let out='',i=0;
 const kind=l=>/^@fig /.test(l)?'fig':/^### /.test(l)?'h3':/^## /.test(l)?'h':/^> /.test(l)?'eg':/^! /.test(l)?'trap':/^- /.test(l)?'ul':/^\|/.test(l)?'tb':l.trim()?'p':'';
 while(i<lines.length){
  const k=kind(lines[i]);if(!k){i++;continue}
  const g=[];
  while(i<lines.length&&kind(lines[i])===k){g.push(lines[i]);i++;if(k==='h'||k==='h3')break}
  if(k==='fig'){g.forEach(l=>{const f=(CPA.figs||{})[l.slice(5).trim()];if(f)out+=`<figure class="fig"><div class="figscroll">${f.svg}</div><figcaption>${esc(f.cap)}</figcaption></figure>`})}
  else if(k==='h3')out+=`<h5>${esc(g[0].slice(4))}</h5>`;
  else if(k==='h')out+=`<h4>${esc(g[0].slice(3))}</h4>`;
  else if(k==='eg')out+=`<div class="eg"><span class="tag">ตัวอย่าง</span><p>${g.map(l=>esc(l.slice(2))).join('<br>')}</p></div>`;
  else if(k==='trap')out+=`<div class="trap"><span class="tag">จุดหลอก</span><p>${g.map(l=>esc(l.slice(2))).join('<br>')}</p></div>`;
  else if(k==='ul')out+=`<ul>${g.map(l=>`<li>${esc(l.slice(2))}</li>`).join('')}</ul>`;
  else if(k==='tb')out+=table(g);
  else out+=`<p>${g.map(esc).join('<br>')}</p>`;
 }
 return out;
}

const topic=(sid,t)=>byId[sid].topics.find(x=>x.id===t);
const wp=(sid,t)=>byId[sid].code+'-'+(byId[sid].topics.findIndex(x=>x.id===t)+1);
function statOf(sid,tid){
 const s=byId[sid];let total=0,done=0,right=0;
 s.mcq.forEach((m,i)=>{if(tid&&m[0]!==tid)return;total++;const a=st.ans[sid+'-'+i];if(a){done++;if(a.ok)right++}});
 const read=s.topics.filter(t=>st.read[sid+'-'+t.id]).length;
 return{total,done,right,read,topics:s.topics.length};
}
function record(id,ok){
 const a=st.ans[id]||{n:0,c:0,ok:false,wrong:false,streak:0};
 a.n++;a.ok=ok;a.t=Date.now();
 if(ok){a.c++;a.streak++;if(a.wrong&&a.streak>=2)a.wrong=false}
 else{a.streak=0;a.wrong=true}
 st.ans[id]=a;
}
const wrongs=sid=>{const o=[];SUB.forEach(s=>{if(sid&&s.id!==sid)return;s.mcq.forEach((m,i)=>{const a=st.ans[s.id+'-'+i];if(a&&a.wrong)o.push([s.id,i])})});return o};
function daysLeft(){
 if(!st.target)return null;
 const d=new Date(st.target+'T00:00:00');if(isNaN(d))return null;
 const n=new Date();n.setHours(0,0,0,0);
 return Math.round((d-n)/dayMs);
}

let Q=null;
const mkQ=(sid,i)=>{const m=byId[sid].mcq[i];return{sid,i,id:sid+'-'+i,t:m[0],stem:m[1],opts:m[2],key:m[3],exp:m[4],order:shuffle(m[2].map((_,k)=>k))}};
function quiz(list,box,o){
 o=o||{};

 if(Q.list.length)Q.cur=mkQ(...Q.list[0]);

}
function qHtml(q,chosen,tail){
 const done=chosen!=null,ok=done&&chosen===q.key;
 return `<div class="q"><div class="qmeta"><span>${wp(q.sid,q.t)} ${esc(topic(q.sid,q.t).name)}</span><span>${tail||''}</span></div>
 <p class="stem">${esc(q.stem)}</p>
 <div class="opts">${q.order.map((o,n)=>{let c='';if(done){if(o===q.key)c=' right';else if(o===chosen)c=' wrong'}
  return `<button class="opt${c}" data-a="pick" data-o="${o}"${done?' disabled':''}><span class="bub">${LAB[n]}</span><span>${esc(q.opts[o])}</span></button>`}).join('')}</div>
 ${done?`<div class="fb${ok?'':' no'}"><b>${ok?'ถูกต้อง':'ยังไม่ถูก คำตอบคือ '+LAB[q.order.indexOf(q.key)]}</b><p>${esc(q.exp)}</p></div>
 <div class="row"><button class="btn" data-a="next" id="nextq">ข้อต่อไป</button><a class="btn ghost" href="#${q.sid}-learn-${q.t}">อ่านบทเรียนเรื่องนี้</a></div>`:''}</div>`;
}
function drawQuiz(){
 if(!Q)return;const el=$('#'+Q.box);if(!el)return;
 if(!Q.list.length){el.innerHTML=Q.o.empty||'<p>ไม่มีโจทย์ในเงื่อนไขนี้</p>';return}
 if(Q.pos>=Q.list.length){
  el.innerHTML=`<div class="q"><h3>จบรอบนี้แล้ว</h3><p class="big">${Q.right}/${Q.n}</p><p>คิดเป็น ${pct(Q.right,Q.n)}% เกณฑ์ผ่านของจริงคือ 60%</p><div class="row"><button class="btn" data-a="again">ทำอีกรอบ</button><a class="btn ghost" href="#review">เปิดสมุดข้อผิด</a></div></div>`;
  return;
 }
 const tail=Q.o.tail||`ข้อ ${Q.pos+1}/${Q.list.length}${Q.n?` · ถูก ${Q.right}/${Q.n}`:''}`;
 el.innerHTML=qHtml(Q.cur,Q.chosen,tail);
}

function buildPlan(){
 const subs=SUB.filter(s=>st.plan.includes(s.id));if(!subs.length)return '<p class="note">เลือกอย่างน้อย 1 วิชา</p>';
 const left=daysLeft(),weeks=left&&left>0?Math.max(1,Math.ceil(left/7)):12,mockW=Math.max(1,Math.round(weeks*.2)),study=Math.max(1,weeks-mockW);
 const w=subs.reduce((a,s)=>a+s.topics.length,0);let alloc=subs.map(s=>Math.max(1,Math.round(study*s.topics.length/w)));
 while(alloc.reduce((a,b)=>a+b,0)>study&&alloc.some(x=>x>1)){alloc[alloc.indexOf(Math.max(...alloc))]--}
 while(alloc.reduce((a,b)=>a+b,0)<study){alloc[alloc.indexOf(Math.min(...alloc))]++}
 const rows=[];let wk=0;const start=new Date();start.setHours(0,0,0,0);
 const when=n=>thaiDate(new Date(start.getTime()+n*7*dayMs));
 subs.forEach((s,i)=>{const n=alloc[i],t=s.topics.length;for(let k=0;k<n;k++){const a=Math.floor(k*t/n),b=Math.max(a+1,Math.floor((k+1)*t/n));rows.push([++wk,when(wk-1),s.code,a<t?`หัวข้อ ${a+1}${b-1>a?'–'+Math.min(b,t):''} พร้อมโจทย์ของหัวข้อ`:'ทบทวนสมุดข้อผิด'])}});
 for(let k=0;k<mockW;k++)rows.push([++wk,when(wk-1),'รวม',k===mockW-1?'อ่านสรุปก่อนสอบ และเก็บสมุดข้อผิดให้หมด':'ข้อสอบจำลองเต็มรูปแบบ และเฉลยเก่าจากคลัง']);
 const shown=rows.slice(0,60);
 return `<p class="note">${weeks} สัปดาห์ ประมาณ ${st.hrs*weeks} ชั่วโมง สัปดาห์ละ ${st.hrs} ชั่วโมง เฉลี่ย ${(st.hrs*weeks/subs.length).toFixed(0)} ชั่วโมงต่อวิชา</p><div class="tw"><table><thead><tr><th class="num">สัปดาห์</th><th>เริ่ม</th><th>วิชา</th><th>งาน</th></tr></thead><tbody>${shown.map(r=>`<tr><td class="num">${r[0]}</td><td>${r[1]}</td><td class="code">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
}

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='etext'){const r=st.essays[t.dataset.k]=st.essays[t.dataset.k]||{};r.text=t.value;save()}
 else if(t.id==='mtext'){st.cur.text[t.dataset.k]=t.value;save()}
 else if(t.id==='ptarget'){st.target=t.value;save();$('#plantable').innerHTML=buildPlan()}
 else if(t.id==='phrs'){st.hrs=Math.max(1,Math.min(100,+t.value||1));save();$('#plantable').innerHTML=buildPlan()}
});
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(Q&&Q.cur&&Q.chosen==null&&/^[1-4]$/.test(e.key)&&$('#'+Q.box)){const b=$$('.opt',$('#'+Q.box))[+e.key-1];if(b){e.preventDefault();b.click()}}
});
window.addEventListener('hashchange',route);
setInterval(()=>{
 const c=st.cur;if(!c||location.hash.slice(1)!=='mock'||document.hidden)return;
 c.used++;const left=c.limit*60-c.used,el=$('#timer');
 if(el){el.textContent=clock(left);el.classList.toggle('low',left<600)}
 if(c.used%20===0)save();
 if(left<=0)mockFinish();
},1000);
route();
attachDb();
})();
</script>
</body></html>
