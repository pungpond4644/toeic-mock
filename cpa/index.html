## ลักษณะเชิงคุณภาพ
|กลุ่ม|ประกอบด้วย|จำง่าย ๆ|
|พื้นฐาน|ความเกี่ยวข้องกับการตัดสินใจ, การเป็นตัวแทนอันเที่ยงธรรม|ข้อมูลต้องมีประโยชน์และตรงความจริง|

## นิยามที่ต้องจำ
- สินทรัพย์ คือทรัพยากรเชิงเศรษฐกิจในปัจจุบันที่กิจการควบคุม และเกิดจากเหตุการณ์ในอดีต
- หนี้สิน คือภาระผูกพันในปัจจุบันที่จะโอนทรัพยากรเชิงเศรษฐกิจ และเกิดจากเหตุการณ์ในอดีต
- ส่วนของเจ้าของ คือส่วนได้เสียคงเหลือหลังหักหนี้สินทั้งหมด

> ร้านกาแฟเช่าเครื่องชงระยะยาว แม้กรรมสิทธิ์ไม่ใช่ของร้าน แต่ร้านควบคุมสิทธิการใช้ จึงมีสินทรัพย์ได้ นิยามนี้ดูที่การควบคุม ไม่ได้ดูที่ชื่อเจ้าของ

! นิยามฉบับปัจจุบันไม่ได้ใช้คำว่า "คาดว่าจะมีประโยชน์เชิงเศรษฐกิจเข้าสู่กิจการ" เป็นส่วนหนึ่งของนิยามแล้ว ความไม่แน่นอนไปอยู่ที่ขั้นการรับรู้และการวัดมูลค่า`},
{id:'tas2',name:'สินค้าคงเหลือ',ref:'TAS 2',body:`หลักใหญ่มีข้อเดียว: แสดงสินค้าด้วย ราคาทุนหรือมูลค่าสุทธิที่จะได้รับ แล้วแต่อย่างใดจะต่ำกว่า

## อะไรรวมในราคาทุน
|รวมในราคาทุน|เป็นค่าใช้จ่ายทันที|

|ค่าแรงทางตรงและค่าใช้จ่ายการผลิตที่ปันส่วน|ค่าเก็บรักษาสินค้าสำเร็จรูปรอขาย|
|หัก ส่วนลดการค้าและเงินคืน|ของเสียที่เกินปกติ|

## มูลค่าสุทธิที่จะได้รับ
มูลค่าสุทธิที่จะได้รับ = ราคาขายโดยประมาณ − ต้นทุนส่วนที่เหลือ − ค่าใช้จ่ายในการขาย

> เสื้อทุนตัวละ 700 ป้ายขาย 720 แต่ต้องจ่ายค่าส่ง 60 เท่ากับได้เงินจริง 660 ต้องปรับลดตัวละ 40

## ค่าใช้จ่ายการผลิตคงที่
ปันส่วนตามกำลังการผลิตปกติ ส่วนที่ปันส่วนไม่หมดเพราะผลิตได้น้อยเป็นค่าใช้จ่ายทันที

! ห้ามใช้วิธีเข้าหลังออกก่อน และการกลับรายการปรับลดทำได้ไม่เกินยอดที่เคยปรับลด`},
{id:'fi',name:'เครื่องมือทางการเงิน',ref:'TFRS 9',body:`คิดเป็นสองคำถามตามลำดับ: กระแสเงินสดเป็นเงินต้นกับดอกเบี้ยล้วนหรือไม่ (SPPI) แล้วกิจการถือไว้ด้วยโมเดลธุรกิจแบบใด

## การจัดประเภทสินทรัพย์ทางการเงิน
|โมเดลธุรกิจ (ผ่าน SPPI)|การวัดมูลค่า|
|ถือเพื่อรับกระแสเงินสดตามสัญญา|ราคาทุนตัดจำหน่าย|
|ถือเพื่อรับกระแสเงินสดและเพื่อขาย|มูลค่ายุติธรรมผ่านกำไรขาดทุนเบ็ดเสร็จอื่น|
|อื่น ๆ หรือไม่ผ่าน SPPI|มูลค่ายุติธรรมผ่านกำไรหรือขาดทุน|

ตราสารทุนโดยปกติวัดผ่านกำไรหรือขาดทุน แต่เลือกแบบเพิกถอนไม่ได้ให้ผ่านกำไรขาดทุนเบ็ดเสร็จอื่นได้ ถ้าไม่ได้ถือเพื่อค้า และเมื่อขายจะไม่โอนกำไรเข้ากำไรหรือขาดทุน เงินปันผลยังรับรู้ในกำไรหรือขาดทุน

## ผลขาดทุนด้านเครดิตที่คาดว่าจะเกิดขึ้น

|2|ความเสี่ยงเพิ่มขึ้นมีนัยสำคัญ|ตลอดอายุ|ยอดก่อนหักค่าเผื่อ|

ลูกหนี้การค้าที่ไม่มีองค์ประกอบทางการเงินที่มีนัยสำคัญใช้วิธีอย่างง่าย คือรับรู้ตลอดอายุตั้งแต่แรก

## ราคาทุนตัดจำหน่าย
ยอดปลายงวด = ยอดต้นงวด + ดอกเบี้ยตามอัตราดอกเบี้ยที่แท้จริง − เงินสดรับตามอัตราหน้าตั๋ว`},
{id:'group',name:'การรวมธุรกิจและงบการเงินรวม',ref:'TFRS 3, TFRS 10',body:`การรวมธุรกิจคือการซื้อการควบคุม ผู้ซื้อวัดสินทรัพย์และหนี้สินที่ได้มาด้วยมูลค่ายุติธรรม ณ วันซื้อ

## การควบคุม
ต้องมีครบสามข้อ: มีอำนาจเหนือกิจการ มีสิทธิหรือความเสี่ยงต่อผลตอบแทนผันแปร และใช้อำนาจนั้นกระทบผลตอบแทนของตนได้

## ค่าความนิยม
|รายการ|บาท|
|สิ่งตอบแทนที่โอนให้|8,000,000|
|บวก ส่วนได้เสียที่ไม่มีอำนาจควบคุม 20% ของ 8,500,000|1,700,000|
|หัก สินทรัพย์สุทธิมูลค่ายุติธรรม|(8,500,000)|
|ค่าความนิยม|1,200,000|

ส่วนได้เสียที่ไม่มีอำนาจควบคุมวัดได้สองแบบ เลือกเป็นรายการ คือตามสัดส่วนในสินทรัพย์สุทธิ หรือมูลค่ายุติธรรม ถ้าผลลัพธ์ติดลบเป็นการซื้อในราคาต่ำกว่ามูลค่า รับรู้กำไรในกำไรหรือขาดทุนหลังทบทวนการวัดมูลค่าแล้ว

## จุดที่ข้อเขียนชอบถาม
- ค่าที่ปรึกษาและค่าใช้จ่ายในการซื้อ เป็นค่าใช้จ่ายทันที
- สิ่งตอบแทนที่อาจต้องจ่ายเพิ่ม รวมด้วยมูลค่ายุติธรรม ณ วันซื้อ
- ตัดรายการระหว่างกันทั้งหมด และตัดกำไรในสินค้าที่ยังขายไม่ออก

> แม่ขายของให้ลูกแล้วลูกยังขายไม่ได้ เหมือนย้ายเงินจากกระเป๋าซ้ายไปขวา กลุ่มยังไม่ได้กำไรจากคนนอก จึงต้องตัดกำไรส่วนนั้นออก`},
{id:'assoc',name:'เงินลงทุนในบริษัทร่วมและการร่วมการงาน',ref:'TAS 28, TAS 27, TFRS 11, TFRS 12',body:`ถือหุ้น 20% ขึ้นไปโดยปกติสันนิษฐานว่ามีอิทธิพลอย่างมีนัยสำคัญ ใช้วิธีส่วนได้เสีย

## วิธีส่วนได้เสีย
ยอดเงินลงทุน = ราคาทุน + ส่วนแบ่งกำไร − เงินปันผลรับ

เงินปันผลลดเงินลงทุน ไม่ใช่รายได้ เพราะเราบันทึกส่วนแบ่งกำไรไปก่อนแล้ว

|การดำเนินงานร่วมกัน|มีสิทธิในสินทรัพย์และภาระในหนี้สินโดยตรง|รับรู้สินทรัพย์ หนี้สิน รายได้ ค่าใช้จ่ายส่วนของตน|

## หลังรับรู้เมื่อเริ่มแรก
- วิธีราคาทุน: ราคาทุน − ค่าเสื่อมสะสม − ขาดทุนจากการด้อยค่า
- วิธีตีราคาใหม่: เพิ่มเข้ากำไรขาดทุนเบ็ดเสร็จอื่น ลดให้หักส่วนเกินเดิมก่อน ส่วนที่เหลือเข้ากำไรหรือขาดทุน

> ที่ดินทุน 10 ล้าน ตีเพิ่มเป็น 12.5 ล้าน ปีต่อมาลดเหลือ 9.4 ล้าน ลดรวม 3.1 ล้าน หักส่วนเกิน 2.5 ล้านก่อน อีก 0.6 ล้านเป็นขาดทุน

## ค่าเสื่อมราคา
เปลี่ยนอายุหรือราคาซากเป็นการเปลี่ยนประมาณการ ใช้ไปข้างหน้า ไม่ปรับย้อนหลัง ส่วนประกอบที่มีสาระสำคัญต้องแยกคิดค่าเสื่อม

## ต้นทุนการกู้ยืม
สินทรัพย์ที่เข้าเงื่อนไขต้องรวมต้นทุนการกู้ยืมเข้าราคาทุน เงินกู้เฉพาะเจาะจงใช้ดอกเบี้ยจริงหักรายได้จากการนำเงินไปลงทุนชั่วคราว เงินกู้ทั่วไปใช้อัตราการตั้งขึ้นเป็นทุนคูณรายจ่ายถัวเฉลี่ย`},

## หลังวันเริ่มต้น
- หนี้สิน: เพิ่มด้วยดอกเบี้ย ลดด้วยค่าเช่าที่จ่าย
- สินทรัพย์: คิดค่าเสื่อมราคาตลอดอายุสัญญาหรืออายุการใช้งาน แล้วแต่อย่างใดสั้นกว่า ถ้ากรรมสิทธิ์จะโอนมาหรือแน่ใจว่าจะใช้สิทธิซื้อให้ใช้อายุการใช้งาน

> เหมือนกู้เงินมาซื้อสิทธิใช้ของ ดอกเบี้ยมาจากฝั่งหนี้ ค่าเสื่อมมาจากฝั่งสินทรัพย์ ค่าใช้จ่ายรวมจึงสูงช่วงต้นสัญญา`},

## หน่วยสินทรัพย์ที่ก่อให้เกิดเงินสด
ปันส่วนผลขาดทุนให้ค่าความนิยมก่อน ที่เหลือแบ่งตามสัดส่วนราคาตามบัญชีของสินทรัพย์อื่น

## การกลับรายการ
- สินทรัพย์ทั่วไปกลับได้ แต่ไม่เกินราคาตามบัญชีสุทธิที่ควรเป็นถ้าไม่เคยด้อยค่า
- ค่าความนิยมห้ามกลับรายการ
- ค่าความนิยมและสินทรัพย์ไม่มีตัวตนอายุไม่ทราบแน่นอนต้องทดสอบทุกปี`},

|รายการ|ราคาตามบัญชีเทียบฐานภาษี|ผล|

## หลักที่ต้องจำ
- สินทรัพย์ภาษีรับรู้เท่าที่น่าจะมีกำไรทางภาษีมาใช้
- ใช้อัตราภาษีที่คาดว่าจะใช้เมื่อกลับรายการ ตามกฎหมายที่มีผลแล้วหรือค่อนข้างแน่นอน ณ วันสิ้นงวด
- ไม่คิดลดเป็นมูลค่าปัจจุบัน
- รายการที่อยู่ในกำไรขาดทุนเบ็ดเสร็จอื่น ภาษีต้องไปอยู่ที่เดียวกัน
- ไม่รับรู้หนี้สินภาษีจากการรับรู้ค่าความนิยมเมื่อเริ่มแรก`},

## การวัดมูลค่า
ใช้ประมาณการที่ดีที่สุด รายการจำนวนมากใช้ค่าคาดหวัง รายการเดี่ยวใช้ผลลัพธ์ที่น่าจะเกิดที่สุด ถ้าผลของเวลามีสาระสำคัญให้คิดลด

## กรณีเฉพาะ
- ขาดทุนจากการดำเนินงานในอนาคต ไม่รับรู้
- สัญญาที่สร้างภาระ รับรู้ด้วยต้นทุนสุทธิที่ต่ำกว่าระหว่างการทำตามสัญญากับค่าปรับ
- การปรับโครงสร้าง ต้องมีแผนละเอียดและประกาศให้ผู้เกี่ยวข้องคาดหวังแล้ว
- เงินชดเชยจากบุคคลอื่น รับรู้แยกเป็นสินทรัพย์เมื่อค่อนข้างแน่นอนว่าจะได้รับ
- สินทรัพย์ที่อาจเกิดขึ้น ไม่รับรู้ เปิดเผยเมื่อน่าจะได้รับ

["ip","กิจการใช้วิธีมูลค่ายุติธรรมกับอสังหาริมทรัพย์เพื่อการลงทุน มูลค่าเพิ่มจาก 40,000,000 บาท เป็น 43,500,000 บาท ผลกระทบข้อใดถูกต้อง",["กำไร 3,500,000 บาท ในกำไรหรือขาดทุน และไม่คิดค่าเสื่อมราคา","ส่วนเกินทุน 3,500,000 บาท ในกำไรขาดทุนเบ็ดเสร็จอื่น และไม่คิดค่าเสื่อมราคา","กำไร 3,500,000 บาท ในกำไรหรือขาดทุน และคิดค่าเสื่อมราคาจากมูลค่าใหม่","ไม่บันทึกผลต่าง แต่เปิดเผยมูลค่ายุติธรรมในหมายเหตุเท่านั้น"],0,"ตามวิธีมูลค่ายุติธรรม การเปลี่ยนแปลงเข้ากำไรหรือขาดทุนทันทีและไม่มีค่าเสื่อม"],
["ip","อาคารที่บริษัทใหญ่ให้บริษัทย่อยเช่าใช้เป็นสำนักงาน ควรจัดประเภทอย่างไรในงบการเงินรวม",["ที่ดิน อาคาร และอุปกรณ์","อสังหาริมทรัพย์เพื่อการลงทุน","สินค้าคงเหลือ","สินทรัพย์ไม่หมุนเวียนที่ถือไว้เพื่อขาย"],0,"ในมุมกลุ่มกิจการ อาคารนี้กลุ่มใช้เอง จึงเป็นสินทรัพย์ตาม TAS 16"],
["ip","โอนสินค้าคงเหลือไปเป็นอสังหาริมทรัพย์เพื่อการลงทุนที่ใช้วิธีมูลค่ายุติธรรม ผลต่างระหว่างมูลค่ายุติธรรมกับราคาตามบัญชีบันทึกที่ใด",["กำไรหรือขาดทุน","กำไรขาดทุนเบ็ดเสร็จอื่น","กำไรสะสมโดยตรง","ไม่บันทึกจนกว่าจะขาย"],0,"การโอนจากสินค้าคงเหลือให้รับรู้ผลต่างในกำไรหรือขาดทุน ต่างจากการโอนจาก TAS 16 ที่ปฏิบัติแบบการตีราคาใหม่"],

["imp","หน่วยสินทรัพย์มีค่าความนิยม 1,000,000 บาท อาคาร 6,000,000 บาท อุปกรณ์ 2,000,000 บาท มูลค่าที่คาดว่าจะได้รับคืน 7,400,000 บาท ผลขาดทุนที่ปันส่วนให้อาคารเท่ากับเท่าใด",["450,000 บาท","1,200,000 บาท","600,000 บาท","150,000 บาท"],0,"ขาดทุน 1,600,000 ตัดค่าความนิยมก่อน 1,000,000 เหลือ 600,000 แบ่งอาคาร 6/8 = 450,000 อุปกรณ์ 150,000"],
["imp","ข้อใดกลับรายการผลขาดทุนจากการด้อยค่าไม่ได้",["ค่าความนิยม","อาคารที่ใช้วิธีราคาทุน","อุปกรณ์สำนักงาน","สินทรัพย์ไม่มีตัวตนอายุจำกัด"],0,"ค่าความนิยมห้ามกลับรายการทุกกรณี รวมถึงที่รับรู้ในงบระหว่างกาลตาม TFRIC 10"],

["tax","ข้อใดกล่าวถึงภาษีเงินได้รอการตัดบัญชีได้ถูกต้อง",["ห้ามคิดลดเป็นมูลค่าปัจจุบัน","ต้องคิดลดด้วยอัตราพันธบัตรรัฐบาล","รับรู้สินทรัพย์ภาษีได้เสมอแม้ไม่มีกำไรในอนาคต","ใช้อัตราภาษีในวันที่รายการเกิดขึ้นตลอดไป"],0,"TAS 12 ห้ามคิดลด และต้องวัดด้วยอัตราที่คาดว่าจะใช้เมื่อกลับรายการ"],
["prov","คดีความมีโอกาสแพ้ 30% และถ้าแพ้ต้องจ่าย 5,000,000 บาท ไม่ถือว่าเกิดได้ยาก กิจการควรทำอย่างไร",["เปิดเผยหนี้สินที่อาจเกิดขึ้น","รับรู้ประมาณการหนี้สิน 5,000,000 บาท","รับรู้ประมาณการหนี้สิน 1,500,000 บาท","ไม่ต้องเปิดเผย"],0,"โอกาส 30% ยังไม่ถึงน่าจะเกิด จึงไม่รับรู้ แต่ไม่ถึงกับเกิดได้ยาก จึงเปิดเผย"],
["prov","ขายสินค้า 20,000 หน่วย คาดว่า 70% ไม่เสีย 25% ซ่อมเล็กหน่วยละ 300 บาท 5% ซ่อมใหญ่หน่วยละ 1,500 บาท ประมาณการหนี้สินเท่ากับเท่าใด",["3,000,000 บาท","1,500,000 บาท","6,000,000 บาท","360,000 บาท"],0,"ค่าคาดหวังต่อหน่วย (25% × 300) + (5% × 1,500) = 150 × 20,000 = 3,000,000"],
["prov","ข้อใดรับรู้เป็นประมาณการหนี้สินได้",["สัญญาที่สร้างภาระซึ่งต้นทุนทำตามสัญญาสูงกว่าประโยชน์ที่จะได้รับ","ผลขาดทุนจากการดำเนินงานที่คาดว่าจะเกิดขึ้นในปีหน้าตามงบประมาณ","งบซ่อมบำรุงใหญ่ที่ผู้บริหารตั้งใจทำในอนาคตตามแผนห้าปี","แผนปรับโครงสร้างที่คณะกรรมการอนุมัติแล้วแต่ยังไม่ได้ประกาศ"],0,"สัญญาที่สร้างภาระเป็นภาระผูกพันปัจจุบัน ส่วนตัวเลือกอื่นยังไม่มีภาระผูกพันจากเหตุการณ์ในอดีต"],

["emp","การวัดมูลค่าใหม่ของหนี้สินผลประโยชน์ที่กำหนดไว้บันทึกอย่างไร",["กำไรขาดทุนเบ็ดเสร็จอื่น และไม่โอนเข้ากำไรหรือขาดทุนในภายหลัง","กำไรหรือขาดทุนทันที","กำไรขาดทุนเบ็ดเสร็จอื่น และโอนเข้ากำไรหรือขาดทุนเมื่อจ่ายเงิน","ทยอยตัดจำหน่ายตามอายุพนักงาน"],0,"การวัดมูลค่าใหม่อยู่ในกำไรขาดทุนเบ็ดเสร็จอื่นและไม่มีการโอนกลับ"]

{t:'group',title:'ค่าความนิยมและส่วนได้เสียที่ไม่มีอำนาจควบคุม',q:`วันที่ 1 มกราคม 2569 บริษัท แม่ จำกัด ซื้อหุ้น 80% ของบริษัท ลูก จำกัด ด้วยเงินสด 16,000,000 บาท ณ วันซื้อ บริษัทลูกมีทุน 10,000,000 บาท และกำไรสะสม 4,000,000 บาท อาคารมีมูลค่ายุติธรรมสูงกว่าราคาตามบัญชี 3,000,000 บาท อายุคงเหลือ 10 ปี สินทรัพย์หนี้สินอื่นมีมูลค่ายุติธรรมเท่าราคาตามบัญชี ส่วนได้เสียที่ไม่มีอำนาจควบคุมวัดตามสัดส่วนในสินทรัพย์สุทธิ

ปี 2569 บริษัทลูกมีกำไร 2,500,000 บาท จ่ายเงินปันผล 1,000,000 บาท บริษัทแม่ขายสินค้าให้บริษัทลูก 2,000,000 บาท อัตรากำไร 20% ของราคาขาย สิ้นปีเหลือสินค้า 30% ไม่ต้องคำนึงถึงภาษี

ให้คำนวณ (1) ค่าความนิยม (2) ส่วนได้เสียที่ไม่มีอำนาจควบคุม ณ สิ้นปี (3) กำไรที่ยังไม่เกิดขึ้นที่ต้องตัดรายการ`,pts:[['สินทรัพย์สุทธิมูลค่ายุติธรรม 17,000,000 บาท',4],['ค่าความนิยม 2,400,000 บาท',4],['กำไรบริษัทลูกหลังปรับค่าเสื่อมมูลค่ายุติธรรม 2,200,000 บาท',4],['ส่วนได้เสียที่ไม่มีอำนาจควบคุมปลายปี 3,640,000 บาท',5],['กำไรที่ยังไม่เกิดขึ้น 120,000 บาท และอธิบายว่าเป็นรายการขายลงจึงไม่กระทบส่วนได้เสียที่ไม่มีอำนาจควบคุม',3]],model:`|รายการ|บาท|
|ทุน + กำไรสะสม + ส่วนเพิ่มอาคาร|17,000,000|
|ส่วนได้เสียที่ไม่มีอำนาจควบคุม 20%|3,400,000|
|ค่าความนิยม 16,000,000 + 3,400,000 − 17,000,000|2,400,000|
|ค่าเสื่อมส่วนเพิ่มอาคารต่อปี|300,000|
|กำไรบริษัทลูกที่ปรับแล้ว|2,200,000|
|ส่วนได้เสียปลายปี 3,400,000 + 440,000 − 200,000|3,640,000|
|กำไรที่ยังไม่เกิดขึ้น 2,000,000 × 30% × 20%|120,000|`},
{t:'imp',title:'การด้อยค่าและการกลับรายการ',q:`เครื่องจักรซื้อวันที่ 1 มกราคม 2566 ราคาทุน 12,000,000 บาท อายุ 8 ปี ไม่มีราคาซาก วิธีเส้นตรง

วันที่ 31 ธันวาคม 2567 มีข้อบ่งชี้การด้อยค่า มูลค่ายุติธรรมหักต้นทุนจำหน่าย 7,900,000 บาท มูลค่าจากการใช้ 8,400,000 บาท

วันที่ 31 ธันวาคม 2569 มีข้อบ่งชี้ว่าการด้อยค่าลดลง มูลค่าที่คาดว่าจะได้รับคืน 6,100,000 บาท

## การรับรู้รายการและการตัดรายการ
รับรู้รายการในงบเมื่อรายการนั้นเข้านิยามขององค์ประกอบ และการรับรู้ให้ข้อมูลที่เกี่ยวข้องและเป็นตัวแทนอันเที่ยงธรรม กรอบแนวคิดฉบับนี้ไม่มีเกณฑ์ตายตัวแบบเดิมว่าต้องมีความเป็นไปได้ค่อนข้างแน่ ถ้าความไม่แน่นอนสูงมากหรือโอกาสได้ประโยชน์ต่ำมาก อาจไม่รับรู้ แต่เปิดเผยข้อมูลแทน
การตัดรายการคือเอาออกจากงบ เมื่อสินทรัพย์ไม่อยู่ในการควบคุมแล้ว หรือหนี้สินไม่ใช่ภาระผูกพันในปัจจุบันแล้ว

## แนวคิดเรื่องทุน
- ทุนทางการเงิน: กำไรเกิดเมื่อสินทรัพย์สุทธิปลายงวดสูงกว่าต้นงวด หลังหักรายการกับเจ้าของ วัดได้เป็นหน่วยเงินตราหรือหน่วยอำนาจซื้อคงที่
- ทุนทางกายภาพ: กำไรเกิดเมื่อกำลังการผลิตปลายงวดสูงกว่าต้นงวด

- ข้อกาถามนิยาม ถามว่าตัวอย่างใดเป็นลักษณะเชิงคุณภาพแบบพื้นฐานหรือแบบเสริมสร้าง และถามว่าผู้ใช้หลักคือใคร
- จุดที่หลอกบ่อย: ความมีสาระสำคัญอยู่ใต้ความเกี่ยวข้อง ไม่ใช่ลักษณะเสริมสร้าง ความระมัดระวังไม่ได้แปลว่าตั้งสินทรัพย์ต่ำไว้ก่อน
- ข้อเขียนมักให้สถานการณ์ แล้วถามว่ารายการนั้นเข้านิยามสินทรัพย์หรือหนี้สินหรือไม่ ให้ตอบทีละส่วนของนิยาม: มีสิทธิหรือภาระไหม เป็นของปัจจุบันไหม กิจการควบคุมหรือหลีกเลี่ยงไม่ได้ไหม เกิดจากเหตุการณ์ในอดีตไหม`,

- ถามการปันส่วนค่าใช้จ่ายคงที่เมื่อผลิตได้ต่ำกว่ากำลังการผลิตปกติ
- ให้ตารางสินค้าหลายรายการ แล้วถามยอดที่ต้องลดมูลค่า ต้องเทียบทีละรายการ
- ถามยอดกลับรายการ ซึ่งต้องไม่เกินยอดที่เคยลดไว้`,

fi:`## ภาพรวม
เครื่องมือทางการเงินคือสัญญาที่ทำให้ฝ่ายหนึ่งมีสินทรัพย์ทางการเงิน และอีกฝ่ายมีหนี้สินทางการเงินหรือตราสารทุน เช่น เงินฝาก ลูกหนี้การค้า หุ้นกู้ที่ถือไว้ เงินกู้ยืม และหุ้นของบริษัทอื่น TFRS 9 ตอบ 3 คำถาม คือ จัดประเภทอย่างไร วัดมูลค่าอย่างไร และตั้งค่าเผื่อผลขาดทุนด้านเครดิตอย่างไร
> ถ้าบริษัทซื้อหุ้นกู้ของบริษัทอื่น หุ้นกู้นั้นเป็นสินทรัพย์ทางการเงินของเรา และเป็นหนี้สินทางการเงินของบริษัทที่ออก

## การจัดประเภทสินทรัพย์ทางการเงิน
ตราสารหนี้ใช้ 2 เกณฑ์ประกอบกัน คือโมเดลธุรกิจที่ใช้บริหารสินทรัพย์ และลักษณะกระแสเงินสดตามสัญญา ต้องดูว่ากระแสเงินสดเป็นการรับชำระเงินต้นและดอกเบี้ยจากยอดเงินต้นคงค้างเท่านั้นหรือไม่ เกณฑ์นี้เรียกย่อว่า SPPI
|โมเดลธุรกิจ|ผ่านเกณฑ์ SPPI|ประเภท|
|ถือไว้เพื่อรับกระแสเงินสดตามสัญญา|ผ่าน|ราคาทุนตัดจำหน่าย|
|ถือไว้ทั้งรับกระแสเงินสดและขาย|ผ่าน|มูลค่ายุติธรรมผ่านกำไรขาดทุนเบ็ดเสร็จอื่น (FVOCI)|
|อื่น ๆ เช่น ถือไว้เพื่อค้า|ผ่านหรือไม่ผ่าน|มูลค่ายุติธรรมผ่านกำไรหรือขาดทุน (FVTPL)|
|ทุกโมเดล|ไม่ผ่าน|FVTPL|
@fig fi-class
- ตราสารทุน เช่น หุ้นสามัญ ไม่มีเงินต้นและดอกเบี้ย จึงไม่ผ่าน SPPI ปกติเป็น FVTPL
- ถ้าตราสารทุนไม่ได้ถือไว้เพื่อค้า เลือกได้ตั้งแต่วันแรกให้วัดด้วย FVOCI และเปลี่ยนใจภายหลังไม่ได้ เงินปันผลยังเข้ากำไรหรือขาดทุน ส่วนกำไรขาดทุนจากราคาอยู่ในกำไรขาดทุนเบ็ดเสร็จอื่นตลอดไป ขายแล้วก็ไม่โอนเข้ากำไรหรือขาดทุน และไม่ต้องทดสอบการด้อยค่า
- กิจการเลือกวัดด้วย FVTPL ได้ ถ้าช่วยลดความไม่สอดคล้องทางบัญชีอย่างมีนัยสำคัญ
> หุ้นกู้ที่ตั้งใจถือจนครบกำหนดเพื่อรับดอกเบี้ย เป็นราคาทุนตัดจำหน่าย ถ้าถือไว้ในพอร์ตที่ขายบ่อยเพื่อบริหารสภาพคล่องด้วย เป็น FVOCI ส่วนหุ้นที่ซื้อเก็งกำไรระยะสั้น เป็น FVTPL

## การวัดมูลค่าเมื่อเริ่มแรก
วัดด้วยมูลค่ายุติธรรม บวกต้นทุนการทำรายการที่เกี่ยวข้องโดยตรง ยกเว้นสินทรัพย์ประเภท FVTPL ซึ่งต้นทุนการทำรายการเป็นค่าใช้จ่ายทันที ลูกหนี้การค้าที่ไม่มีองค์ประกอบด้านการจัดหาเงินที่มีนัยสำคัญ วัดด้วยราคาของรายการตาม TFRS 15

## ราคาทุนตัดจำหน่ายและวิธีอัตราดอกเบี้ยที่แท้จริง

### ถ้าหุ้นกู้ตัวเดียวกันจัดเป็น FVOCI
ดอกเบี้ยรับยังคำนวณแบบเดียวกันและเข้ากำไรหรือขาดทุน แต่ปลายปีต้องปรับราคาตามบัญชีเป็นมูลค่ายุติธรรม ส่วนต่างเข้ากำไรขาดทุนเบ็ดเสร็จอื่น
> ปลายปี 2569 มูลค่ายุติธรรม 985,000 บาท ราคาทุนตัดจำหน่าย 981,666 บาท ส่วนต่าง 3,334 บาท บันทึกเป็นกำไรในกำไรขาดทุนเบ็ดเสร็จอื่น เมื่อขายหุ้นกู้ ยอดสะสมนี้ต้องโอนเข้ากำไรหรือขาดทุน ซึ่งต่างจากหุ้นทุนที่เลือก FVOCI
### หุ้นทุนที่เลือก FVOCI
> ซื้อหุ้น 200,000 บาท ค่านายหน้า 2,000 บาท ราคาตามบัญชีเริ่มแรก 202,000 บาท ปลายปีราคา 230,000 บาท กำไรในกำไรขาดทุนเบ็ดเสร็จอื่น 28,000 บาท ปีถัดไปขายได้ 250,000 บาท กำไรเพิ่มอีก 20,000 บาท ยอดสะสม 48,000 บาท โอนไปกำไรสะสมภายในส่วนของเจ้าของ ไม่ผ่านกำไรหรือขาดทุน

## ผลขาดทุนด้านเครดิตที่คาดว่าจะเกิดขึ้น
TFRS 9 ให้ตั้งค่าเผื่อจากความเสียหายที่คาดว่าจะเกิด ไม่ต้องรอให้ลูกหนี้ผิดนัดก่อน ใช้กับสินทรัพย์ประเภทราคาทุนตัดจำหน่าย ตราสารหนี้ FVOCI ลูกหนี้ตามสัญญาเช่า สินทรัพย์ที่เกิดจากสัญญา และภาระผูกพันวงเงินสินเชื่อ
### วิธีทั่วไป 3 ระดับ

## หนี้สินทางการเงิน
ส่วนใหญ่วัดด้วยราคาทุนตัดจำหน่าย เช่น เงินกู้และหุ้นกู้ที่ออก ยกเว้นหนี้สินที่ถือไว้เพื่อค้า อนุพันธ์ที่เป็นหนี้สิน และหนี้สินที่เลือกวัดด้วย FVTPL ถ้าเลือกวัดหนี้สินด้วย FVTPL การเปลี่ยนแปลงมูลค่าที่เกิดจากความเสี่ยงด้านเครดิตของกิจการเอง ให้แสดงในกำไรขาดทุนเบ็ดเสร็จอื่น

## การจัดประเภทใหม่และการตัดรายการ
- สินทรัพย์ทางการเงินจัดประเภทใหม่ได้เฉพาะเมื่อเปลี่ยนโมเดลธุรกิจ ซึ่งเกิดไม่บ่อย และให้ทำแบบเปลี่ยนทันทีเป็นต้นไป ไม่ปรับย้อนหลัง หนี้สินทางการเงินจัดประเภทใหม่ไม่ได้
- ตัดสินทรัพย์ทางการเงินออกเมื่อสิทธิในกระแสเงินสดหมดไป หรือโอนไปพร้อมความเสี่ยงและผลตอบแทนเกือบทั้งหมด ถ้าขายลูกหนี้แต่ยังรับประกันว่าจะชดใช้หนี้สูญทั้งหมด ถือว่ายังไม่ได้โอนความเสี่ยง ต้องคงลูกหนี้ไว้และรับรู้เงินที่ได้เป็นหนี้สิน

## การบัญชีป้องกันความเสี่ยงโดยย่อ
- การป้องกันความเสี่ยงในมูลค่ายุติธรรม: ทั้งเครื่องมือป้องกันความเสี่ยงและรายการที่ถูกป้องกัน ปรับมูลค่าเข้ากำไรหรือขาดทุน ผลจึงหักล้างกัน
- การป้องกันความเสี่ยงในกระแสเงินสด: ส่วนที่มีประสิทธิผลของเครื่องมือป้องกันความเสี่ยงพักไว้ในกำไรขาดทุนเบ็ดเสร็จอื่น แล้วโอนเข้ากำไรหรือขาดทุนเมื่อรายการที่ถูกป้องกันกระทบกำไรขาดทุน ส่วนที่ไม่มีประสิทธิผลเข้ากำไรหรือขาดทุนทันที

## ออกสอบแบบไหน
- ข้อกาให้โมเดลธุรกิจกับลักษณะกระแสเงินสด แล้วถามประเภท
- โจทย์คำนวณดอกเบี้ยรับตามวิธีอัตราดอกเบี้ยที่แท้จริง และราคาตามบัญชีปลายงวด
- โจทย์ตารางอายุหนี้ ถามยอดค่าเผื่อที่ต้องตั้งเพิ่ม
- ถามว่าหุ้นทุน FVOCI ขายแล้วกำไรสะสมไปอยู่ที่ไหน คำตอบคือโอนไปกำไรสะสม ไม่ผ่านกำไรหรือขาดทุน`,

group:`## ภาพรวม
การรวมธุรกิจคือการที่ผู้ซื้อได้การควบคุมธุรกิจอื่น ส่วนงบการเงินรวมคือการเอางบของบริษัทใหญ่กับบริษัทย่อยมารวมกัน แล้วแสดงเหมือนเป็นกิจการเดียว
> บริษัทแม่เหมือนเจ้าของบ้าน บริษัทลูกเหมือนห้องหนึ่งในบ้าน งบการเงินรวมคือการนับทรัพย์สินทั้งบ้าน ถ้าย้ายของจากห้องหนึ่งไปอีกห้อง บ้านไม่ได้รวยขึ้น รายการระหว่างกันจึงต้องตัดออก

## การควบคุมตาม TFRS 10
ผู้ลงทุนควบคุมผู้ได้รับการลงทุนเมื่อมีครบ 3 ข้อ
- มีอำนาจเหนือผู้ได้รับการลงทุน คือมีสิทธิสั่งการกิจกรรมที่มีผลต่อผลตอบแทนอย่างมีนัยสำคัญ
- มีความเสี่ยงหรือมีสิทธิในผลตอบแทนผันแปรจากการเข้าไปเกี่ยวข้อง
- ใช้อำนาจนั้นให้มีผลต่อจำนวนผลตอบแทนของตนได้
ถือหุ้นเกินครึ่งมักมีอำนาจ แต่ไม่เสมอไป และถือไม่ถึงครึ่งก็อาจมีอำนาจได้ เช่น ผู้ถือหุ้นรายอื่นกระจายตัวมาก หรือมีสัญญาให้สิทธิแต่งตั้งกรรมการส่วนใหญ่ สิทธิออกเสียงที่อาจเกิดขึ้นนำมาพิจารณาด้วยถ้าเป็นสิทธิที่มีสาระ

## วิธีซื้อตาม TFRS 3
### ขั้นตอน
- ระบุผู้ซื้อ
- กำหนดวันที่ซื้อ คือวันที่ได้การควบคุม
- รับรู้สินทรัพย์ที่ได้มาที่ระบุได้และหนี้สินที่รับมา ด้วยมูลค่ายุติธรรม ณ วันที่ซื้อ รวมสินทรัพย์ไม่มีตัวตนที่ผู้ถูกซื้อไม่เคยบันทึก เช่น รายชื่อลูกค้า และหนี้สินที่อาจเกิดขึ้นที่เป็นภาระผูกพันในปัจจุบันและวัดมูลค่ายุติธรรมได้
- วัดส่วนได้เสียที่ไม่มีอำนาจควบคุม
- รับรู้ค่าความนิยม หรือกำไรจากการซื้อในราคาต่ำกว่ามูลค่ายุติธรรม
### สิ่งตอบแทนที่โอนให้
- วัดด้วยมูลค่ายุติธรรมของสินทรัพย์ที่โอน หนี้สินที่ก่อขึ้น และหุ้นที่ออกให้
- สิ่งตอบแทนที่อาจต้องจ่ายเพิ่ม รับรู้ด้วยมูลค่ายุติธรรม ณ วันที่ซื้อ ถ้าเป็นหนี้สิน ภายหลังวัดมูลค่าใหม่เข้ากำไรหรือขาดทุน ถ้าจัดเป็นส่วนของเจ้าของ ไม่วัดมูลค่าใหม่
- ค่าที่ปรึกษา ค่ากฎหมาย ค่าประเมินราคา เป็นค่าใช้จ่ายทันที ต้นทุนการออกหุ้นนำไปหักส่วนของเจ้าของ ต้นทุนการออกหุ้นกู้รวมในการวัดหนี้สิน
### ส่วนได้เสียที่ไม่มีอำนาจควบคุม
เลือกวัดได้ทีละรายการซื้อ 2 แบบ คือมูลค่ายุติธรรม ซึ่งทำให้ค่าความนิยมรวมส่วนของผู้ถือหุ้นส่วนน้อยด้วย หรือสัดส่วนของสินทรัพย์สุทธิที่ระบุได้

## ค่าความนิยม
ค่าความนิยม = สิ่งตอบแทนที่โอนให้ + ส่วนได้เสียที่ไม่มีอำนาจควบคุม + มูลค่ายุติธรรมของส่วนได้เสียที่ถืออยู่ก่อน − สินทรัพย์สุทธิที่ระบุได้ตามมูลค่ายุติธรรม
> 1 ม.ค. 2569 บริษัท P ซื้อหุ้น 80% ของบริษัท S ด้วยเงินสด 9,000,000 บาท ส่วนของเจ้าของของ S ตามบัญชี 8,000,000 บาท เป็นทุน 5,000,000 บาท และกำไรสะสม 3,000,000 บาท อาคารของ S มีมูลค่ายุติธรรมสูงกว่าราคาตามบัญชี 1,000,000 บาท อายุคงเหลือ 10 ปี มูลค่ายุติธรรมของหุ้นส่วนน้อย 2,100,000 บาท
|รายการ|NCI วัดด้วยมูลค่ายุติธรรม|NCI วัดตามสัดส่วน|
|สิ่งตอบแทนที่โอนให้|9,000,000|9,000,000|
|บวก ส่วนได้เสียที่ไม่มีอำนาจควบคุม|2,100,000|1,800,000|
|หัก สินทรัพย์สุทธิตามมูลค่ายุติธรรม|(9,000,000)|(9,000,000)|

สินทรัพย์สุทธิตามมูลค่ายุติธรรม = 8,000,000 + 1,000,000 = 9,000,000 บาท NCI ตามสัดส่วน = 20% × 9,000,000 = 1,800,000 บาท
- ค่าความนิยมไม่ตัดจำหน่าย แต่ทดสอบการด้อยค่าทุกปี และกลับรายการไม่ได้
- ถ้าผลลัพธ์ติดลบ ต้องทบทวนการวัดมูลค่าทุกรายการก่อน ถ้ายังติดลบ รับรู้เป็นกำไรจากการซื้อในราคาต่ำกว่ามูลค่ายุติธรรมในกำไรหรือขาดทุน ณ วันที่ซื้อ ทั้งหมดเป็นของบริษัทใหญ่
- ถ้าข้อมูลบางอย่างยังไม่ครบ ใช้ตัวเลขชั่วคราวได้ แล้วปรับย้อนกลับไปวันซื้อภายในช่วงเวลาการวัดมูลค่า ซึ่งไม่เกิน 12 เดือน
- การซื้อเป็นขั้น ถ้าเคยถือหุ้นอยู่ก่อนแล้วซื้อเพิ่มจนได้การควบคุม ให้วัดหุ้นเดิมใหม่ด้วยมูลค่ายุติธรรม ณ วันได้การควบคุม ส่วนต่างเข้ากำไรหรือขาดทุน

## ขั้นตอนทำงบการเงินรวม
- รวมสินทรัพย์ หนี้สิน รายได้ และค่าใช้จ่ายของบริษัทใหญ่และบริษัทย่อยทีละบรรทัด
- ตัดเงินลงทุนในบริษัทย่อยกับส่วนของเจ้าของของบริษัทย่อย ณ วันซื้อ และบันทึกค่าความนิยมกับ NCI
- ปรับผลต่างมูลค่ายุติธรรม และค่าเสื่อมราคาส่วนเพิ่ม
- ตัดรายการระหว่างกันทั้งหมด เช่น ยอดลูกหนี้เจ้าหนี้ระหว่างกัน รายได้และค่าใช้จ่ายระหว่างกัน เงินปันผลระหว่างกัน และกำไรที่ยังไม่เกิดขึ้นจริงในสินค้าหรือสินทรัพย์ที่ยังอยู่ในกลุ่ม
- ใช้นโยบายการบัญชีเดียวกันทั้งกลุ่ม และวันที่ในงบต่างกันได้ไม่เกิน 3 เดือน
### กำไรที่ยังไม่เกิดขึ้นจริง
> ระหว่างปี S ขายสินค้าให้ P ราคา 600,000 บาท ทุน 450,000 บาท กำไร 150,000 บาท สิ้นปี P ยังขายต่อไม่ได้ 40% ของสินค้านั้น กำไรที่ยังไม่เกิดขึ้นจริง = 150,000 × 40% = 60,000 บาท ต้องลดสินค้าคงเหลือในงบรวม 60,000 บาท ตัดยอดขายและต้นทุนขายระหว่างกัน 600,000 บาท
- ขายจากลูกไปแม่ (ขายขึ้น) กำไรที่ตัดออกกระทบกำไรของบริษัทย่อย จึงแบ่งให้ NCI รับผลด้วยตามสัดส่วน
- ขายจากแม่ไปลูก (ขายลง) กำไรที่ตัดออกเป็นของบริษัทใหญ่ทั้งหมด NCI ไม่รับผล

## การเปลี่ยนแปลงสัดส่วนการถือหุ้น
- ซื้อเพิ่มหรือขายบางส่วนโดยยังควบคุมอยู่ ถือเป็นรายการระหว่างเจ้าของ ส่วนต่างบันทึกในส่วนของเจ้าของ ไม่มีกำไรขาดทุน และไม่วัดค่าความนิยมใหม่
- ถ้าสูญเสียการควบคุม ตัดสินทรัพย์ หนี้สิน ค่าความนิยม และ NCI ของบริษัทย่อยออก รับรู้หุ้นที่เหลือด้วยมูลค่ายุติธรรม แล้วรับรู้กำไรหรือขาดทุนจากการสูญเสียการควบคุม
- กิจการที่เป็นกิจการเพื่อการลงทุนไม่ต้องรวมบริษัทย่อย แต่วัดเงินลงทุนด้วย FVTPL

## ออกสอบแบบไหน
- ข้อกาคำนวณค่าความนิยมทั้ง 2 วิธีวัด NCI และถามว่าค่าที่ปรึกษาบันทึกอย่างไร
- ข้อเขียนมักให้งบของแม่และลูก แล้วให้ทำรายการตัดบัญชี คำนวณ NCI ปลายงวด และกำไรที่เป็นของบริษัทใหญ่
- จุดหลอก: ทิศทางการขายระหว่างกัน และค่าเสื่อมราคาส่วนเพิ่มจากการปรับมูลค่ายุติธรรม ต้องนำไปลดกำไรก่อนแบ่งให้ NCI`,

เงินลงทุนเริ่มที่ราคาทุน แล้วเพิ่มขึ้นตามส่วนแบ่งกำไร และลดลงเมื่อรับเงินปันผล เพราะเงินปันผลคือการดึงเงินที่เป็นของเราออกมาจากเงินลงทุน ไม่ใช่รายได้ใหม่

|ส่วนแบ่งกำไร|เพิ่ม|รับรู้ส่วนแบ่งกำไร|
|ส่วนแบ่งขาดทุน|ลด|รับรู้ส่วนแบ่งขาดทุน|
|เงินปันผลรับ|ลด|ไม่กระทบ|
|ส่วนแบ่งกำไรขาดทุนเบ็ดเสร็จอื่น|เพิ่มหรือลด|เข้ากำไรขาดทุนเบ็ดเสร็จอื่น|

- ผลต่างระหว่างราคาทุนกับส่วนแบ่งในมูลค่ายุติธรรมของสินทรัพย์สุทธิ ถ้าเป็นค่าความนิยม ให้รวมอยู่ในเงินลงทุน ไม่แยกแสดงและไม่ตัดจำหน่าย ถ้าเป็นส่วนต่ำกว่าทุน ให้รับรู้เป็นรายได้ในงวดที่ซื้อ
- ส่วนต่างมูลค่ายุติธรรมของสินทรัพย์ที่เสื่อมราคาได้ ต้องคิดค่าเสื่อมส่วนเพิ่มตามสัดส่วนของเรา
- กำไรที่ยังไม่เกิดขึ้นจริงจากรายการระหว่างกัน ตัดเฉพาะส่วนของเรา ทั้งขายขึ้นและขายลง ซึ่งต่างจากบริษัทย่อย

### ขาดทุนเกินเงินลงทุน
ถ้าบริษัทร่วมขาดทุนหนักจนส่วนแบ่งขาดทุนทำให้เงินลงทุนเหลือศูนย์ ให้หยุดรับรู้ขาดทุน เงินลงทุนนับรวมส่วนได้เสียระยะยาวที่เป็นส่วนหนึ่งของเงินลงทุนสุทธิด้วย เช่น เงินให้กู้ที่ไม่มีแผนเรียกคืน รับรู้ขาดทุนเพิ่มได้เฉพาะเมื่อเรามีภาระผูกพันตามกฎหมายหรือโดยอนุมาน หรือจ่ายแทนบริษัทร่วมไปแล้ว ถ้าต่อมาบริษัทร่วมกลับมามีกำไร ต้องเอากำไรมาชดเชยขาดทุนที่ยังไม่ได้รับรู้ให้หมดก่อน
### หยุดใช้วิธีส่วนได้เสีย
เมื่อสูญเสียอิทธิพลอย่างมีนัยสำคัญ ให้วัดหุ้นที่เหลือด้วยมูลค่ายุติธรรมตาม TFRS 9 ส่วนต่างเข้ากำไรหรือขาดทุน ถ้าบริษัทร่วมกลายเป็นการร่วมค้า หรือการร่วมค้ากลายเป็นบริษัทร่วม ให้ใช้วิธีส่วนได้เสียต่อไปโดยไม่วัดมูลค่าใหม่

- คำนวณค่าเสื่อมราคาหลังเปลี่ยนอายุหรือมูลค่าคงเหลือ ต้องเริ่มจากราคาตามบัญชีวันที่เปลี่ยน
- ตีราคาเพิ่มแล้วลด หรือลดแล้วเพิ่ม ถามยอดที่เข้ากำไรขาดทุนเบ็ดเสร็จอื่นกับกำไรหรือขาดทุน
- คำนวณต้นทุนการกู้ยืมที่รวมเป็นทุน ทั้งเงินกู้เฉพาะและเงินกู้ทั่วไป`,

lease:`## ภาพรวม
TFRS 16 ให้ผู้เช่าบันทึกสัญญาเช่าเกือบทุกสัญญาไว้ในงบแสดงฐานะการเงิน ฝั่งสินทรัพย์คือสินทรัพย์สิทธิการใช้ ฝั่งหนี้สินคือหนี้สินตามสัญญาเช่า เหมือนเรากู้เงินมาซื้อสิทธิใช้ของ ดอกเบี้ยมาจากฝั่งหนี้ ค่าเสื่อมมาจากฝั่งสิทธิการใช้

## สัญญานี้เป็นสัญญาเช่าหรือไม่
สัญญาเป็นหรือมีสัญญาเช่า ถ้าให้สิทธิควบคุมการใช้สินทรัพย์ที่ระบุได้ ตลอดช่วงเวลาหนึ่ง เพื่อแลกกับสิ่งตอบแทน ต้องผ่าน 3 ข้อ
- มีสินทรัพย์ที่ระบุได้ และผู้ให้เช่าไม่มีสิทธิในทางปฏิบัติที่จะเปลี่ยนเป็นสินทรัพย์อื่นได้ตามใจ
- ผู้เช่ามีสิทธิได้ประโยชน์เชิงเศรษฐกิจเกือบทั้งหมดจากการใช้
- ผู้เช่ามีสิทธิสั่งการว่าจะใช้สินทรัพย์อย่างไรและเพื่อจุดประสงค์ใด
> เช่าพื้นที่ในห้างโดยห้างย้ายเราไปมุมไหนก็ได้ตลอดเวลาและได้ประโยชน์จากการย้าย ไม่มีสินทรัพย์ที่ระบุได้ แต่เช่ารถตู้คันที่ระบุทะเบียนไว้ แล้วเราเลือกเส้นทางเอง เป็นสัญญาเช่า

## ข้อยกเว้นสำหรับผู้เช่า
เลือกไม่บันทึกสินทรัพย์และหนี้สินได้ 2 กรณี แล้วรับรู้ค่าเช่าเป็นค่าใช้จ่ายตามวิธีเส้นตรง
- สัญญาเช่าระยะสั้น อายุไม่เกิน 12 เดือนและไม่มีสิทธิเลือกซื้อ เลือกได้ตามประเภทสินทรัพย์
- สินทรัพย์อ้างอิงมีมูลค่าต่ำเมื่อยังใหม่ เช่น คอมพิวเตอร์ส่วนบุคคล โทรศัพท์ เลือกได้ทีละสัญญา

## อายุสัญญาเช่า
อายุสัญญาเช่า = ช่วงที่บอกเลิกไม่ได้ + ช่วงตามสิทธิขยายอายุที่ค่อนข้างแน่ว่าจะใช้ + ช่วงตามสิทธิบอกเลิกที่ค่อนข้างแน่ว่าจะไม่ใช้
> เช่าร้าน 3 ปี มีสิทธิต่ออีก 2 ปีในค่าเช่าต่ำกว่าตลาดมาก และร้านตกแต่งไปมาก ค่อนข้างแน่ว่าจะต่อ อายุสัญญาเช่าจึงเป็น 5 ปี

## การวัดมูลค่า ณ วันที่สัญญาเช่าเริ่มมีผล
### หนี้สินตามสัญญาเช่า
มูลค่าปัจจุบันของค่าเช่าที่ยังไม่ได้จ่าย คิดลดด้วยอัตราดอกเบี้ยตามนัยของสัญญาเช่า ถ้าหาไม่ได้ ใช้อัตราดอกเบี้ยเงินกู้ยืมส่วนเพิ่มของผู้เช่า ค่าเช่าที่รวมได้แก่
- ค่าเช่าคงที่ หักสิ่งจูงใจที่จะได้รับ
- ค่าเช่าผันแปรที่ขึ้นกับดัชนีหรืออัตรา เช่น ดัชนีราคาผู้บริโภค วัดด้วยดัชนี ณ วันเริ่มสัญญา
- จำนวนที่คาดว่าจะจ่ายตามการรับประกันมูลค่าคงเหลือ
- ราคาใช้สิทธิเลือกซื้อ ถ้าค่อนข้างแน่ว่าจะใช้สิทธิ
- ค่าปรับจากการบอกเลิก ถ้าอายุสัญญาเช่าสะท้อนว่าจะบอกเลิก
ค่าเช่าผันแปรที่ขึ้นกับยอดขายหรือการใช้งาน ไม่รวมในหนี้สิน ให้เป็นค่าใช้จ่ายเมื่อเกิด
### สินทรัพย์สิทธิการใช้
สินทรัพย์สิทธิการใช้ = หนี้สินตามสัญญาเช่า + ค่าเช่าที่จ่ายไปก่อนหรือ ณ วันเริ่ม − สิ่งจูงใจที่ได้รับแล้ว + ต้นทุนทางตรงเริ่มแรก + ประมาณการค่ารื้อถอนและบูรณะ
> 1 ม.ค. 2569 เช่าเครื่องจักร 5 ปี จ่ายค่าเช่าปลายปีปีละ 100,000 บาท ไม่มีสิทธิเลือกซื้อ อัตราดอกเบี้ยเงินกู้ยืมส่วนเพิ่ม 6% จ่ายค่านายหน้าทำสัญญา 10,000 บาท และได้รับเงินจูงใจจากผู้ให้เช่า 5,000 บาท
หนี้สินตามสัญญาเช่า = 100,000 × 4.2124 = 421,236 บาท (ตัวคูณมูลค่าปัจจุบันของเงินงวด 5 ปี 6%)
สินทรัพย์สิทธิการใช้ = 421,236 + 10,000 − 5,000 = 426,236 บาท
|รายการบัญชี 1 ม.ค. 2569|เดบิต|เครดิต|

|หนี้สินตามสัญญาเช่า||421,236|
|เงินสด (10,000 − 5,000)||5,000|

- หนี้สิน: เพิ่มด้วยดอกเบี้ยตามอัตราที่ใช้คิดลด ลดด้วยค่าเช่าที่จ่าย
- สินทรัพย์สิทธิการใช้: วิธีราคาทุน คิดค่าเสื่อมตลอดอายุสัญญาเช่าหรืออายุการให้ประโยชน์ แล้วแต่ระยะใดสั้นกว่า ถ้ากรรมสิทธิ์โอนไปเมื่อสิ้นสัญญาหรือค่อนข้างแน่ว่าจะใช้สิทธิเลือกซื้อ ให้คิดตามอายุการให้ประโยชน์

## การวัดมูลค่าหนี้สินใหม่
- เปลี่ยนอายุสัญญาเช่า หรือเปลี่ยนการประเมินสิทธิเลือกซื้อ: คิดลดค่าเช่าใหม่ด้วยอัตราคิดลดใหม่
- ค่าเช่าเปลี่ยนตามดัชนีหรืออัตรา หรือจำนวนที่คาดว่าจะจ่ายตามการรับประกันมูลค่าคงเหลือเปลี่ยน: คิดลดด้วยอัตราเดิม
- ผลต่างจากการวัดใหม่ ปรับกับสินทรัพย์สิทธิการใช้ ถ้าสินทรัพย์ลดจนเหลือศูนย์แล้ว ส่วนที่เหลือเข้ากำไรหรือขาดทุน

## การขายและเช่ากลับโดยย่อ
ถ้าการโอนสินทรัพย์เข้าเงื่อนไขการขายตาม TFRS 15 ผู้ขายซึ่งเป็นผู้เช่า วัดสินทรัพย์สิทธิการใช้ตามสัดส่วนของราคาตามบัญชีเดิมที่ยังเก็บสิทธิไว้ และรับรู้กำไรเฉพาะส่วนของสิทธิที่โอนไปจริง ถ้าไม่เข้าเงื่อนไขการขาย ผู้ขายยังคงบันทึกสินทรัพย์ไว้ และบันทึกเงินที่ได้รับเป็นหนี้สินทางการเงิน

## การนำเสนอ
- แสดงสินทรัพย์สิทธิการใช้แยกจากสินทรัพย์อื่น หรือเปิดเผยว่ารวมอยู่ในบรรทัดใด
- งบกระแสเงินสด: ส่วนที่จ่ายชำระเงินต้นอยู่ในกิจกรรมจัดหาเงิน ส่วนดอกเบี้ยจัดตามนโยบายเรื่องดอกเบี้ยจ่าย ค่าเช่าระยะสั้นและมูลค่าต่ำอยู่ในกิจกรรมดำเนินงาน

## ออกสอบแบบไหน
- ข้อกาถามยอดสินทรัพย์สิทธิการใช้ ณ วันเริ่ม ให้ระวังรายการบวกและลบ
- คำนวณดอกเบี้ยปีแรก หนี้สินปลายปี และส่วนที่ถึงกำหนดชำระภายในหนึ่งปี
- ถามว่าค่าเช่าผันแปรตามยอดขายรวมในหนี้สินหรือไม่ คำตอบคือไม่รวม
- ข้อเขียนมักให้ทำตารางหนี้สินพร้อมรายการบัญชี 1 ถึง 2 ปี`,

intang:`## ภาพรวม
สินทรัพย์ไม่มีตัวตนคือสินทรัพย์ที่ไม่เป็นตัวเงินและไม่มีรูปร่าง เช่น โปรแกรมคอมพิวเตอร์ สิทธิบัตร เครื่องหมายการค้าที่ซื้อมา ใบอนุญาต รายชื่อลูกค้าที่ซื้อมา
## นิยาม 3 ข้อ
- ระบุได้: แยกออกไปขาย ให้เช่า หรือโอนได้ หรือเกิดจากสิทธิตามสัญญาหรือกฎหมาย
- กิจการควบคุมได้: มีอำนาจได้ประโยชน์และจำกัดคนอื่นไม่ให้ได้ประโยชน์ ซึ่งมักมาจากสิทธิตามกฎหมาย
- มีประโยชน์เชิงเศรษฐกิจในอนาคต: เช่น รายได้จากการขาย หรือการประหยัดต้นทุน
> ความรู้ของพนักงานที่ผ่านการอบรม และความภักดีของลูกค้า ไม่เป็นสินทรัพย์ไม่มีตัวตน เพราะกิจการควบคุมไม่ได้ พนักงานลาออกได้ ลูกค้าย้ายไปซื้อที่อื่นได้

## การรับรู้และการวัดมูลค่าเมื่อเริ่มแรก
รับรู้เมื่อมีความเป็นไปได้ค่อนข้างแน่ที่จะได้ประโยชน์ และวัดราคาทุนได้อย่างน่าเชื่อถือ
|วิธีได้มา|การวัดมูลค่าเมื่อเริ่มแรก|
|ซื้อแยกต่างหาก|ราคาซื้อ ภาษีที่ขอคืนไม่ได้ และต้นทุนทางตรงที่ทำให้พร้อมใช้ เช่น ค่าทดสอบระบบ ค่าวิชาชีพ|
|ได้มาจากการรวมธุรกิจ|มูลค่ายุติธรรม ณ วันที่ซื้อ แยกจากค่าความนิยม แม้ผู้ถูกซื้อไม่เคยบันทึกไว้ เช่น รายชื่อลูกค้า งานวิจัยที่อยู่ระหว่างทำ|
|ได้รับจากรัฐบาล|มูลค่ายุติธรรม หรือจำนวนที่กำหนด|
|สร้างขึ้นเอง|แยกขั้นตอนการวิจัยและขั้นตอนการพัฒนา|
ต้นทุนที่ไม่รวม: ค่าโฆษณาแนะนำสินค้า ค่าบริหาร ค่าอบรมพนักงาน และต้นทุนที่เกิดหลังสินทรัพย์พร้อมใช้แล้ว

## สินทรัพย์ไม่มีตัวตนที่สร้างขึ้นเอง
### ขั้นตอนการวิจัย
ค่าใช้จ่ายทั้งหมดเป็นค่าใช้จ่ายทันที เพราะยังพิสูจน์ไม่ได้ว่าจะได้ประโยชน์ เช่น การค้นหาความรู้ใหม่ การหาทางเลือกของวัสดุหรือกระบวนการ
### ขั้นตอนการพัฒนา
บันทึกเป็นสินทรัพย์ได้เมื่อแสดงได้ครบทั้ง 6 ข้อ
- มีความเป็นไปได้ทางเทคนิคที่จะทำให้เสร็จ
- ตั้งใจจะทำให้เสร็จ แล้วนำไปใช้หรือขาย
- มีความสามารถจะใช้หรือขาย
- แสดงได้ว่าจะก่อให้เกิดประโยชน์อย่างไร เช่น มีตลาดรองรับ
- มีทรัพยากรด้านเทคนิค การเงิน และอื่น ๆ เพียงพอ
- วัดรายจ่ายระหว่างการพัฒนาได้อย่างน่าเชื่อถือ
ถ้าแยกขั้นวิจัยกับขั้นพัฒนาไม่ได้ ให้ถือเป็นขั้นวิจัยทั้งหมด
> โครงการพัฒนาแอปพลิเคชันปี 2569 ช่วง ม.ค. ถึง เม.ย. ทดลองแนวคิดหลายแบบ จ่าย 800,000 บาท วันที่ 1 พ.ค. ผ่านเงื่อนไขครบ 6 ข้อ ช่วง พ.ค. ถึง ธ.ค. จ่าย 1,500,000 บาท ในจำนวนนี้มีค่าอบรมพนักงานขาย 100,000 บาท และค่าบริหารสำนักงานที่ไม่เกี่ยวกับโครงการโดยตรง 50,000 บาท

## กรณีที่ต้องใช้ดุลยพินิจ
- ใช้เองบางส่วน ปล่อยเช่าบางส่วน: ถ้าแยกขายหรือแยกให้เช่าตามสัญญาเช่าการเงินได้ ให้บันทึกแยกกัน ถ้าแยกไม่ได้ เป็นอสังหาริมทรัพย์เพื่อการลงทุนก็ต่อเมื่อส่วนที่ใช้เองไม่มีนัยสำคัญ
- ให้บริการเสริมแก่ผู้เช่า: ถ้าบริการเป็นส่วนเล็ก เช่น รปภ. และแม่บ้านของอาคารสำนักงาน ยังเป็นอสังหาริมทรัพย์เพื่อการลงทุน ถ้าบริการเป็นส่วนสำคัญ เช่น โรงแรม เป็นอสังหาริมทรัพย์ที่ใช้เอง
- ให้กิจการในกลุ่มเช่า: ในงบการเงินเฉพาะกิจการของผู้ให้เช่า อาจเป็นอสังหาริมทรัพย์เพื่อการลงทุน แต่ในงบการเงินรวมเป็นอสังหาริมทรัพย์ที่ใช้เอง เพราะกลุ่มใช้เอง
> บริษัทแม่ให้บริษัทย่อยเช่าตึกเป็นสำนักงาน ในงบเฉพาะกิจการของแม่ ตึกเป็นอสังหาริมทรัพย์เพื่อการลงทุน ในงบการเงินรวม ตึกเป็นที่ดิน อาคาร และอุปกรณ์

## การวัดมูลค่าเมื่อเริ่มแรก
วัดด้วยราคาทุน รวมต้นทุนการทำรายการ เช่น ค่าธรรมเนียมทางกฎหมาย ค่าธรรมเนียมการโอน ไม่รวมต้นทุนช่วงเริ่มต้น ผลขาดทุนจากการดำเนินงานช่วงแรก และของเสียที่เกินปกติระหว่างก่อสร้าง ถ้าเป็นสิทธิการใช้ที่ได้จากสัญญาเช่า วัดตาม TFRS 16

## การวัดมูลค่าภายหลัง
เลือกนโยบายเดียวและใช้กับอสังหาริมทรัพย์เพื่อการลงทุนทั้งหมด

|วิธีราคาทุน|ราคาทุนหักค่าเสื่อมราคาสะสมและค่าเผื่อการด้อยค่า|ต้องเปิดเผยมูลค่ายุติธรรมในหมายเหตุ|
! วิธีมูลค่ายุติธรรมของ TAS 40 ผลต่างเข้ากำไรหรือขาดทุน ต่างจากการตีราคาใหม่ของ TAS 16 ที่ส่วนเพิ่มเข้ากำไรขาดทุนเบ็ดเสร็จอื่น เป็นจุดที่ออกสอบบ่อยที่สุดของหัวข้อนี้

|ก่อสร้างเสร็จ|มูลค่ายุติธรรม|เข้ากำไรหรือขาดทุน|

> ถ้าวันที่ 1 ก.ค. มูลค่ายุติธรรมเหลือ 12,000,000 บาท ส่วนลด 2,000,000 บาทเข้ากำไรหรือขาดทุน

## การจำหน่าย
กำไรหรือขาดทุนจากการขาย = สิ่งตอบแทนสุทธิ − ราคาตามบัญชี รับรู้ในกำไรหรือขาดทุน ค่าชดเชยจากบุคคลอื่นเมื่ออสังหาริมทรัพย์เสียหาย รับรู้เป็นรายได้เมื่อมีสิทธิได้รับ

## ออกสอบแบบไหน
- ข้อกาจัดประเภทอสังหาริมทรัพย์จากสถานการณ์ เช่น โรงแรม อาคารให้บริษัทย่อยเช่า ที่ดินที่ยังไม่รู้จะทำอะไร
- ถามว่าผลต่างมูลค่ายุติธรรมเข้าที่ไหน
- โจทย์การโอนจากใช้เองไปเป็นอสังหาริมทรัพย์เพื่อการลงทุน ต้องแยกผลต่าง ณ วันโอน กับผลต่างหลังวันโอน`,

mineral:`## ภาพรวม
TFRS 6 ใช้กับรายจ่ายช่วงสำรวจและประเมินค่าแหล่งแร่ น้ำมัน และก๊าซธรรมชาติ หลังจากได้สิทธิตามกฎหมายในการสำรวจแล้ว จนถึงก่อนพิสูจน์ได้ว่าการขุดเชิงพาณิชย์เป็นไปได้ทางเทคนิคและคุ้มค่า

|ก่อนได้สิทธิสำรวจ|ไม่อยู่ในขอบเขต TFRS 6 ปกติเป็นค่าใช้จ่าย|
|สำรวจและประเมินค่า|TFRS 6|
|พิสูจน์ได้ว่าคุ้มค่าแล้ว เข้าสู่ช่วงพัฒนา|TAS 16 หรือ TAS 38|
|ช่วงผลิต ค่าเปิดหน้าดินของเหมืองผิวดิน|TFRIC 20|

> เหมือนเจาะหาน้ำบาดาล ช่วงที่ยังไม่รู้ว่าใต้ดินมีน้ำคุ้มค่าหรือไม่ คือช่วงสำรวจ ถ้ารู้แล้วว่ามีน้ำมากพอและเริ่มวางท่อ คือช่วงพัฒนา

## นโยบายการบัญชี
กิจการกำหนดนโยบายเองว่ารายจ่ายใดบันทึกเป็นสินทรัพย์สำรวจและประเมินค่า และต้องใช้อย่างสม่ำเสมอ ตัวอย่างรายจ่ายที่มักรวม
- ค่าได้มาซึ่งสิทธิสำรวจ
- ค่าศึกษาภูมิประเทศ ธรณีวิทยา ธรณีเคมี และธรณีฟิสิกส์
- ค่าเจาะสำรวจ ค่าขุดร่อง และค่าเก็บตัวอย่าง
- ค่าประเมินความเป็นไปได้ทางเทคนิคและความคุ้มค่าเชิงพาณิชย์
รายจ่ายช่วงพัฒนาห้ามบันทึกเป็นสินทรัพย์สำรวจและประเมินค่า

## การวัดมูลค่า
- เมื่อเริ่มแรก: ราคาทุน
- ภายหลัง: วิธีราคาทุน หรือวิธีการตีราคาใหม่ตามหลักของ TAS 16 หรือ TAS 38 ขึ้นกับประเภท
- จัดประเภทเป็นสินทรัพย์มีตัวตน เช่น อุปกรณ์เจาะ หรือไม่มีตัวตน เช่น สิทธิการขุดเจาะ ตามลักษณะของสินทรัพย์ และต้องใช้อย่างสม่ำเสมอ ค่าเสื่อมของอุปกรณ์ที่ใช้ในการสำรวจ บันทึกรวมในสินทรัพย์ไม่มีตัวตนได้

## การด้อยค่า
ทดสอบการด้อยค่าเมื่อข้อเท็จจริงชี้ว่าราคาตามบัญชีอาจสูงกว่ามูลค่าที่คาดว่าจะได้รับคืน ข้อบ่งชี้เฉพาะของ TFRS 6 ได้แก่
- สิทธิสำรวจหมดอายุแล้วหรือจะหมดในอนาคตอันใกล้ และไม่คาดว่าจะต่ออายุ
- ไม่มีงบประมาณหรือแผนสำหรับการสำรวจต่อในพื้นที่นั้น
- สำรวจแล้วไม่พบแหล่งที่คุ้มค่า และตัดสินใจหยุดสำรวจ

### ผลต่างถาวร
รายการที่ไม่มีวันกลับรายการ ไม่ต้องตั้งภาษีรอการตัดบัญชี เช่น ค่ารับรองส่วนที่เกินเกณฑ์ ค่าปรับทางอาญา เบี้ยปรับเงินเพิ่มภาษี และเงินปันผลที่ได้รับยกเว้น

## ข้อยกเว้นการรับรู้
- ไม่รับรู้หนี้สินภาษีเงินได้รอการตัดบัญชีจากการรับรู้ค่าความนิยมเมื่อเริ่มแรก
- ไม่รับรู้ภาษีรอการตัดบัญชีจากการรับรู้สินทรัพย์หรือหนี้สินเมื่อเริ่มแรก ในรายการที่ไม่ใช่การรวมธุรกิจ ไม่กระทบทั้งกำไรทางบัญชีและกำไรทางภาษี และไม่ทำให้เกิดผลต่างที่ต้องเสียภาษีกับผลต่างที่ใช้หักภาษีเท่ากัน ข้อสุดท้ายนี้ทำให้สัญญาเช่าและหนี้สินค่ารื้อถอนของผู้เช่าต้องรับรู้ภาษีรอการตัดบัญชีทั้งสองฝั่ง

## สินทรัพย์ภาษีเงินได้รอการตัดบัญชี
รับรู้ได้เท่าที่มีความเป็นไปได้ค่อนข้างแน่ว่าจะมีกำไรทางภาษีพอให้ใช้ประโยชน์ ใช้กับผลต่างชั่วคราวที่ใช้หักภาษี ขาดทุนทางภาษียกไป และเครดิตภาษียกไป ในไทยขาดทุนทางภาษีของบริษัทยกไปหักได้ไม่เกิน 5 รอบระยะเวลาบัญชี ต้องทบทวนยอดทุกสิ้นงวด ถ้าคาดว่าใช้ไม่ได้ให้ลดลง

## การวัดมูลค่า
- ใช้อัตราภาษีที่คาดว่าจะใช้เมื่อผลต่างกลับรายการ ตามกฎหมายที่ประกาศใช้แล้วหรือที่คาดได้ค่อนข้างแน่ ณ วันสิ้นงวด
- ห้ามคิดลดภาษีเงินได้รอการตัดบัญชี
> หนี้สินภาษีเงินได้รอการตัดบัญชียกมา 200,000 บาท จากผลต่าง 1,000,000 บาท ที่อัตรา 20% สมมติว่ากฎหมายประกาศเปลี่ยนอัตราเป็น 25% ก่อนวันสิ้นงวด ต้องปรับหนี้สินเป็น 250,000 บาท ส่วนเพิ่ม 50,000 บาทเป็นค่าใช้จ่ายภาษีในกำไรหรือขาดทุน เว้นแต่ผลต่างนั้นเกิดจากรายการในกำไรขาดทุนเบ็ดเสร็จอื่น

## ภาษีของรายการที่ไม่ผ่านกำไรหรือขาดทุน
ภาษีต้องไปตามรายการ ถ้ารายการอยู่ในกำไรขาดทุนเบ็ดเสร็จอื่นหรือในส่วนของเจ้าของ ภาษีก็ต้องบันทึกที่นั่น
> ตีราคาที่ดินเพิ่ม 1,000,000 บาท ทางภาษียังใช้ราคาทุนเดิม หนี้สินภาษีเงินได้รอการตัดบัญชี 200,000 บาท บันทึกหักในกำไรขาดทุนเบ็ดเสร็จอื่น ส่วนเกินทุนสุทธิจากภาษีจึงเป็น 800,000 บาท

## การนำเสนอ
- หักกลบสินทรัพย์และหนี้สินภาษีรอการตัดบัญชีได้ เมื่อมีสิทธิตามกฎหมาย และเป็นภาษีที่จัดเก็บโดยหน่วยงานเดียวกันจากกิจการเดียวกัน หรือจากหลายกิจการที่ตั้งใจชำระสุทธิ
- ภาษีเงินได้รอการตัดบัญชีห้ามจัดเป็นรายการหมุนเวียน
## SIC 25 การเปลี่ยนสถานะทางภาษี
เช่น บริษัทเข้าตลาดหลักทรัพย์แล้วได้อัตราภาษีต่างไป ผลกระทบต่อภาษีปัจจุบันและภาษีรอการตัดบัญชี บันทึกในกำไรหรือขาดทุนของงวด เว้นแต่เกี่ยวกับรายการที่เคยบันทึกนอกกำไรหรือขาดทุน
## TFRIC 23 ความไม่แน่นอนเกี่ยวกับวิธีการทางภาษีเงินได้
ถ้าไม่แน่ใจว่าสรรพากรจะยอมรับวิธีทางภาษีที่ใช้หรือไม่ ให้สมมติว่าเจ้าหน้าที่ตรวจด้วยข้อมูลครบ ถ้ามีความเป็นไปได้ค่อนข้างแน่ว่าจะยอมรับ ใช้ตามที่ยื่นไว้ ถ้าไม่ ให้สะท้อนความไม่แน่นอนด้วยจำนวนที่เป็นไปได้มากที่สุด หรือมูลค่าที่คาดหวัง แล้วแต่วิธีใดทำนายผลได้ดีกว่า

## ออกสอบแบบไหน
- ข้อกาให้ราคาตามบัญชีกับฐานภาษี แล้วถามว่าเกิดสินทรัพย์หรือหนี้สินภาษีรอการตัดบัญชีเท่าไร
- โจทย์คำนวณกำไรทางภาษี ภาษีปัจจุบัน และค่าใช้จ่ายภาษีรวม ต้องแยกผลต่างถาวรกับผลต่างชั่วคราวให้ได้
- ถามผลของการเปลี่ยนอัตราภาษี และภาษีของรายการตีราคาใหม่
- จุดหลอก: ภาษีรอการตัดบัญชีห้ามคิดลด และห้ามแสดงเป็นรายการหมุนเวียน`,

### เรื่องอื่นในการวัดมูลค่า
- ถ้าผลของค่าของเงินตามเวลามีสาระสำคัญ ให้คิดลดด้วยอัตราก่อนภาษี ส่วนที่เพิ่มขึ้นตามเวลาเป็นต้นทุนการกู้ยืม
- พิจารณาเหตุการณ์ในอนาคต เช่น เทคโนโลยีใหม่หรือกฎหมายใหม่ เมื่อมีหลักฐานชัดเจนว่าจะเกิดขึ้น
- ห้ามนำกำไรที่คาดว่าจะได้จากการขายสินทรัพย์มาหักประมาณการหนี้สิน
- เงินชดเชยจากบุคคลอื่น เช่น บริษัทประกัน รับรู้เป็นสินทรัพย์แยกเมื่อเกือบแน่นอนว่าจะได้รับ และไม่เกินประมาณการหนี้สิน ในงบกำไรขาดทุนแสดงสุทธิได้
> ต้องรื้อแท่นขุดเจาะเมื่อครบ 10 ปี คาดว่าจะใช้เงิน 10,000,000 บาท อัตราคิดลด 5% มูลค่าปัจจุบัน 6,139,133 บาท บันทึกเป็นประมาณการหนี้สินและรวมในราคาทุนแท่นขุดเจาะ ปีแรกดอกเบี้ยที่เพิ่มขึ้นตามเวลา 6,139,133 × 5% = 306,957 บาท เป็นต้นทุนทางการเงิน

|สัญญาที่สร้างภาระ|รับรู้ประมาณการหนี้สินเท่ากับต้นทุนที่หลีกเลี่ยงไม่ได้ ซึ่งเป็นจำนวนที่ต่ำกว่าระหว่างต้นทุนสุทธิในการปฏิบัติตามสัญญา กับค่าชดเชยหรือค่าปรับจากการไม่ปฏิบัติตาม ก่อนรับรู้ให้ทดสอบการด้อยค่าสินทรัพย์ที่ใช้กับสัญญานั้นก่อน|

ประมาณการหนี้สินจากการปรับโครงสร้างรวมเฉพาะรายจ่ายทางตรงที่จำเป็นต้องจ่าย และไม่เกี่ยวกับกิจกรรมที่ยังดำเนินอยู่ ห้ามรวมค่าอบรมหรือย้ายพนักงานที่ยังทำงานต่อ ค่าการตลาด และค่าลงทุนระบบใหม่ ส่วนการขายธุรกิจ จะมีภาระผูกพันเมื่อมีสัญญาขายที่ผูกพันแล้วเท่านั้น

## ทบทวนและใช้ประมาณการหนี้สิน
ทบทวนทุกสิ้นงวด ปรับให้เป็นประมาณการที่ดีที่สุดในปัจจุบัน ถ้าไม่ค่อนข้างแน่ว่าต้องจ่ายแล้ว ให้กลับรายการ และใช้ประมาณการหนี้สินจ่ายได้เฉพาะรายจ่ายที่ตั้งไว้แต่แรก

## TFRIC 21 เงินที่นำส่งรัฐ
ใช้กับเงินที่รัฐเรียกเก็บตามกฎหมาย ซึ่งไม่ใช่ภาษีเงินได้และไม่ใช่ค่าปรับ เหตุการณ์ที่ก่อให้เกิดภาระคือกิจกรรมที่กฎหมายกำหนดให้ต้องจ่าย
- ถ้ากฎหมายกำหนดว่า กิจการที่ยังดำเนินงานอยู่ ณ วันที่ 1 มกราคม ต้องจ่าย ให้รับรู้หนี้สินทั้งจำนวนในวันที่ 1 มกราคม ห้ามทยอยรับรู้ในงบระหว่างกาล
- ถ้าภาระเกิดทีละส่วนตามช่วงเวลา ให้ทยอยรับรู้
- ถ้ามีเกณฑ์ขั้นต่ำ เช่น ต้องจ่ายเมื่อรายได้เกิน 50 ล้านบาท ให้รับรู้เมื่อรายได้ถึงเกณฑ์นั้น
- การที่กิจการจำเป็นต้องดำเนินงานต่อในปีหน้า ไม่ทำให้เกิดภาระผูกพันในปัจจุบันสำหรับเงินที่จะเรียกเก็บในปีหน้า

## ผลประโยชน์ระยะสั้น
รับรู้ด้วยจำนวนที่ไม่คิดลด
- วันลาสะสมได้: รับรู้เมื่อพนักงานทำงานจนได้สิทธิเพิ่ม วัดด้วยจำนวนที่คาดว่าจะต้องจ่ายเพิ่มจากสิทธิที่สะสมไว้
- วันลาสะสมไม่ได้: รับรู้เมื่อพนักงานลาจริง
- โบนัสและส่วนแบ่งกำไร: รับรู้เมื่อมีภาระผูกพันตามกฎหมายหรือโดยอนุมาน และประมาณได้อย่างน่าเชื่อถือ
> พนักงาน 100 คน ได้วันลาป่วยคนละ 5 วันต่อปี วันที่ไม่ได้ใช้สะสมไปใช้ปีหน้าได้ 1 ปี และปีหน้าจะใช้สิทธิของปีนั้นก่อนสิทธิที่สะสม สิ้นปีมีวันลาสะสมเฉลี่ยคนละ 1.5 วัน คาดว่าปีหน้า 92 คนจะลาไม่เกิน 5 วัน อีก 8 คนจะลาเฉลี่ย 6.5 วัน สิทธิสะสมที่คาดว่าจะถูกใช้จริงคือ 8 × 1.5 = 12 วัน ถ้าค่าจ้างวันละ 1,000 บาท รับรู้หนี้สิน 12,000 บาท ไม่ใช่ 150,000 บาท

## ผลประโยชน์หลังออกจากงาน

|โครงการผลประโยชน์|นายจ้างสัญญาว่าจะจ่ายผลประโยชน์ตามสูตร นายจ้างรับความเสี่ยงเอง เช่น เงินชดเชยเมื่อเกษียณตามกฎหมายแรงงาน|ใช้ข้อสมมติทางคณิตศาสตร์ประกันภัย และวิธีคิดลดแต่ละหน่วยที่ประมาณการไว้|
> ในไทย พ.ร.บ.คุ้มครองแรงงานกำหนดให้การเกษียณเป็นการเลิกจ้างที่ต้องจ่ายค่าชดเชย ลูกจ้างที่ทำงานครบ 20 ปีขึ้นไปได้ค่าชดเชย 400 วัน กิจการส่วนใหญ่จึงมีโครงการผลประโยชน์ที่ไม่มีสินทรัพย์โครงการ ตอนกฎหมายแก้เพิ่มเป็น 400 วันในปี 2562 กิจการต้องรับรู้ต้นทุนบริการในอดีตทันทีในกำไรหรือขาดทุน

## โครงการผลประโยชน์
หนี้สินผลประโยชน์ที่กำหนดไว้สุทธิ = มูลค่าปัจจุบันของภาระผูกพันผลประโยชน์ − มูลค่ายุติธรรมของสินทรัพย์โครงการ ถ้าได้ผลเป็นสินทรัพย์สุทธิ ต้องจำกัดไม่เกินเพดานสินทรัพย์
### อัตราคิดลด
ใช้อัตราผลตอบแทนตลาดของหุ้นกู้ภาคเอกชนคุณภาพสูง ถ้าไม่มีตลาดที่ซื้อขายคล่อง ใช้อัตราผลตอบแทนพันธบัตรรัฐบาล ในไทยมักใช้พันธบัตรรัฐบาล
### องค์ประกอบของต้นทุน
|องค์ประกอบ|รวมอะไร|รับรู้ที่|
|ต้นทุนบริการ|ต้นทุนบริการปัจจุบัน ต้นทุนบริการในอดีต และผลกำไรขาดทุนจากการจ่ายชำระ|กำไรหรือขาดทุน|

### ต้นทุนบริการในอดีต
เกิดเมื่อแก้ไขหรือลดขนาดโครงการ รับรู้ในกำไรหรือขาดทุนทันที ณ วันที่เกิดก่อนระหว่าง วันแก้ไขหรือลดขนาดโครงการ กับวันที่รับรู้ต้นทุนปรับโครงสร้างหรือผลประโยชน์เมื่อเลิกจ้างที่เกี่ยวข้อง ไม่ทยอยรับรู้

## ผลประโยชน์ระยะยาวอื่น
วัดแบบเดียวกับโครงการผลประโยชน์ แต่รับรู้ทุกองค์ประกอบในกำไรหรือขาดทุน รวมทั้งการวัดมูลค่าใหม่ ไม่มีส่วนที่เข้ากำไรขาดทุนเบ็ดเสร็จอื่น

## ผลประโยชน์เมื่อเลิกจ้าง
รับรู้ ณ วันที่เกิดก่อนระหว่าง วันที่กิจการถอนข้อเสนอไม่ได้แล้ว กับวันที่รับรู้ต้นทุนการปรับโครงสร้างตาม TAS 37 ถ้าเป็นโครงการสมัครใจลาออก ให้วัดตามจำนวนพนักงานที่คาดว่าจะรับข้อเสนอ

## TFRIC 14 เพดานสินทรัพย์
ถ้าสินทรัพย์โครงการมากกว่าภาระผูกพัน ให้รับรู้สินทรัพย์สุทธิได้ไม่เกินมูลค่าปัจจุบันของประโยชน์ที่จะได้ในรูปเงินคืนจากโครงการ หรือการลดเงินสมทบในอนาคต และต้องพิจารณาข้อกำหนดเงินทุนขั้นต่ำที่อาจทำให้ใช้ประโยชน์ได้น้อยลง

## TAS 26 การบัญชีและการรายงานโครงการผลประโยชน์เมื่อออกจากงาน
มาตรฐานนี้ใช้กับงบของตัวกองทุนหรือโครงการเอง ไม่ใช่งบของนายจ้าง
- โครงการสมทบเงิน: แสดงงบสินทรัพย์สุทธิที่มีไว้เพื่อจ่ายผลประโยชน์ และคำอธิบายนโยบายการจัดหาเงินทุน
- โครงการผลประโยชน์: แสดงสินทรัพย์สุทธิที่มีไว้เพื่อจ่ายผลประโยชน์ และมูลค่าปัจจุบันตามหลักคณิตศาสตร์ประกันภัยของผลประโยชน์ที่สัญญาว่าจะจ่าย พร้อมส่วนเกินหรือส่วนขาด
- เงินลงทุนของโครงการแสดงด้วยมูลค่ายุติธรรม

## ออกสอบแบบไหน

## ประเด็นอื่นที่พบบ่อย
- ตัวการรับรู้รายได้เต็มจำนวน ตัวแทนรับรู้เฉพาะค่านายหน้า ดูว่าใครควบคุมสินค้าก่อนโอนให้ลูกค้า
- รับรู้ตลอดช่วงเวลา ใช้วัดความคืบหน้า เช่น ต้นทุนที่เกิดหารต้นทุนรวม
- จ่ายช้าเกิน 1 ปีอาจมีองค์ประกอบการจัดหาเงินที่มีนัยสำคัญ แยกดอกเบี้ยออก
- ต้นทุนส่วนเพิ่มเพื่อให้ได้สัญญา ตั้งเป็นสินทรัพย์ ถ้าตัดจำหน่ายไม่เกิน 1 ปีเลือกเป็นค่าใช้จ่ายได้
- สินค้าฝากขาย ผู้ฝากขายรับรู้รายได้เมื่อผู้รับฝากขายให้ลูกค้าปลายทาง`},

TFRS 15 ตอบคำถามว่า รับรู้รายได้เมื่อไรและเท่าไร หลักคือรับรู้รายได้เมื่อโอนการควบคุมสินค้าหรือบริการให้ลูกค้า ด้วยจำนวนที่กิจการคาดว่าจะมีสิทธิได้รับ ทั้งหมดทำผ่าน 5 ขั้นตอน
@fig rev-5
## ขั้นที่ 1 ระบุสัญญา
สัญญาต้องผ่านครบ 5 เงื่อนไข: คู่สัญญาอนุมัติและผูกพันจะปฏิบัติ ระบุสิทธิของแต่ละฝ่ายได้ ระบุเงื่อนไขการจ่ายได้ มีเนื้อหาเชิงพาณิชย์ และมีความเป็นไปได้ค่อนข้างแน่ว่าจะได้รับเงิน ถ้ายังไม่ผ่าน เงินที่รับมาให้บันทึกเป็นหนี้สินไว้ก่อน
- การรวมสัญญา: สัญญาหลายฉบับที่ทำพร้อมกันกับลูกค้ารายเดียว และเจรจาเป็นชุดเดียว ให้รวมเป็นสัญญาเดียว
- การเปลี่ยนแปลงสัญญา: ถ้าเพิ่มสินค้าที่แยกได้ในราคาขายปกติ ถือเป็นสัญญาใหม่ ถ้าไม่ใช่ ให้ดูว่าสินค้าที่เหลือแยกจากที่ส่งไปแล้วหรือไม่

## ขั้นที่ 2 ระบุภาระที่ต้องปฏิบัติ
ภาระที่ต้องปฏิบัติคือคำสัญญาว่าจะโอนสินค้าหรือบริการที่แยกเป็นอิสระได้ สินค้าแยกได้เมื่อผ่านทั้ง 2 ข้อ คือ ลูกค้าได้ประโยชน์จากสินค้านั้นเองหรือร่วมกับทรัพยากรที่หาได้ทั่วไป และคำสัญญานั้นแยกจากคำสัญญาอื่นในสัญญาได้
> ขายเครื่องปรับอากาศพร้อมติดตั้ง ถ้าร้านอื่นติดตั้งให้ได้ การติดตั้งเป็นอีกภาระหนึ่ง แต่ถ้าเป็นระบบที่ต้องออกแบบและปรับแต่งให้ทำงานร่วมกันจนเป็นของชิ้นเดียว ให้รวมเป็นภาระเดียว
### การรับประกันสินค้า
|ประเภท|ลักษณะ|การบัญชี|
|รับประกันว่าใช้ได้ตามสเปก|เป็นเรื่องปกติของสินค้า ลูกค้าเลือกซื้อแยกไม่ได้|ตั้งประมาณการหนี้สินตาม TAS 37|
|รับประกันเพิ่มเป็นบริการ|ลูกค้าเลือกซื้อแยกได้ หรือให้บริการเกินกว่าสเปก|เป็นภาระที่ต้องปฏิบัติแยก รับรู้รายได้ตามช่วงเวลา|

## ขั้นที่ 3 กำหนดราคาของรายการ
คือจำนวนที่คาดว่าจะมีสิทธิได้รับ ไม่รวมเงินที่เก็บแทนบุคคลอื่น เช่น ภาษีมูลค่าเพิ่ม
- สิ่งตอบแทนผันแปร เช่น ส่วนลดตามยอด โบนัส สิทธิคืนสินค้า ประมาณด้วยมูลค่าที่คาดหวังหรือจำนวนที่เป็นไปได้มากที่สุด และใส่ในราคาเท่าที่ค่อนข้างแน่ว่าจะไม่ต้องกลับรายการรายได้จำนวนมากภายหลัง
- องค์ประกอบการจัดหาเงินที่มีนัยสำคัญ: ถ้ารับเงินก่อนหรือหลังโอนสินค้านานเกินหนึ่งปี ให้แยกดอกเบี้ยออก
- สิ่งตอบแทนที่ไม่ใช่เงินสด: วัดด้วยมูลค่ายุติธรรม
- สิ่งตอบแทนที่จ่ายให้ลูกค้า เช่น ค่าวางสินค้าในร้าน: หักจากรายได้ เว้นแต่จ่ายแลกกับสินค้าหรือบริการที่แยกได้
> ขายสินค้า 1,000 ชิ้น ชิ้นละ 800 บาท ทุนชิ้นละ 480 บาท ลูกค้าคืนได้ภายใน 30 วัน คาดว่าจะคืน 10%
|รายการ|บาท|
|รายได้ 900 ชิ้น × 800|720,000|
|หนี้สินเงินคืน 100 ชิ้น × 800|80,000|
|สินทรัพย์สิทธิในการรับคืนสินค้า 100 ชิ้น × 480|48,000|
|ต้นทุนขาย 900 ชิ้น × 480|432,000|
> ขายเครื่องจักรวันนี้ ให้ลูกค้าจ่ายเงินครั้งเดียวเมื่อครบ 2 ปี 1,210,000 บาท ราคาขายเงินสดและอัตราดอกเบี้ยที่เหมาะสมทำให้มูลค่าปัจจุบันเท่ากับ 1,210,000 ÷ 1.1² = 1,000,000 บาท รับรู้รายได้จากการขาย 1,000,000 บาทวันส่งมอบ และรับรู้ดอกเบี้ยรับปีแรก 100,000 บาท ปีที่สอง 110,000 บาท

## ขั้นที่ 4 ปันส่วนราคา
ปันส่วนราคาของรายการให้แต่ละภาระตามสัดส่วนราคาขายแบบเอกเทศ คือราคาที่ขายแยกให้ลูกค้าตามปกติ ถ้าไม่มีราคานั้น ให้ประมาณด้วยวิธีปรับราคาตลาด วิธีต้นทุนบวกกำไร หรือวิธีคงเหลือ ซึ่งใช้ได้เฉพาะเมื่อราคาขายผันผวนมากหรือยังไม่เคยกำหนด
> ขายมือถือพร้อมบริการ 12 เดือน ราคารวม 21,000 บาท ถ้าขายแยก มือถือ 18,000 บาท บริการ 6,000 บาท รวม 24,000 บาท
|ภาระที่ต้องปฏิบัติ|ราคาขายแบบเอกเทศ|ปันส่วน|รับรู้รายได้|
|มือถือ|18,000|15,750|วันส่งมอบ|
|บริการ 12 เดือน|6,000|5,250|เดือนละ 437.50|
|รวม|24,000|21,000||
มือถือ 21,000 × 18/24 = 15,750 บาท บริการ 21,000 × 6/24 = 5,250 บาท
### คะแนนสะสมของลูกค้า
คะแนนที่ให้ลูกค้าเป็นสิทธิซื้อสินค้าในอนาคตในราคาถูกลง จึงเป็นภาระที่ต้องปฏิบัติแยก
> ขายสินค้า 100,000 บาท ให้คะแนน 10,000 คะแนน คะแนนละ 1 บาท คาดว่าลูกค้าจะใช้ 80% ราคาขายแบบเอกเทศของคะแนน 8,000 บาท ปันส่วนให้สินค้า 100,000 × 100/108 = 92,593 บาท และคะแนน 7,407 บาท ซึ่งบันทึกเป็นหนี้สินที่เกิดจากสัญญา แล้วรับรู้เป็นรายได้ตามคะแนนที่ลูกค้าใช้

## ขั้นที่ 5 รับรู้รายได้
### รับรู้ตลอดช่วงเวลา
ถ้าเข้าข้อใดข้อหนึ่งใน 3 ข้อนี้ ให้รับรู้ตามความคืบหน้า
- ลูกค้าได้รับและใช้ประโยชน์ไปพร้อมกับที่กิจการทำงาน เช่น บริการทำความสะอาดรายเดือน
- งานของกิจการสร้างหรือปรับปรุงสินทรัพย์ที่ลูกค้าควบคุม เช่น ก่อสร้างบนที่ดินของลูกค้า
- งานไม่ได้สร้างสินทรัพย์ที่กิจการนำไปใช้ทางอื่นได้ และกิจการมีสิทธิได้รับชำระสำหรับงานที่ทำเสร็จแล้ว
> สัญญาก่อสร้างราคา 10,000,000 บาท ประมาณต้นทุนรวม 8,000,000 บาท ปีแรกเกิดต้นทุน 3,000,000 บาท วัดความคืบหน้าด้วยวิธีปัจจัยนำเข้า ความคืบหน้า 3,000,000 ÷ 8,000,000 = 37.5% รับรู้รายได้ 3,750,000 บาท กำไร 750,000 บาท ถ้าประมาณว่าทั้งสัญญาจะขาดทุน ต้องรับรู้ขาดทุนทั้งจำนวนทันทีตาม TAS 37
### รับรู้ ณ เวลาใดเวลาหนึ่ง
ดูข้อบ่งชี้ว่าการควบคุมโอนแล้ว เช่น กิจการมีสิทธิได้รับชำระแล้ว ลูกค้ามีกรรมสิทธิ์ตามกฎหมาย ส่งมอบสินค้าแล้ว ลูกค้ารับความเสี่ยงและผลตอบแทนแล้ว และลูกค้ายอมรับสินค้าแล้ว

## เรื่องเฉพาะที่ออกบ่อย
|เรื่อง|การปฏิบัติ|
|ตัวการหรือตัวแทน|ถ้าควบคุมสินค้าก่อนโอนให้ลูกค้า เป็นตัวการ รับรู้รายได้เต็มจำนวน ถ้าไม่ เป็นตัวแทน รับรู้เฉพาะค่านายหน้า|
|ขายฝากสินค้า|ยังไม่รับรู้รายได้ตอนส่งไปให้ผู้รับฝาก เพราะผู้รับฝากยังไม่ได้ควบคุมสินค้า|

## ต้นทุนของสัญญา
- ต้นทุนส่วนเพิ่มในการได้สัญญา เช่น ค่านายหน้าที่จ่ายเพราะได้สัญญานี้ บันทึกเป็นสินทรัพย์ถ้าคาดว่าจะได้คืน ถ้าตัดจำหน่ายภายใน 1 ปี เลือกบันทึกเป็นค่าใช้จ่ายได้เลย
- ต้นทุนในการปฏิบัติตามสัญญาที่ไม่อยู่ในมาตรฐานอื่น บันทึกเป็นสินทรัพย์ได้ถ้าเกี่ยวกับสัญญาโดยตรง สร้างทรัพยากรที่จะใช้ปฏิบัติตามสัญญา และคาดว่าจะได้คืน
## สินทรัพย์และหนี้สินที่เกิดจากสัญญา
- สินทรัพย์ที่เกิดจากสัญญา: ทำงานไปแล้วแต่สิทธิรับเงินยังมีเงื่อนไขอื่นนอกจากเวลา
- ลูกหนี้: สิทธิรับเงินที่ไม่มีเงื่อนไขแล้ว เหลือแค่รอเวลา
- หนี้สินที่เกิดจากสัญญา: รับเงินหรือถึงกำหนดรับเงินแล้ว แต่ยังไม่ได้โอนสินค้าหรือบริการ

## ออกสอบแบบไหน
- ข้อกาปันส่วนราคาตามราคาขายแบบเอกเทศ และคำนวณรายได้เมื่อมีสิทธิคืนสินค้า
- คำนวณรายได้สัญญาก่อสร้างตามความคืบหน้า
- ถามแยกตัวการกับตัวแทน การรับประกันสองแบบ และขายฝาก
- ข้อเขียนชอบให้อธิบายครบ 5 ขั้นตอนกับสถานการณ์เดียว ให้เขียนเรียงทีละขั้น`,

## การจัดประเภทหมุนเวียนและไม่หมุนเวียน
หนี้สินเป็นหนี้สินหมุนเวียนถ้าเข้าข้อใดข้อหนึ่ง: คาดว่าจะชำระในรอบการดำเนินงานปกติ ถือไว้เพื่อค้า ถึงกำหนดชำระภายใน 12 เดือนหลังวันสิ้นงวด หรือกิจการไม่มีสิทธิเลื่อนการชำระออกไปอย่างน้อย 12 เดือนนับจากวันสิ้นงวด
- สิทธิเลื่อนการชำระต้องมีอยู่ ณ วันสิ้นงวด ความตั้งใจของผู้บริหารไม่มีผล
- เงื่อนไขในสัญญาเงินกู้ที่ต้องทำตามภายหลังวันสิ้นงวด ไม่กระทบการจัดประเภท ณ วันสิ้นงวด แต่ต้องเปิดเผยข้อมูล
- เงื่อนไขที่ต้องทำตามภายในวันสิ้นงวด ถ้าผิดเงื่อนไขแล้ว เงินกู้กลายเป็นหนี้สินหมุนเวียน เว้นแต่ผู้ให้กู้ผ่อนผันก่อนหรือ ณ วันสิ้นงวด ให้ระยะเวลาอย่างน้อย 12 เดือน
> เงินกู้ครบกำหนดอีก 3 ปี แต่ ณ 31 ธ.ค. บริษัทผิดเงื่อนไขอัตราส่วนหนี้สิน ทำให้ผู้ให้กู้เรียกคืนได้ทันที ธนาคารมีหนังสือผ่อนผันในวันที่ 15 ม.ค. ปีถัดไป เงินกู้ต้องแสดงเป็นหนี้สินหมุนเวียน ณ 31 ธ.ค. เพราะการผ่อนผันเกิดหลังวันสิ้นงวด
! ภาษีเงินได้รอการตัดบัญชีห้ามแสดงเป็นรายการหมุนเวียน

## งบกำไรขาดทุนเบ็ดเสร็จ
แสดงค่าใช้จ่ายตามลักษณะ เช่น ค่าเสื่อม ค่าแรง วัตถุดิบ หรือตามหน้าที่ เช่น ต้นทุนขาย ค่าใช้จ่ายในการขาย ค่าใช้จ่ายบริหาร ถ้าเลือกแบบตามหน้าที่ ต้องเปิดเผยตามลักษณะเพิ่มในหมายเหตุ ห้ามแสดงรายการพิเศษทั้งในงบและหมายเหตุ

## วิธีทางตรงและการหาเงินที่จ่ายจริง
วิธีทางตรงแสดงเงินรับจากลูกค้าและเงินจ่ายผู้ขายโดยตรง มาตรฐานสนับสนุนให้ใช้ ข้อสอบชอบให้คำนวณเงินจ่ายจริงจากตัวเลขในงบ
> ต้นทุนขาย 2,000,000 บาท สินค้าคงเหลือลด 70,000 บาท เจ้าหนี้เพิ่ม 40,000 บาท ยอดซื้อ = 2,000,000 − 70,000 = 1,930,000 บาท เงินจ่ายผู้ขาย = 1,930,000 − 40,000 = 1,890,000 บาท
> ยอดขาย 3,500,000 บาท ลูกหนี้เพิ่ม 150,000 บาท เงินรับจากลูกค้า = 3,500,000 − 150,000 = 3,350,000 บาท

## รายการที่ไม่ใช่เงินสดและการเปิดเผย
- รายการลงทุนและจัดหาเงินที่ไม่ใช้เงินสด เช่น ซื้อที่ดินด้วยการออกหุ้น ทำสัญญาเช่าใหม่ ไม่อยู่ในงบ แต่ต้องเปิดเผยในหมายเหตุ
- เปิดเผยการเปลี่ยนแปลงของหนี้สินที่เกิดจากกิจกรรมจัดหาเงิน ทั้งส่วนที่เป็นเงินสดและไม่ใช่เงินสด
- ข้อตกลงการจัดหาเงินสำหรับผู้ขาย เช่น โครงการให้ธนาคารจ่ายเจ้าหนี้แทน ต้องเปิดเผยเงื่อนไขและยอดคงเหลือ
- ได้มาหรือขายบริษัทย่อย แสดงเงินสดสุทธิในกิจกรรมลงทุน

eps:`## ภาพรวม
กำไรต่อหุ้นคือกำไรที่เป็นของผู้ถือหุ้นสามัญหารด้วยจำนวนหุ้นสามัญถัวเฉลี่ยถ่วงน้ำหนัก ใช้เทียบผลงานต่อหุ้นระหว่างปีหรือระหว่างบริษัท TAS 33 ใช้กับบริษัทที่หุ้นสามัญซื้อขายในตลาด หรืออยู่ระหว่างยื่นขอเข้าตลาด และต้องแสดงทั้งกำไรต่อหุ้นขั้นพื้นฐานและกำไรต่อหุ้นปรับลด

## กำไรต่อหุ้นขั้นพื้นฐาน
### ตัวตั้ง
กำไรสุทธิส่วนที่เป็นของบริษัทใหญ่ หักเงินปันผลหุ้นบุริมสิทธิ
- หุ้นบุริมสิทธิชนิดสะสม: หักเงินปันผลของปีนั้นเสมอ แม้ยังไม่ได้ประกาศจ่าย
- หุ้นบุริมสิทธิชนิดไม่สะสม: หักเฉพาะเงินปันผลที่ประกาศสำหรับปีนั้น
### ตัวหาร
จำนวนหุ้นสามัญถัวเฉลี่ยถ่วงน้ำหนักด้วยระยะเวลาที่หุ้นอยู่ในมือผู้ถือ
> 1 ม.ค. มีหุ้นสามัญ 1,000,000 หุ้น 1 เม.ย. ออกหุ้นเพิ่มทุนรับเงินสด 400,000 หุ้น 1 ต.ค. ซื้อหุ้นคืน 120,000 หุ้น กำไรสุทธิ 4,000,000 บาท เงินปันผลหุ้นบุริมสิทธิชนิดสะสมของปี 190,000 บาท
|วันที่|รายการ|หุ้น|น้ำหนัก|ถ่วงน้ำหนัก|
|1 ม.ค.|ยอดยกมา|1,000,000|12/12|1,000,000|
|1 เม.ย.|ออกหุ้น|400,000|9/12|300,000|
|1 ต.ค.|ซื้อคืน|(120,000)|3/12|(30,000)|
|รวม||||1,270,000|
กำไรต่อหุ้นขั้นพื้นฐาน = (4,000,000 − 190,000) ÷ 1,270,000 = 3.00 บาท
### หุ้นปันผลและการแตกหุ้น
หุ้นปันผล การแตกหุ้น และการรวมหุ้น ไม่ได้ทำให้กิจการได้เงินเพิ่ม จึงถือเหมือนเกิดตั้งแต่ต้นงวดแรกที่แสดง ต้องปรับจำนวนหุ้นของทุกงวดที่แสดงรวมถึงงวดเปรียบเทียบ แม้เกิดหลังวันสิ้นงวดแต่ก่อนอนุมัติงบ
> ต่อจากตัวอย่าง ถ้าวันที่ 1 ธ.ค. จ่ายหุ้นปันผล 1 หุ้นใหม่ต่อ 10 หุ้นเดิม จำนวนหุ้นถ่วงน้ำหนักของปีนี้เป็น 1,270,000 × 1.1 = 1,397,000 หุ้น กำไรต่อหุ้น 3,810,000 ÷ 1,397,000 = 2.73 บาท และกำไรต่อหุ้นปีก่อนต้องคำนวณใหม่ด้วยจำนวนหุ้นที่คูณ 1.1 เช่นกัน
การออกหุ้นเพิ่มทุนให้ผู้ถือหุ้นเดิมในราคาต่ำกว่าตลาด มีส่วนที่เหมือนหุ้นปันผลแฝงอยู่ ต้องปรับด้วยตัวปรับ = ราคาตลาดก่อนใช้สิทธิ ÷ ราคาตามทฤษฎีหลังใช้สิทธิ

## กำไรต่อหุ้นปรับลด
สมมติว่าหุ้นสามัญที่อาจเกิดขึ้นถูกแปลงเป็นหุ้นทั้งหมดตั้งแต่ต้นงวด หรือวันที่ออก ถ้าออกระหว่างงวด แล้วดูว่ากำไรต่อหุ้นลดลงหรือไม่
|ประเภท|ปรับตัวตั้ง|ปรับตัวหาร|
|หุ้นกู้แปลงสภาพ|บวกดอกเบี้ยหลังภาษีกลับ|บวกหุ้นที่จะได้จากการแปลง|
|หุ้นบุริมสิทธิแปลงสภาพ|บวกเงินปันผลหุ้นบุริมสิทธิกลับ|บวกหุ้นที่จะได้จากการแปลง|
|สิทธิซื้อหุ้นและใบสำคัญแสดงสิทธิ|ไม่ปรับ|บวกเฉพาะหุ้นที่เหมือนได้ฟรี = จำนวนสิทธิ × (1 − ราคาใช้สิทธิ ÷ ราคาตลาดถัวเฉลี่ย)|
- รายการที่ทำให้กำไรต่อหุ้นสูงขึ้นหรือขาดทุนต่อหุ้นลดลง เรียกว่ามีผลต่อต้านการปรับลด ห้ามนำมารวม

- สิทธิซื้อหุ้นปรับลดได้เฉพาะเมื่อราคาใช้สิทธิต่ำกว่าราคาตลาดถัวเฉลี่ย
> ต่อจากตัวอย่าง มีสิทธิซื้อหุ้น 100,000 สิทธิ ราคาใช้สิทธิ 40 บาท ราคาตลาดถัวเฉลี่ย 50 บาท และหุ้นกู้แปลงสภาพ 5,000,000 บาท ดอกเบี้ย 6% แปลงได้ 150,000 หุ้น อัตราภาษี 20%
|รายการ|กำไรส่วนเพิ่ม|หุ้นส่วนเพิ่ม|ต่อหุ้น|
|สิทธิซื้อหุ้น 100,000 × (1 − 40/50)|0|20,000|0.00|
|หุ้นกู้แปลงสภาพ 5,000,000 × 6% × 80%|240,000|150,000|1.60|

|ขั้น|กำไร|หุ้น|กำไรต่อหุ้น|
|ขั้นพื้นฐาน|3,810,000|1,270,000|3.00|
|บวก สิทธิซื้อหุ้น|3,810,000|1,290,000|2.95|
|บวก หุ้นกู้แปลงสภาพ|4,050,000|1,440,000|2.81|
ทั้งสองรายการทำให้ตัวเลขลดลง กำไรต่อหุ้นปรับลดจึงเป็น 2.81 บาท

## การนำเสนอ
- แสดงกำไรต่อหุ้นขั้นพื้นฐานและปรับลดในงบกำไรขาดทุนเบ็ดเสร็จ สำหรับกำไรจากการดำเนินงานต่อเนื่องและกำไรสุทธิ ให้ความสำคัญเท่ากัน แม้ตัวเลขติดลบ

- รับรู้ผลในงวดที่เปลี่ยน และงวดอนาคตถ้ากระทบด้วย
- ถ้าแยกไม่ออกว่าเป็นการเปลี่ยนนโยบายหรือประมาณการ ให้ถือเป็นการเปลี่ยนประมาณการ
> เครื่องจักรราคาทุน 1,000,000 บาท อายุ 10 ปี ไม่มีมูลค่าคงเหลือ ใช้มา 4 ปี ราคาตามบัญชี 600,000 บาท ต้นปีที่ 5 ประเมินใหม่ว่าใช้ได้อีก 3 ปี ค่าเสื่อมปีที่ 5 เป็นต้นไป 600,000 ÷ 3 = 200,000 บาทต่อปี ไม่แก้ปีที่ 1 ถึง 4

## ข้อผิดพลาด
ข้อผิดพลาดของงวดก่อนคือการละเว้นหรือแสดงผิดในงบงวดก่อน เพราะไม่ใช้หรือใช้ข้อมูลที่น่าเชื่อถือผิด ทั้งที่ข้อมูลนั้นมีอยู่ตอนอนุมัติงบ เช่น คำนวณผิด ใช้นโยบายผิด มองข้ามข้อเท็จจริง และการทุจริต ถ้ามีสาระสำคัญต้องแก้ย้อนหลังในงบชุดแรกที่อนุมัติหลังพบ

## ออกสอบแบบไหน
- ข้อกาจัดประเภทสถานการณ์ว่าเป็นการเปลี่ยนนโยบาย ประมาณการ หรือข้อผิดพลาด
- คำนวณผลต่อกำไรสะสมต้นปีหลังภาษี และค่าเสื่อมราคาใหม่หลังเปลี่ยนอายุ
- จุดหลอก: เปลี่ยนวิธีคิดค่าเสื่อมเป็นการเปลี่ยนประมาณการ ไม่ใช่นโยบาย`,

lessor:`## ภาพรวม
ผู้ให้เช่าใน TFRS 16 ยังแบ่งสัญญาเป็น 2 ประเภทเหมือนเดิม ต่างจากผู้เช่าที่บันทึกแบบเดียว ถ้าสัญญาโอนความเสี่ยงและผลตอบแทนเกือบทั้งหมดของการเป็นเจ้าของไปให้ผู้เช่า เป็นสัญญาเช่าเงินทุน ถ้าไม่ เป็นสัญญาเช่าดำเนินงาน
> สัญญาเช่าเงินทุนเหมือนขายของแบบผ่อน ผู้ให้เช่าเปลี่ยนจากเจ้าของรถเป็นเจ้าหนี้ สัญญาเช่าดำเนินงานเหมือนให้เช่าห้องรายเดือน ห้องยังเป็นของเรา
## ข้อบ่งชี้ของสัญญาเช่าเงินทุน
- โอนกรรมสิทธิ์ให้ผู้เช่าเมื่อสิ้นสุดสัญญา
- ผู้เช่ามีสิทธิเลือกซื้อในราคาที่ต่ำกว่ามูลค่ายุติธรรมมาก จนค่อนข้างแน่ว่าจะใช้สิทธิ
- อายุสัญญาเช่าเป็นส่วนใหญ่ของอายุการให้ประโยชน์
- มูลค่าปัจจุบันของค่าเช่าเกือบเท่ามูลค่ายุติธรรมของสินทรัพย์
- สินทรัพย์มีลักษณะเฉพาะ ผู้เช่าเท่านั้นที่ใช้ได้โดยไม่ต้องดัดแปลงมาก
ข้อบ่งชี้อื่น เช่น ผู้เช่ารับผลขาดทุนเมื่อยกเลิกสัญญา หรือรับผลกำไรขาดทุนจากมูลค่าคงเหลือ ไม่มีตัวเลขเปอร์เซ็นต์ตายตัวในมาตรฐาน ต้องดูเนื้อหาของรายการ

## สัญญาเช่าเงินทุน
- วันเริ่มสัญญา ตัดสินทรัพย์ออก บันทึกลูกหนี้ด้วยเงินลงทุนสุทธิในสัญญาเช่า คือมูลค่าปัจจุบันของค่าเช่าที่จะได้รับและมูลค่าคงเหลือที่ไม่ได้รับประกัน คิดลดด้วยอัตราดอกเบี้ยตามนัยของสัญญาเช่า
- ภายหลัง รับรู้รายได้ทางการเงินด้วยอัตราผลตอบแทนคงที่บนเงินลงทุนสุทธิ
- ต้นทุนทางตรงเริ่มแรก รวมในเงินลงทุนสุทธิ ยกเว้นผู้ผลิตหรือผู้แทนจำหน่ายที่ให้เช่า ให้เป็นค่าใช้จ่ายตอนรับรู้กำไรจากการขาย
> 1 ม.ค. 2569 ให้เช่าเครื่องจักรมูลค่ายุติธรรม 500,000 บาท 5 ปี ค่าเช่าปลายปีปีละ 125,228 บาท อัตราดอกเบี้ยตามนัย 8% ไม่มีมูลค่าคงเหลือ
|ปี|ลูกหนี้ต้นปี|รายได้ทางการเงิน 8%|ค่าเช่ารับ|ลดเงินต้น|ลูกหนี้ปลายปี|
|2569|500,000|40,000|125,228|85,228|414,772|
|2570|414,772|33,182|125,228|92,046|322,726|
|2571|322,726|25,818|125,228|99,410|223,316|
|2572|223,316|17,865|125,228|107,363|115,953|
|2573|115,953|9,275|125,228|115,953|0|
ปีสุดท้ายปัดเศษให้ลูกหนี้เหลือศูนย์ ค่าเช่า 125,228 บาทมาจาก 500,000 ÷ 3.9927 ซึ่งเป็นตัวคูณมูลค่าปัจจุบันของเงินงวด 5 ปี 8%
### ผู้ผลิตหรือผู้แทนจำหน่ายที่ให้เช่า
รับรู้กำไรจากการขายเหมือนขายปกติ รายได้ = มูลค่ายุติธรรมหรือมูลค่าปัจจุบันของค่าเช่าคิดลดด้วยอัตราตลาด แล้วแต่จำนวนใดต่ำกว่า ต้นทุนขาย = ราคาทุนของสินทรัพย์หักมูลค่าปัจจุบันของมูลค่าคงเหลือที่ไม่ได้รับประกัน
> ถ้าเครื่องจักรในตัวอย่างข้างบนผลิตเองด้วยต้นทุน 400,000 บาท ผู้ให้เช่ารับรู้รายได้ 500,000 บาท ต้นทุนขาย 400,000 บาท กำไรจากการขาย 100,000 บาท ณ วันเริ่มสัญญา แล้วจึงรับรู้รายได้ทางการเงินตามตาราง

## สัญญาเช่าดำเนินงาน
- ผู้ให้เช่ายังบันทึกสินทรัพย์ไว้ และคิดค่าเสื่อมราคาตามปกติ
- รับรู้รายได้ค่าเช่าด้วยวิธีเส้นตรงตลอดอายุสัญญา แม้ค่าเช่าที่เก็บจริงแต่ละเดือนไม่เท่ากัน
- สิ่งจูงใจที่ให้ผู้เช่า เช่น ฟรีค่าเช่าช่วงแรก ให้เกลี่ยลดรายได้ค่าเช่าตลอดอายุสัญญา
- ต้นทุนทางตรงเริ่มแรก บวกในราคาตามบัญชีของสินทรัพย์ แล้วทยอยรับรู้เป็นค่าใช้จ่ายแบบเดียวกับรายได้ค่าเช่า
> ให้เช่าพื้นที่ 36 เดือน เดือนละ 100,000 บาท ฟรีค่าเช่า 3 เดือนแรก เงินที่เก็บได้ทั้งหมด 33 เดือน × 100,000 = 3,300,000 บาท รับรู้รายได้เดือนละ 3,300,000 ÷ 36 = 91,667 บาท ช่วง 3 เดือนแรกไม่ได้เงิน แต่รับรู้รายได้ ทำให้มีลูกหนี้ค่าเช่าค้างรับ 275,000 บาท แล้วค่อยลดลงเมื่อเก็บเงินเดือนละ 100,000 บาท
@fig lessor-op

## การขายและเช่ากลับ ฝั่งผู้ซื้อที่เป็นผู้ให้เช่า
ถ้าการโอนเป็นการขายตาม TFRS 15 ผู้ซื้อบันทึกการซื้อสินทรัพย์ และบันทึกสัญญาเช่าตามประเภท ถ้าไม่เป็นการขาย ผู้ซื้อไม่บันทึกสินทรัพย์ แต่บันทึกเงินที่จ่ายเป็นสินทรัพย์ทางการเงินตาม TFRS 9

## ออกสอบแบบไหน
- ข้อกาจัดประเภทสัญญาจากข้อบ่งชี้
- คำนวณรายได้ทางการเงินปีแรกและลูกหนี้ปลายปีของสัญญาเช่าเงินทุน
- คำนวณกำไรจากการขายของผู้ผลิตที่ให้เช่า
- คำนวณรายได้ค่าเช่าต่อเดือนเมื่อมีเดือนฟรี ซึ่งต้องเกลี่ยตามวิธีเส้นตรง`,

disc:`## ภาพรวม
หัวข้อนี้รวม 3 มาตรฐานที่เน้นการเปิดเผยข้อมูล คือ TFRS 8 ส่วนงานดำเนินงาน TAS 24 บุคคลหรือกิจการที่เกี่ยวข้องกัน และ TAS 10 เหตุการณ์ภายหลังรอบระยะเวลารายงาน

## เหตุการณ์ภายหลังรอบระยะเวลารายงาน ตาม TAS 10
คือเหตุการณ์ที่เกิดระหว่างวันสิ้นงวดกับวันที่อนุมัติให้ออกงบการเงิน
@fig disc-events
|ประเภท|ความหมาย|ตัวอย่าง|
|ต้องปรับปรุงงบ|ให้หลักฐานเพิ่มเติมเกี่ยวกับสถานการณ์ที่มีอยู่แล้ว ณ วันสิ้นงวด|ศาลตัดสินคดีที่ฟ้องก่อนวันสิ้นงวด ลูกหนี้ล้มละลายหลังวันสิ้นงวด ขายสินค้าได้ต่ำกว่าทุน พบการทุจริตหรือข้อผิดพลาด ทราบราคาทุนของสินทรัพย์ที่ซื้อก่อนวันสิ้นงวด|
|ไม่ต้องปรับปรุง เปิดเผยถ้ามีสาระสำคัญ|เกิดจากสถานการณ์ที่เกิดขึ้นหลังวันสิ้นงวด|ไฟไหม้ น้ำท่วม ราคาตลาดของเงินลงทุนลดลง ซื้อกิจการ ประกาศปรับโครงสร้าง ออกหุ้นใหม่|
- เงินปันผลที่ประกาศหลังวันสิ้นงวด ห้ามบันทึกเป็นหนี้สิน ณ วันสิ้นงวด เพราะยังไม่มีภาระผูกพัน ให้เปิดเผยในหมายเหตุ
- ถ้าหลังวันสิ้นงวดผู้บริหารตั้งใจจะเลิกกิจการหรือไม่มีทางเลือกอื่น ห้ามทำงบตามเกณฑ์การดำเนินงานต่อเนื่อง
- ต้องเปิดเผยวันที่อนุมัติให้ออกงบการเงินและผู้อนุมัติ
> 20 ม.ค. 2570 ลูกหนี้รายใหญ่ล้มละลาย ศาลพบว่าฐานะการเงินทรุดมาตั้งแต่กลางปี 2569 เป็นเหตุการณ์ที่ต้องปรับปรุง ตั้งค่าเผื่อในงบปี 2569 แต่ถ้าลูกหนี้ล้มละลายเพราะโรงงานไฟไหม้ในเดือน ม.ค. 2570 เป็นเหตุการณ์ที่ไม่ต้องปรับปรุง

## ส่วนงานดำเนินงาน ตาม TFRS 8
ใช้กับกิจการที่ตราสารซื้อขายในตลาด หรืออยู่ระหว่างยื่นขอ หลักคือแสดงข้อมูลแบบที่ผู้บริหารใช้จริง เรียกว่าแนวทางของผู้บริหาร
- ส่วนงานดำเนินงาน คือส่วนของกิจการที่หารายได้และมีค่าใช้จ่าย ผู้มีอำนาจตัดสินใจสูงสุดด้านการดำเนินงานสอบทานผลการดำเนินงานอย่างสม่ำเสมอ และมีข้อมูลการเงินแยกได้
- ส่วนงานที่ต้องรายงาน คือส่วนงานที่ผ่านเกณฑ์อย่างน้อยหนึ่งข้อ
|เกณฑ์เชิงปริมาณ|เทียบกับ|
|รายได้รวม ทั้งภายนอกและระหว่างส่วนงาน ตั้งแต่ 10%|รายได้รวมของทุกส่วนงาน|
|กำไรหรือขาดทุน ตั้งแต่ 10%|ค่าที่มากกว่าระหว่าง กำไรรวมของส่วนงานที่มีกำไร กับขาดทุนรวมของส่วนงานที่ขาดทุน|
|สินทรัพย์ ตั้งแต่ 10%|สินทรัพย์รวมของทุกส่วนงาน|
- รายได้จากภายนอกของส่วนงานที่ต้องรายงานรวมกันต้องไม่ต่ำกว่า 75% ของรายได้รวมของกิจการ ถ้าไม่ถึง ต้องเพิ่มส่วนงานจนถึง
- เปิดเผยข้อมูลระดับกิจการด้วย เช่น รายได้ตามสินค้าหรือบริการ ตามภูมิศาสตร์ และลูกค้ารายใหญ่ที่มีรายได้ตั้งแต่ 10% ของรายได้รวม โดยไม่ต้องบอกชื่อลูกค้า
> ส่วนงานกำไร A 600 B 300 และขาดทุน C 200 D 150 ล้านบาท กำไรรวม 900 ขาดทุนรวม 350 ใช้ 900 เป็นฐาน เกณฑ์ 10% คือ 90 ล้านบาท ทั้ง A B C D ผ่านเกณฑ์กำไรขาดทุน เพราะขาดทุนของ C และ D เกิน 90 ล้านบาทเช่นกัน

## บุคคลหรือกิจการที่เกี่ยวข้องกัน ตาม TAS 24
### ใครบ้าง
- บุคคลหรือครอบครัวใกล้ชิดที่ควบคุม ควบคุมร่วม มีอิทธิพลอย่างมีนัยสำคัญ หรือเป็นผู้บริหารสำคัญของกิจการหรือบริษัทใหญ่
- กิจการในกลุ่มเดียวกัน บริษัทร่วม การร่วมค้า และบริษัทย่อยของกิจการเหล่านั้น
- กองทุนผลประโยชน์หลังออกจากงานของพนักงาน
- กิจการที่ให้บริการผู้บริหารสำคัญแก่กิจการ
### ใครไม่ใช่โดยอัตโนมัติ
กิจการสองแห่งที่มีกรรมการร่วมกันคนเดียว ผู้ให้กู้ สหภาพแรงงาน หน่วยงานรัฐ และลูกค้าหรือผู้ขายรายใหญ่ที่พึ่งพากันทางเศรษฐกิจ
### เปิดเผยอะไร
- ความสัมพันธ์กับบริษัทใหญ่และบริษัทย่อย แม้ไม่มีรายการระหว่างกัน
- ค่าตอบแทนผู้บริหารสำคัญ แยกเป็นผลประโยชน์ระยะสั้น หลังออกจากงาน ระยะยาวอื่น เมื่อเลิกจ้าง และการจ่ายโดยใช้หุ้น
- ลักษณะความสัมพันธ์ รายการ ยอดคงค้าง เงื่อนไข และค่าเผื่อหนี้สงสัยจะสูญ
- ระบุว่ารายการเป็นไปตามราคาตลาดได้ เฉพาะเมื่อพิสูจน์ได้

## ออกสอบแบบไหน
- ข้อกาจำแนกเหตุการณ์ภายหลังว่าต้องปรับปรุงหรือไม่
- ถามว่าเงินปันผลที่ประกาศหลังวันสิ้นงวดแสดงอย่างไร
- คำนวณเกณฑ์ 10% ของกำไรขาดทุนส่วนงาน และเกณฑ์ 75%
- ถามว่าใครเป็นบุคคลที่เกี่ยวข้องกัน`,

fi32:`## ภาพรวม
TAS 32 ตอบว่าเครื่องมือทางการเงินที่กิจการออกเป็นหนี้สินหรือส่วนของเจ้าของ ส่วน TFRS 7 กำหนดสิ่งที่ต้องเปิดเผยเกี่ยวกับความเสี่ยง หลักสำคัญที่สุดคือดูเนื้อหาของสัญญา ไม่ดูชื่อ
## หนี้สินหรือส่วนของเจ้าของ
เป็นหนี้สินทางการเงินถ้ามีภาระผูกพันตามสัญญาที่จะส่งมอบเงินสดหรือสินทรัพย์ทางการเงินอื่น และกิจการหลีกเลี่ยงไม่ได้ ถ้าชำระด้วยหุ้นของตนเอง จะเป็นส่วนของเจ้าของเมื่อแลกจำนวนหุ้นคงที่กับจำนวนเงินคงที่ เรียกว่าเงื่อนไขคงที่ต่อคงที่
|เครื่องมือ|จัดเป็น|เหตุผล|
|หุ้นสามัญ|ส่วนของเจ้าของ|ไม่มีภาระต้องจ่ายคืน เงินปันผลขึ้นกับการประกาศ|
|หุ้นบุริมสิทธิที่ต้องไถ่ถอนในวันที่กำหนด|หนี้สิน|มีภาระต้องจ่ายคืน เงินปันผลจึงเป็นดอกเบี้ยจ่าย|
|หุ้นบุริมสิทธิที่ไม่ต้องไถ่ถอนและจ่ายปันผลตามดุลยพินิจ|ส่วนของเจ้าของ|หลีกเลี่ยงการจ่ายได้|
|สัญญาที่ต้องออกหุ้นมูลค่าเท่ากับ 1 ล้านบาท ตามราคาหุ้นวันชำระ|หนี้สิน|จำนวนหุ้นผันแปร ไม่ผ่านคงที่ต่อคงที่|
|ใบสำคัญแสดงสิทธิซื้อหุ้น 1 หุ้นในราคา 10 บาท|ส่วนของเจ้าของ|ผ่านคงที่ต่อคงที่|
> หุ้นบุริมสิทธิที่ต้องไถ่ถอนเหมือนเงินกู้ที่ใส่ชุดหุ้น ถึงชื่อจะเป็นหุ้น เนื้อหาคือเราต้องคืนเงินแน่นอน จึงเป็นหนี้สิน

## เครื่องมือทางการเงินแบบผสม
หุ้นกู้แปลงสภาพมีทั้งส่วนหนี้สิน คือภาระจ่ายดอกเบี้ยและเงินต้น และส่วนของเจ้าของ คือสิทธิแปลงเป็นหุ้นจำนวนคงที่ ต้องแยกตั้งแต่วันออก
- ส่วนหนี้สิน = มูลค่าปัจจุบันของกระแสเงินสดตามสัญญา คิดลดด้วยอัตราดอกเบี้ยตลาดของหุ้นกู้ที่คล้ายกันแต่ไม่มีสิทธิแปลง
- ส่วนของเจ้าของ = เงินที่ได้รับทั้งหมด − ส่วนหนี้สิน
- ต้นทุนการออก ปันส่วนตามสัดส่วนของสองส่วน
- ส่วนของเจ้าของไม่วัดมูลค่าใหม่ เมื่อแปลงสภาพ ไม่มีกำไรขาดทุน
> ออกหุ้นกู้แปลงสภาพ 3 ปี มูลค่า 10,000,000 บาท ดอกเบี้ย 4% ต่อปี อัตราตลาดของหุ้นกู้ทั่วไปที่ไม่มีสิทธิแปลงประมาณ 7.46%
|รายการ|บาท|
|เงินที่ได้รับ|10,000,000|
|หัก ส่วนหนี้สิน มูลค่าปัจจุบันของดอกเบี้ย 400,000 สามปีและเงินต้น|(9,100,000)|
|รวม ส่วนของเจ้าของ สิทธิแปลงสภาพ|900,000|
ปีแรกดอกเบี้ยจ่ายตามบัญชีประมาณ 9,100,000 × 7.46% = 678,860 บาท จ่ายจริง 400,000 บาท ส่วนต่าง 278,860 บาทเพิ่มยอดหนี้สิน หนี้สินจะค่อย ๆ เพิ่มจนเท่า 10,000,000 บาทเมื่อครบกำหนด
@fig fi32-split

## หุ้นทุนซื้อคืน
หุ้นที่กิจการซื้อคืนนำไปหักส่วนของเจ้าของ ห้ามแสดงเป็นสินทรัพย์ การซื้อ ขาย ออก หรือยกเลิกหุ้นทุนซื้อคืน ไม่มีกำไรหรือขาดทุนในกำไรขาดทุน ส่วนต่างอยู่ในส่วนของเจ้าของ
! ตาม ป.พ.พ. มาตรา 1143 บริษัทจำกัดห้ามเป็นเจ้าของหุ้นของตนเอง ส่วนบริษัทมหาชนจำกัดซื้อหุ้นคืนได้ในกรณีและเงื่อนไขที่ พ.ร.บ.บริษัทมหาชนจำกัดกำหนด เรื่องนี้เชื่อมกับวิชากฎหมาย 1

## ดอกเบี้ย เงินปันผล กำไรและขาดทุน
ไปตามการจัดประเภทของเครื่องมือ ถ้าเป็นหนี้สิน ดอกเบี้ยและเงินปันผลเข้ากำไรหรือขาดทุน ถ้าเป็นส่วนของเจ้าของ เงินปันผลจ่ายหักส่วนของเจ้าของโดยตรง ต้นทุนการออกตราสารทุนหักส่วนของเจ้าของ

## การหักกลบ
หักกลบสินทรัพย์ทางการเงินกับหนี้สินทางการเงินได้ เมื่อมีครบทั้ง 2 ข้อ คือ มีสิทธิตามกฎหมายที่บังคับได้อยู่ในปัจจุบัน และตั้งใจจะชำระด้วยยอดสุทธิหรือรับและจ่ายพร้อมกัน

## การเปิดเผยข้อมูลตาม TFRS 7
|ความเสี่ยง|เปิดเผยอะไร|
|ความเสี่ยงด้านเครดิต|ฐานะเปิดสูงสุด การวิเคราะห์ค่าเผื่อผลขาดทุนตามระดับ และการเปลี่ยนแปลงของค่าเผื่อ|
|ความเสี่ยงด้านสภาพคล่อง|การวิเคราะห์ระยะเวลาครบกำหนดของหนี้สินทางการเงิน|
|ความเสี่ยงด้านตลาด|การวิเคราะห์ความอ่อนไหวต่ออัตราดอกเบี้ย อัตราแลกเปลี่ยน และราคา|
นอกจากนี้ต้องเปิดเผยข้อมูลเชิงคุณภาพ คือที่มาของความเสี่ยงและวิธีบริหาร มูลค่ายุติธรรมตามลำดับชั้นของ TFRS 13 และข้อมูลการบัญชีป้องกันความเสี่ยง

## ออกสอบแบบไหน
- ข้อกาจำแนกหุ้นบุริมสิทธิว่าเป็นหนี้สินหรือส่วนของเจ้าของ
- คำนวณส่วนหนี้สินและส่วนของเจ้าของของหุ้นกู้แปลงสภาพ
- ถามการบันทึกหุ้นทุนซื้อคืน และเงื่อนไขการหักกลบ`,

sbp:`## ภาพรวม
TFRS 2 ใช้เมื่อกิจการได้สินค้าหรือบริการ แล้วจ่ายเป็นหุ้นของตนเอง หรือจ่ายเงินสดโดยจำนวนเงินอิงกับราคาหุ้น ตัวอย่างที่เห็นบ่อยที่สุดคือการให้สิทธิซื้อหุ้นแก่พนักงาน
|รูปแบบ|ตัวอย่าง|การวัดมูลค่า|ฝั่งเครดิต|
|ชำระด้วยตราสารทุน|ให้สิทธิซื้อหุ้นแก่พนักงาน|มูลค่ายุติธรรม ณ วันให้สิทธิ ไม่วัดใหม่|ส่วนของเจ้าของ|
|ชำระด้วยเงินสด|สิทธิรับเงินเท่ากับส่วนที่ราคาหุ้นเพิ่มขึ้น|วัดมูลค่าใหม่ทุกสิ้นงวดจนกว่าจะจ่าย|หนี้สิน|
## วันให้สิทธิและระยะเวลาก่อนได้รับสิทธิ
วันให้สิทธิคือวันที่ทั้งสองฝ่ายตกลงเงื่อนไขกัน ระยะเวลาก่อนได้รับสิทธิคือช่วงที่พนักงานต้องทำงานหรือทำตามเงื่อนไขก่อนจะได้สิทธิจริง ค่าใช้จ่ายต้องเกลี่ยตลอดช่วงนี้ เพราะเป็นค่าตอบแทนของงานในช่วงนั้น
### เงื่อนไขการได้รับสิทธิ
|เงื่อนไข|ตัวอย่าง|ผลต่อการวัด|
|เงื่อนไขการบริการ|ต้องทำงานครบ 4 ปี|ปรับจำนวนสิทธิที่คาดว่าจะได้รับทุกสิ้นงวด|
|เงื่อนไขผลงานที่ไม่ใช่ตลาด|ยอดขายต้องโตปีละ 10%|ปรับจำนวนสิทธิที่คาดว่าจะได้รับทุกสิ้นงวด|
|เงื่อนไขตลาด|ราคาหุ้นต้องเกิน 50 บาท|สะท้อนในมูลค่ายุติธรรม ณ วันให้สิทธิแล้ว ไม่ปรับจำนวนภายหลัง|

## ชำระด้วยตราสารทุน คำนวณแบบสะสม
ค่าใช้จ่ายสะสม ณ สิ้นปี = จำนวนสิทธิที่คาดว่าจะได้รับ × มูลค่ายุติธรรม ณ วันให้สิทธิ × สัดส่วนระยะเวลาที่ผ่านไป แล้วค่าใช้จ่ายของปี = ยอดสะสมปีนี้ − ยอดสะสมปีก่อน
> ให้พนักงาน 100 คน คนละ 1,000 สิทธิ มูลค่ายุติธรรม ณ วันให้สิทธิสิทธิละ 12 บาท ต้องทำงานครบ 4 ปี
|ปี|คาดว่าพนักงานจะอยู่ครบ|ยอดสะสม|ค่าใช้จ่ายของปี|
|1|90 คน (ออก 10%)|90 × 1,000 × 12 × 1/4 = 270,000|270,000|
|2|85 คน (ออก 15%)|85 × 1,000 × 12 × 2/4 = 510,000|240,000|
|3|88 คน (ออก 12%)|88 × 1,000 × 12 × 3/4 = 792,000|282,000|
|4|86 คน อยู่ครบจริง|86 × 1,000 × 12 = 1,032,000|240,000|
@fig sbp-cum
|รายการบัญชีปีที่ 1|เดบิต|เครดิต|
|ค่าใช้จ่ายผลประโยชน์พนักงาน|270,000||
|ส่วนเกินทุนจากการจ่ายโดยใช้หุ้นเป็นเกณฑ์||270,000|
- มูลค่ายุติธรรมของสิทธิ ไม่ต้องวัดใหม่ แม้ราคาหุ้นในตลาดจะเปลี่ยน
- ถ้าพนักงานได้สิทธิแล้วแต่ไม่ใช้สิทธิ ห้ามกลับรายการค่าใช้จ่าย แต่โอนภายในส่วนของเจ้าของได้
- ถ้ากิจการแก้ไขเงื่อนไขให้ดีขึ้น รับรู้มูลค่ายุติธรรมส่วนเพิ่มเป็นค่าใช้จ่ายเพิ่ม ถ้าแก้ให้แย่ลง ยังต้องรับรู้อย่างน้อยเท่าเดิม
- ถ้ายกเลิกก่อนครบกำหนด ให้รับรู้ค่าใช้จ่ายส่วนที่เหลือทั้งหมดทันที

## ชำระด้วยเงินสด
ตั้งหนี้สินและวัดด้วยมูลค่ายุติธรรมใหม่ทุกสิ้นงวด และวันชำระ ส่วนเปลี่ยนแปลงเข้ากำไรหรือขาดทุน
> ให้สิทธิรับเงินเท่าส่วนเพิ่มของราคาหุ้น แก่ผู้บริหาร 10 คน คนละ 1,000 สิทธิ ต้องทำงาน 2 ปี สิ้นปีที่ 1 มูลค่ายุติธรรมสิทธิละ 15 บาท หนี้สิน = 10 × 1,000 × 15 × 1/2 = 75,000 บาท สิ้นปีที่ 2 มูลค่า 18 บาท หนี้สิน = 10 × 1,000 × 18 = 180,000 บาท ค่าใช้จ่ายปีที่ 2 = 105,000 บาท

## ออกสอบแบบไหน
- ข้อกาคำนวณค่าใช้จ่ายปีที่ 2 หรือ 3 ด้วยวิธีสะสม
- ถามว่าเงื่อนไขตลาดกับเงื่อนไขการบริการปรับต่างกันอย่างไร
- ถามความต่างระหว่างแบบชำระด้วยตราสารทุนกับแบบชำระด้วยเงินสด
- จุดหลอก: แบบตราสารทุนใช้มูลค่า ณ วันให้สิทธิตลอด แบบเงินสดใช้มูลค่า ณ วันสิ้นงวด`

TFRS 5 ใช้เมื่อกิจการตั้งใจขายสินทรัพย์ไม่หมุนเวียน หรือกลุ่มสินทรัพย์ที่จะจำหน่าย แทนที่จะใช้ต่อ เมื่อจะได้เงินคืนจากการขายเป็นหลัก สินทรัพย์นั้นจึงไม่ควรคิดค่าเสื่อมอีก และต้องแสดงด้วยมูลค่าที่คาดว่าจะขายได้

- ภายหลัง ถ้ามูลค่ายุติธรรมหักต้นทุนในการขายลดลง รับรู้ผลขาดทุนจากการด้อยค่า ถ้าเพิ่มขึ้น รับรู้กำไรได้ไม่เกินผลขาดทุนสะสมที่เคยรับรู้ ทั้งตาม TFRS 5 และ TAS 36

|วันที่|มูลค่ายุติธรรมหักต้นทุนขาย|ราคาตามบัญชี|กำไรหรือขาดทุน|
|1 ก.ค. 2569|720,000|720,000|ขาดทุน 80,000|
|31 ธ.ค. 2569|700,000|700,000|ขาดทุน 20,000|

## กลุ่มสินทรัพย์ที่จะจำหน่าย
ถ้าขายเป็นกลุ่มพร้อมหนี้สิน เช่น ขายทั้งโรงงาน ให้วัดทั้งกลุ่มด้วยค่าต่ำกว่าเหมือนกัน ผลขาดทุนปันส่วนให้ค่าความนิยมก่อน แล้วปันส่วนให้สินทรัพย์ไม่หมุนเวียนในขอบเขตการวัดของ TFRS 5 ตามสัดส่วนราคาตามบัญชี สินทรัพย์ที่วัดตามมาตรฐานอื่น เช่น สินค้าคงเหลือ สินทรัพย์ทางการเงิน อสังหาริมทรัพย์เพื่อการลงทุนวิธีมูลค่ายุติธรรม ไม่รับผลขาดทุนนี้

## การนำเสนอ
- งบแสดงฐานะการเงิน: แสดงสินทรัพย์ถือไว้เพื่อขาย และหนี้สินของกลุ่มที่จะจำหน่าย แยกจากรายการอื่น ห้ามหักกลบกัน ไม่ปรับงบเปรียบเทียบ
- ถ้าเปลี่ยนแผนไม่ขายแล้ว วัดด้วยค่าต่ำกว่าระหว่าง ราคาตามบัญชีที่ควรเป็นถ้าไม่เคยจัดประเภท ซึ่งหักค่าเสื่อมที่ควรคิด กับมูลค่าที่คาดว่าจะได้รับคืน

## การดำเนินงานที่ยกเลิก
การดำเนินงานที่ยกเลิกคือส่วนของกิจการที่ขายไปแล้วหรือจัดเป็นถือไว้เพื่อขาย และเข้าข้อใดข้อหนึ่ง
- เป็นสายธุรกิจหลักหรือพื้นที่ภูมิศาสตร์หลักที่แยกต่างหาก
- เป็นส่วนหนึ่งของแผนเดียวที่จะขายสายธุรกิจหรือพื้นที่หลักนั้น
- เป็นบริษัทย่อยที่ซื้อมาเพื่อขายต่อโดยเฉพาะ
แสดงกำไรขาดทุนจากการดำเนินงานที่ยกเลิกเป็นยอดเดียวในงบกำไรขาดทุน รวมผลขาดทุนจากการวัดมูลค่าและกำไรขาดทุนจากการขาย และต้องปรับงบเปรียบเทียบใหม่ให้แสดงแบบเดียวกัน ต่างจากงบแสดงฐานะการเงินที่ไม่ปรับ

## ออกสอบแบบไหน
- ข้อกาถามเงื่อนไขการจัดประเภท และกรณีเลิกใช้ที่ไม่ใช่ถือไว้เพื่อขาย
- คำนวณผลขาดทุนวันจัดประเภทและกำไรที่รับรู้ได้สูงสุดภายหลัง
- ถามว่าการดำเนินงานที่ยกเลิกต้องปรับงบเปรียบเทียบหรือไม่ ซึ่งงบกำไรขาดทุนต้องปรับ งบแสดงฐานะการเงินไม่ต้องปรับ`,

grant:`## ภาพรวม
เงินอุดหนุนจากรัฐบาลคือความช่วยเหลือที่รัฐโอนทรัพยากรให้ เพื่อแลกกับการทำตามเงื่อนไขบางอย่าง หลักใหญ่คือรับรู้เป็นรายได้อย่างเป็นระบบ ให้สัมพันธ์กับค่าใช้จ่ายที่เงินอุดหนุนตั้งใจชดเชย ห้ามบันทึกเข้าส่วนของเจ้าของโดยตรง
## เงื่อนไขการรับรู้
รับรู้เมื่อมีความเชื่อมั่นอย่างสมเหตุสมผลว่า กิจการจะทำตามเงื่อนไข และจะได้รับเงินอุดหนุน การได้รับเงินแล้วไม่ใช่หลักฐานว่าทำตามเงื่อนไขแล้ว
## เงินอุดหนุนเกี่ยวกับสินทรัพย์
เลือกแสดงได้ 2 วิธี ผลต่อกำไรเท่ากัน
|วิธี|งบแสดงฐานะการเงิน|งบกำไรขาดทุน|
|รายได้รอการตัดบัญชี|สินทรัพย์เต็มราคา และรายได้รอการตัดบัญชี|ค่าเสื่อมเต็มจำนวน และรายได้จากเงินอุดหนุนตามอายุสินทรัพย์|
|หักจากราคาตามบัญชีของสินทรัพย์|สินทรัพย์สุทธิจากเงินอุดหนุน|ค่าเสื่อมที่ลดลง|
> ซื้อเครื่องจักร 2,000,000 บาท อายุ 5 ปี ไม่มีมูลค่าคงเหลือ ได้เงินอุดหนุน 500,000 บาท
|รายการต่อปี|รายได้รอการตัดบัญชี|หักจากราคาสินทรัพย์|
|ค่าเสื่อมราคา|400,000|300,000|
|รายได้จากเงินอุดหนุน|(100,000)|0|
|รวม ผลสุทธิต่อกำไร|300,000|300,000|
@fig grant-2way
## เงินอุดหนุนเกี่ยวกับรายได้
เช่น เงินชดเชยค่าจ้างพนักงาน แสดงเป็นรายได้อื่น หรือนำไปหักค่าใช้จ่ายที่เกี่ยวข้องก็ได้ ถ้าได้รับเพื่อชดเชยค่าใช้จ่ายหรือผลขาดทุนที่เกิดไปแล้ว หรือเป็นการช่วยเหลือทางการเงินทันทีโดยไม่มีต้นทุนในอนาคต ให้รับรู้เป็นรายได้ในงวดที่มีสิทธิได้รับ
## เงินอุดหนุนที่ไม่เป็นตัวเงิน
เช่น รัฐให้ที่ดิน บันทึกด้วยมูลค่ายุติธรรมทั้งสินทรัพย์และเงินอุดหนุน หรือบันทึกด้วยมูลค่าตามที่กำหนดไว้ก็ได้
## เงินกู้ดอกเบี้ยต่ำจากรัฐ
ประโยชน์จากดอกเบี้ยต่ำกว่าตลาด ถือเป็นเงินอุดหนุน วัดเป็นผลต่างระหว่างเงินที่ได้รับกับมูลค่ายุติธรรมของเงินกู้เมื่อเริ่มแรกตาม TFRS 9
> รัฐให้กู้ 1,000,000 บาท ไม่มีดอกเบี้ย คืนเมื่อครบ 2 ปี อัตราตลาด 5% มูลค่ายุติธรรมของเงินกู้ = 1,000,000 ÷ 1.05² = 907,029 บาท เงินอุดหนุน 92,971 บาท ทยอยรับรู้เป็นรายได้ตามค่าใช้จ่ายที่เงินนั้นชดเชย ส่วนเงินกู้ทยอยรับรู้ดอกเบี้ยจ่ายด้วยอัตรา 5%
## การจ่ายคืนเงินอุดหนุน
ถือเป็นการเปลี่ยนประมาณการ ให้ปรับไปข้างหน้า
- วิธีรายได้รอการตัดบัญชี: ใช้ยอดรายได้รอการตัดบัญชีคงเหลือรับภาระก่อน ส่วนที่เกินเป็นค่าใช้จ่ายทันที
- วิธีหักจากราคาสินทรัพย์: เพิ่มราคาตามบัญชีของสินทรัพย์ แล้วรับรู้ค่าเสื่อมสะสมส่วนที่ควรคิดเพิ่มเป็นค่าใช้จ่ายทันที
> ต่อจากตัวอย่างเครื่องจักร ผ่านไป 2 ปี ต้องคืนเงินทั้ง 500,000 บาท วิธีรายได้รอการตัดบัญชี ยอดคงเหลือ 300,000 บาท ใช้หักก่อน ส่วนที่เหลือ 200,000 บาทเป็นค่าใช้จ่ายทันที วิธีหักจากราคาสินทรัพย์ เพิ่มราคาสินทรัพย์ 500,000 บาท และรับรู้ค่าเสื่อมที่ขาดไป 2 ปี ปีละ 100,000 บาท รวม 200,000 บาทเป็นค่าใช้จ่ายทันที ผลเท่ากันทั้งสองวิธี
## SIC 10
ความช่วยเหลือจากรัฐที่ไม่ได้ผูกกับกิจกรรมดำเนินงานเฉพาะ แต่ให้กับกิจการที่อยู่ในพื้นที่หรืออุตสาหกรรมที่กำหนด ยังถือเป็นเงินอุดหนุนตาม TAS 20 และห้ามบันทึกเข้าส่วนของเจ้าของโดยตรง

## ออกสอบแบบไหน
- ข้อกาคำนวณรายได้จากเงินอุดหนุนต่อปีและราคาตามบัญชีของสินทรัพย์ตามแต่ละวิธี
- คำนวณผลของการจ่ายคืนเงินอุดหนุน
- ถามว่าเงินอุดหนุนบันทึกเข้าส่วนของเจ้าของได้หรือไม่ คำตอบคือไม่ได้`,

agri:`## ภาพรวม
TAS 41 ใช้กับกิจกรรมเกษตรกรรม คือการจัดการการเปลี่ยนแปลงทางชีวภาพของพืชหรือสัตว์ที่มีชีวิต เพื่อขาย เพื่อได้ผลผลิต หรือเพื่อได้สินทรัพย์ชีวภาพเพิ่ม หลักใหญ่คือวัดด้วยมูลค่ายุติธรรมหักต้นทุนในการขาย ทุกวันสิ้นงวด
|สิ่งที่ถือ|มาตรฐาน|ตัวอย่าง|
|สินทรัพย์ชีวภาพ|TAS 41|โคนม หมู ต้นข้าวในนา ต้นยาง|
|ผลิตผลทางการเกษตร ณ จุดเก็บเกี่ยว|TAS 41|น้ำนม น้ำยางสด ข้าวเปลือก|
|ผลิตภัณฑ์ที่ได้จากการแปรรูปหลังเก็บเกี่ยว|TAS 2|เนยแข็ง ยางแผ่น ข้าวสาร|
|พืชเพื่อการให้ผลิตผล|TAS 16|ต้นยาง ต้นปาล์มน้ำมัน ต้นชา|
@fig agri-life
! พืชเพื่อการให้ผลิตผล เช่น ต้นปาล์มน้ำมัน ใช้ TAS 16 แต่ผลปาล์มที่ยังอยู่บนต้นเป็นสินทรัพย์ชีวภาพตาม TAS 41

## การวัดมูลค่า
- สินทรัพย์ชีวภาพ: เมื่อเริ่มแรกและทุกวันสิ้นงวด วัดด้วยมูลค่ายุติธรรมหักต้นทุนในการขาย
- ผลิตผล ณ จุดเก็บเกี่ยว: วัดด้วยมูลค่ายุติธรรมหักต้นทุนในการขาย ยอดนี้กลายเป็นราคาทุนของสินค้าคงเหลือตาม TAS 2
- ต้นทุนในการขาย คือต้นทุนส่วนเพิ่มที่เกี่ยวกับการจำหน่ายโดยตรง เช่น ค่านายหน้า ค่าธรรมเนียม ไม่รวมค่าขนส่งไปตลาด ซึ่งหักไว้แล้วตอนหามูลค่ายุติธรรม
- ถ้าวัดมูลค่ายุติธรรมไม่ได้อย่างน่าเชื่อถือเมื่อเริ่มแรก ให้ใช้ราคาทุนหักค่าเสื่อมและการด้อยค่า จนกว่าจะวัดได้

## กำไรขาดทุน
กำไรหรือขาดทุนจากการรับรู้เมื่อเริ่มแรก และจากการเปลี่ยนแปลงมูลค่ายุติธรรมหักต้นทุนในการขาย รวมเข้ากำไรหรือขาดทุนของงวดนั้น ดังนั้นการที่ลูกวัวเกิดก็ทำให้เกิดกำไรได้ทันที
> ฟาร์มโคนม ต้นปีมีแม่โค 100 ตัว มูลค่ายุติธรรมหักต้นทุนขายตัวละ 30,000 บาท ระหว่างปีลูกโคเกิด 20 ตัว มูลค่าตัวละ 6,000 บาท ปลายปีแม่โคตัวละ 32,000 บาท และรีดนมได้มูลค่ายุติธรรมหักต้นทุนขาย 500,000 บาท
|รายการ|บาท|
|แม่โคต้นปี 100 × 30,000|3,000,000|
|กำไรจากการเปลี่ยนแปลงมูลค่าแม่โค 100 × 2,000|200,000|
|กำไรจากลูกโคเกิดใหม่ 20 × 6,000|120,000|
|รวม สินทรัพย์ชีวภาพปลายปี|3,320,000|
น้ำนม 500,000 บาท เป็นกำไรจากผลิตผลทางการเกษตรในงวด และเป็นราคาทุนของสินค้าคงเหลือ ถ้าเก็บไว้ทำเนยแข็งต่อ ต้นทุนแปรรูปบวกเพิ่มตาม TAS 2
## เงินอุดหนุนสำหรับสินทรัพย์ชีวภาพ
สินทรัพย์ชีวภาพที่วัดด้วยมูลค่ายุติธรรมหักต้นทุนขาย ถ้าเงินอุดหนุนไม่มีเงื่อนไข รับรู้เป็นรายได้เมื่อมีสิทธิได้รับ ถ้ามีเงื่อนไข รับรู้เมื่อทำตามเงื่อนไขครบ ถ้าวัดด้วยราคาทุน ให้ใช้ TAS 20

## ออกสอบแบบไหน
- ข้อกาจำแนกว่าสิ่งใดใช้ TAS 41 TAS 16 หรือ TAS 2
- คำนวณกำไรจากการเปลี่ยนแปลงมูลค่าสินทรัพย์ชีวภาพ
- ถามว่าค่าขนส่งไปตลาดเป็นต้นทุนในการขายหรือไม่ คำตอบคือไม่ ต้องหักตอนหามูลค่ายุติธรรม`,

fv:`## ภาพรวม
TFRS 13 ไม่ได้บอกว่าเมื่อไรต้องใช้มูลค่ายุติธรรม มาตรฐานอื่นเป็นคนบอก แต่ TFRS 13 บอกว่ามูลค่ายุติธรรมวัดอย่างไร และต้องเปิดเผยอะไร
## นิยาม

ใช้เมื่อสกุลเงินที่ใช้ในการดำเนินงานอยู่ในเศรษฐกิจที่เงินเฟ้อรุนแรง เช่น อัตราเงินเฟ้อสะสม 3 ปีใกล้หรือเกิน 100% และคนนิยมถือทรัพย์สินที่ไม่เป็นตัวเงินหรือเงินสกุลอื่น

## ระบบต้นทุนปกติ
ค่าใช้จ่ายการผลิตจริงรู้ตอนปลายงวด จึงใช้อัตราค่าใช้จ่ายการผลิตที่กำหนดไว้ล่วงหน้า = ค่าใช้จ่ายการผลิตประมาณการ ÷ ฐานกิจกรรมประมาณการ แล้วคิดเข้างานตามกิจกรรมจริง
> ประมาณการค่าใช้จ่ายการผลิต 500,000 บาท ชั่วโมงเครื่องจักร 10,000 ชั่วโมง อัตรา 50 บาทต่อชั่วโมง ใช้จริง 10,500 ชั่วโมง ค่าใช้จ่ายจริง 540,000 บาท คิดเข้างาน 10,500 × 50 = 525,000 บาท คิดเข้างานต่ำไป 15,000 บาท
ผลต่างที่คิดเข้างานต่ำไปหรือสูงไป ถ้าไม่มีสาระสำคัญ ปิดเข้าต้นทุนขาย ถ้ามีสาระสำคัญ ปันส่วนให้งานระหว่างทำ สินค้าสำเร็จรูป และต้นทุนขายตามสัดส่วน

## หน่วยเทียบสำเร็จรูป
ในระบบต้นทุนช่วงการผลิต งานที่ทำเสร็จบางส่วนต้องแปลงเป็นหน่วยเทียบสำเร็จรูปก่อน จึงหาต้นทุนต่อหน่วยได้
> งานระหว่างทำต้นงวด 1,000 หน่วย เสร็จด้านค่าแปลงสภาพ 40% เริ่มผลิต 9,000 หน่วย โอนออก 8,000 หน่วย งานระหว่างทำปลายงวด 2,000 หน่วย เสร็จด้านค่าแปลงสภาพ 60% วัตถุดิบใส่ตอนเริ่มผลิต
|รายการ|วิธีถัวเฉลี่ยถ่วงน้ำหนัก วัตถุดิบ|วิธีถัวเฉลี่ย ค่าแปลงสภาพ|วิธีเข้าก่อนออกก่อน วัตถุดิบ|วิธีเข้าก่อนออกก่อน ค่าแปลงสภาพ|
|โอนออก|8,000|8,000|8,000|8,000|
|หัก งานต้นงวดส่วนที่ทำไว้แล้ว|0|0|(1,000)|(400)|
|บวก งานระหว่างทำปลายงวด|2,000|1,200|2,000|1,200|
|รวม หน่วยเทียบสำเร็จรูป|10,000|9,200|9,000|8,800|
วิธีถัวเฉลี่ยรวมงานที่ทำในงวดก่อนด้วย วิธีเข้าก่อนออกก่อนนับเฉพาะงานที่ทำในงวดนี้ จึงหักส่วนที่งานต้นงวดทำไว้แล้ว
## ของเสีย
- ของเสียปกติ เป็นส่วนที่หลีกเลี่ยงไม่ได้ในการผลิต ให้รวมเป็นต้นทุนของหน่วยดี
- ของเสียเกินปกติ เป็นผลขาดทุนในงวดที่เกิด ห้ามรวมเป็นต้นทุนสินค้า สอดคล้องกับ TAS 2

## ออกสอบแบบไหน
- ข้อกาคำนวณต้นทุนผลิตเสร็จหรือต้นทุนขาย
- คำนวณค่าใช้จ่ายการผลิตที่คิดเข้างานต่ำไปหรือสูงไป
- คำนวณหน่วยเทียบสำเร็จรูปทั้งสองวิธี และต้นทุนต่อหน่วย
- ถามการบันทึกของเสียปกติและเกินปกติ`,

ระบบเดิมใช้ฐานเดียว เช่น ชั่วโมงแรงงาน ทำให้สินค้าที่ผลิตน้อยแต่ซับซ้อนได้ต้นทุนต่ำเกินจริง ระบบต้นทุนฐานกิจกรรมแยกค่าใช้จ่ายเป็นกิจกรรม แล้วใช้ตัวผลักดันต้นทุนของแต่ละกิจกรรม
> ค่าตั้งเครื่องจักร 200,000 บาท ตั้งเครื่องรวม 100 ครั้ง อัตรา 2,000 บาทต่อครั้ง สินค้า A ผลิตล็อตใหญ่ตั้งเครื่อง 10 ครั้ง ได้ 20,000 บาท สินค้า B ผลิตล็อตเล็กหลายล็อตตั้งเครื่อง 90 ครั้ง ได้ 180,000 บาท ถ้าใช้ชั่วโมงแรงงานซึ่ง A ใช้มากกว่า B จะได้ภาพกลับกัน

## ขายทันทีหรือผลิตต่อ
ตัดสินใจจากรายได้ส่วนเพิ่มเทียบกับต้นทุนส่วนเพิ่มหลังจุดแยกตัวเท่านั้น ต้นทุนร่วมเกิดไปแล้วและเท่ากันทั้งสองทางเลือก จึงไม่เกี่ยวกับการตัดสินใจ
> B ขาย ณ จุดแยกตัวได้ 600,000 บาท ผลิตต่อขายได้ 900,000 บาท รายได้ส่วนเพิ่ม 300,000 บาท ต้นทุนผลิตต่อ 150,000 บาท กำไรส่วนเพิ่ม 150,000 บาท ควรผลิตต่อ ไม่ว่าจะปันส่วนต้นทุนร่วมให้ B เท่าไรก็ตาม

- รับรู้เมื่อขาย: บันทึกเงินที่ขายได้เป็นรายได้อื่นหรือหักต้นทุนขาย

## ตีความผลต่าง
- ผลต่างราคาวัตถุดิบ เป็นความรับผิดชอบของฝ่ายจัดซื้อ แต่ถ้าซื้อของถูกคุณภาพต่ำ อาจทำให้ผลต่างปริมาณไม่น่าพอใจตามมา
- ผลต่างประสิทธิภาพค่าแรง เป็นความรับผิดชอบของฝ่ายผลิต อาจเกิดจากวัตถุดิบคุณภาพต่ำหรือเครื่องจักรเสีย
- ผลต่างปริมาณของค่าใช้จ่ายคงที่ ไม่ได้แปลว่าใช้เงินเกิน แต่บอกว่าใช้กำลังการผลิตต่ำกว่าที่วางแผน
- ปลายงวด ผลต่างที่ไม่มีสาระสำคัญปิดเข้าต้นทุนขาย

## ออกสอบแบบไหน
- ข้อกาคำนวณผลต่างทีละตัว และบอกว่าน่าพอใจหรือไม่
- จุดหลอก: ใช้ปริมาณมาตรฐานของผลผลิตจริง และผลต่างราคาวัตถุดิบคิดจากปริมาณซื้อหรือปริมาณใช้ ต้องอ่านโจทย์ให้ดี
- ข้อเขียนให้วิเคราะห์สาเหตุของผลต่างและผู้รับผิดชอบ`
});

## องค์ประกอบ
- ความสัมพันธ์ระหว่างสามฝ่าย: ผู้ปฏิบัติงาน ผู้รับผิดชอบข้อมูล และผู้ใช้
- ข้อมูลที่ตรวจ
- เกณฑ์ที่เหมาะสม
- หลักฐานที่เพียงพอและเหมาะสม
- รายงานเป็นลายลักษณ์อักษร

|ระดับความเชื่อมั่น|ตัวอย่าง|ถ้อยคำสรุป|
|อย่างสมเหตุสมผล|การตรวจสอบงบการเงิน|รูปแบบเชิงบวก|
|อย่างจำกัด|การสอบทานงบการเงิน|รูปแบบเชิงลบ|

> ตรวจงบเหมือนตรวจสุขภาพเต็มรูปแบบ สรุปได้ว่าปกติตามผลตรวจ ส่วนสอบทานเหมือนซักประวัติกับดูผลบางส่วน บอกได้ว่าไม่พบสิ่งผิดปกติ`},
{id:'tsa200',name:'วัตถุประสงค์โดยรวมและความเสี่ยงในการสอบบัญชี',ref:'TSA 200',body:`ผู้สอบบัญชีต้องได้ความเชื่อมั่นอย่างสมเหตุสมผลว่างบการเงินไม่แสดงข้อมูลขัดต่อข้อเท็จจริงอันเป็นสาระสำคัญ ไม่ว่าจากทุจริตหรือข้อผิดพลาด แล้วรายงานตามมาตรฐาน

ความเชื่อมั่นอย่างสมเหตุสมผลไม่ใช่ความแน่นอน เพราะงานสอบบัญชีมีข้อจำกัดในตัว

## ความเสี่ยงในการสอบบัญชี
|องค์ประกอบ|ความหมาย|ใครควบคุมได้|
|ความเสี่ยงสืบเนื่อง|โอกาสผิดพลาดโดยธรรมชาติของรายการ|ผู้สอบบัญชีควบคุมไม่ได้|
|ความเสี่ยงจากการควบคุม|ระบบควบคุมภายในจับไม่ได้|ผู้สอบบัญชีควบคุมไม่ได้|
|ความเสี่ยงจากการตรวจไม่พบ|วิธีตรวจของเราไม่พบ|ผู้สอบบัญชีปรับได้|

ถ้าความเสี่ยงจากการแสดงข้อมูลขัดต่อข้อเท็จจริงสูง ต้องกดความเสี่ยงจากการตรวจไม่พบให้ต่ำ คือเพิ่มงานตรวจเนื้อหาสาระ

## ลำดับความน่าเชื่อถือโดยทั่วไป
- จากภายนอกอิสระ สูงกว่าจากภายในกิจการ
- ได้จากการตรวจของผู้สอบบัญชีเอง สูงกว่าได้ทางอ้อม
- เป็นเอกสาร สูงกว่าคำพูด
- ต้นฉบับ สูงกว่าสำเนา
- ภายในกิจการที่มีการควบคุมดี สูงกว่าที่การควบคุมอ่อน

## สิ่งยืนยันของผู้บริหาร
ยอดคงเหลือ: การมีอยู่จริง สิทธิและภาระผูกพัน ความครบถ้วน ความถูกต้อง การตีราคา การปันส่วน การจัดประเภท การนำเสนอ

ประเภทรายการ: การเกิดขึ้นจริง ความครบถ้วน ความถูกต้อง การตัดยอด การจัดประเภท การนำเสนอ

{id:'ext',name:'การขอคำยืนยัน ยอดยกมา และการวิเคราะห์เปรียบเทียบ',ref:'TSA 501, 505, 510, 520',body:`## การขอคำยืนยันจากบุคคลภายนอก
- แบบตอบรับ: ขอให้ตอบทุกกรณี
- แบบปฏิเสธ: ตอบเฉพาะเมื่อไม่ตรง ใช้เป็นวิธีหลักได้เมื่อความเสี่ยงต่ำ ประชากรเป็นรายการย่อยจำนวนมาก คาดว่าข้อยกเว้นน้อย และไม่มีเหตุว่าผู้รับจะละเลย
- ผู้สอบบัญชีต้องควบคุมการส่งและรับเอง
- ผู้บริหารไม่ยอมให้ส่ง ต้องถามเหตุผล ประเมินความสมเหตุสมผล และใช้วิธีทางเลือก ถ้าไม่สมเหตุสมผลให้แจ้งผู้มีหน้าที่กำกับดูแล และพิจารณาผลต่อรายงาน
- ไม่ได้รับตอบ ใช้วิธีทางเลือก เช่น ตรวจเงินรับหลังวันสิ้นงวด

## การตรวจนับสินค้า TSA 501
เข้าสังเกตการณ์ ถ้าไม่สามารถไปในวันตรวจนับ ต้องตรวจนับในวันอื่นและตรวจรายการระหว่างวัน ถ้าทำไม่ได้เลยต้องใช้วิธีทางเลือก ถ้าไม่ได้หลักฐานจึงพิจารณาเปลี่ยนแปลงความเห็น

## ยอดยกมา TSA 510
ตรวจว่ายอดยกมาถูกนำมาตั้งถูกต้อง นโยบายสม่ำเสมอ และอ่านรายงานผู้สอบบัญชีคนก่อน

## การวิเคราะห์เปรียบเทียบ TSA 520
ใช้ได้ทั้งการตรวจเนื้อหาสาระ และต้องทำใกล้สิ้นสุดงานเพื่อดูภาพรวม`},

|ความเสี่ยงจากการเลือกตัวอย่าง|ข้อสรุปจากตัวอย่างต่างจากการตรวจทั้งหมด|
|ความเสี่ยงที่ไม่ได้เกิดจากการเลือกตัวอย่าง|ใช้วิธีตรวจผิด หรือแปลผลผิด|
|ข้อผิดพลาดที่ยอมรับได้|ยอดสูงสุดที่ยังรับได้ในประชากร|

## ขนาดตัวอย่าง
ขนาดเพิ่มเมื่อ ความเสี่ยงสูงขึ้น ข้อผิดพลาดที่ยอมรับได้ลดลง หรือข้อผิดพลาดที่คาดไว้เพิ่มขึ้น

## การเลือก
สุ่มแบบตารางเลขสุ่ม เป็นระบบ น้ำหนักตามมูลค่า (MUS) ไม่มีแบบแผน และเลือกเป็นกลุ่ม

## บุคคลหรือกิจการที่เกี่ยวข้องกัน TSA 550

["subst","การตรวจบัญชีซ่อมแซมเพื่อหารายจ่ายที่ควรตั้งเป็นสินทรัพย์ เป็นการตรวจสิ่งใด",["การจัดประเภทระหว่างค่าใช้จ่ายกับสินทรัพย์","การมีอยู่จริงของเงินสดที่จ่ายค่าซ่อมแซม","สิทธิและภาระผูกพันในลูกหนี้ของกิจการ","ความครบถ้วนของรายได้จากการขายสินทรัพย์"],0,"รายจ่ายทุนกับรายจ่ายดำเนินงานเป็นจุดเสี่ยงของ PPE"],

["it","ข้อใดเป็นการควบคุมทั่วไปของเทคโนโลยีสารสนเทศ",["การกำหนดสิทธิผู้ใช้และการอนุมัติเปลี่ยนแปลงโปรแกรม","การจับคู่ใบสั่งซื้อ ใบรับของ และใบแจ้งหนี้โดยระบบ","การตรวจรูปแบบเลขที่ลูกค้าเมื่อป้อนข้อมูล","การคำนวณส่วนลดการค้าอัตโนมัติตามเงื่อนไขของลูกค้าแต่ละราย"],0,"การควบคุมทั่วไปครอบคลุมสภาพแวดล้อมทั้งระบบ ส่วนตัวเลือกอื่นเป็นการควบคุมระบบงาน"],
["it","ระบบไม่ยอมบันทึกใบแจ้งหนี้ถ้าเลขที่ซ้ำ เป็นการควบคุมแบบใด",["การควบคุมระบบงาน","การควบคุมทั่วไป","การควบคุมทางกายภาพ","การควบคุมระดับหน่วยงาน"],0,"เป็นการตรวจสอบข้อมูลภายในโปรแกรมของระบบงานนั้น"],
["it","การนำข้อมูลสมมติเข้าโปรแกรมของกิจการแล้วเทียบผลที่คาดไว้ เรียกว่าอะไร",["ข้อมูลทดสอบ","การจำลองแบบคู่ขนาน","การดึงข้อมูลด้วยซอฟต์แวร์ตรวจสอบ","การกระทบยอด"],0,"ข้อมูลทดสอบใช้ตรวจตรรกะของโปรแกรมของกิจการ"],
["it","การนำข้อมูลจริงมาประมวลผลด้วยโปรแกรมของผู้สอบบัญชีแล้วเทียบกับผลของกิจการ เรียกว่าอะไร",["การจำลองแบบคู่ขนาน","ข้อมูลทดสอบ","สิ่งอำนวยการทดสอบแบบบูรณาการ","การสังเกตการณ์"],0,"การจำลองแบบคู่ขนานใช้โปรแกรมของผู้สอบบัญชีทำงานเทียบกับระบบจริง"],
