<style>
/* Layout concept: one dictionary-style index card in the middle of the screen; deck chips above, two answer buttons below. */
:root{
  --bg:#e8eef0; --card:#ffffff; --card-back:#f3f8f8; --ink:#152129; --muted:#5a6b73; --line:#c7d3d8;
  --accent:#0d6275; --accent-ink:#ffffff; --accent-soft:#d6eaee;
  --good:#17744a; --good-soft:#dcf1e6; --again:#a24b1e; --again-soft:#f8e4d8;
  --n:#2f5fa8; --v:#1f7a54; --adj:#9a6200; --adv:#7a3f9a;
  --head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --card:#1b2830; --card-back:#1f3038; --ink:#e4ecef; --muted:#9db0ba; --line:#33454f;
  --accent:#4fb3c9; --accent-ink:#06222a; --accent-soft:#17404c;
  --good:#5fcf9b; --good-soft:#163a2a; --again:#f0a274; --again-soft:#43281a;
  --n:#8db4f0; --v:#70d0a5; --adj:#e9b45a; --adv:#cfa0ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --card:#1b2830; --card-back:#1f3038; --ink:#e4ecef; --muted:#9db0ba; --line:#33454f;
  --accent:#4fb3c9; --accent-ink:#06222a; --accent-soft:#17404c;
  --good:#5fcf9b; --good-soft:#163a2a; --again:#f0a274; --again-soft:#43281a;
  --n:#8db4f0; --v:#70d0a5; --adj:#e9b45a; --adv:#cfa0ea; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:600 24px/1.2 var(--head);letter-spacing:-.01em}
.stats{font:500 14px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;min-height:36px;white-space:nowrap}
.chip b{font:500 12px/1 var(--mono);color:var(--muted);margin-left:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;gap:7px;align-items:center;min-height:36px;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.stage{perspective:1400px;flex:1;display:flex;min-height:300px}
.card{position:relative;flex:1;min-height:300px;border:0;padding:0;background:none;text-align:left;transform-style:preserve-3d;transition:transform .38s ease}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 10px 28px rgba(10,30,40,.08);display:flex;flex-direction:column;padding:22px 24px;gap:12px;overflow:auto}
.back{transform:rotateY(180deg);background:var(--card-back)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.tag{font:500 12.5px/1 var(--mono);padding:4px 8px;border-radius:4px;border:1px solid currentColor}
.tag.n{color:var(--n)} .tag.v{color:var(--v)} .tag.adj{color:var(--adj)} .tag.adv{color:var(--adv)} .tag.x{color:var(--muted)}
.rank{font:500 12.5px/1 var(--mono)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.word{font:600 clamp(30px,7vw,48px)/1.15 var(--head);overflow-wrap:anywhere;text-wrap:balance}
.word.long{font-size:clamp(22px,5vw,30px)}
.word.th{font-family:var(--sans);font-weight:600}
.q{font:600 20px/1.3 var(--head);color:var(--muted);overflow-wrap:anywhere}
.q.th{font-family:var(--sans)}
.mean{font:600 clamp(22px,5vw,30px)/1.35 var(--sans);overflow-wrap:anywhere}
.mean.en{font-family:var(--head)}
.ex{font-size:16px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px}
.note{font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);text-align:center}
.say{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13.5px;min-height:32px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:8px;border:1px solid var(--line);background:var(--card);min-height:52px;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.btn small{font:500 11.5px/1 var(--mono);opacity:.7;margin-top:4px}
.btn.again{background:var(--again-soft);border-color:var(--again);color:var(--again)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.flipbtn{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:28px}
.done h2{margin:0;font:600 24px/1.3 var(--head)}
.done p{margin:0;color:var(--muted);max-width:44ch}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.done .btn{padding:0 18px;min-height:46px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
@media (max-width:480px){.face{padding:18px}.stage,.card{min-height:340px}}
.homel{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}.homel:hover{text-decoration:underline}</style>

    <label for="rev"><input type="checkbox" id="rev"> โชว์ภาษาไทยก่อน</label>

    <button class="link" id="reset">เริ่มหมวดนี้ใหม่</button>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div class="stage" id="stage"></div>
  <div class="ctl" id="ctl"></div>
  <p class="foot">แตะการ์ดหรือกด Space เพื่อพลิก · กด ← เมื่อยังจำไม่ได้ · กด → เมื่อจำได้แล้ว</p>
</div>

rge."},{"f":"meet a deadline","s":"วลี","b":"ทำทันกำหนด","x":"We worked late to meet the deadline."},{"f":"reach an agreement","s":"วลี","b":"ตกลงกันได้ (reach a decision = ตัดสินใจได้)","x":"The two firms reached an agreement."},{"f":"pay attention to","s":"วลี","b":"ใส่ใจ ตั้งใจฟัง","x":"Pay attention to the safety signs."},{"f":"prior to","s":"วลี","b":"ก่อน (ทางการ)","x":"Arrive 30 minutes prior to departure."},{"f":"regardless of","s":"วลี","b":"ไม่ว่าจะ","x":"Everyone pays the same, regardless of age."},{"f":"in addition to","s":"วลี","b":"นอกเหนือจาก (+ คำนาม หรือ V-ing)","x":"In addition to coffee, we serve tea."},{"f":"be eligible for","s":"วลี","b":"มีสิทธิ์ได้รับ","x":"You are eligible for a discount."},{"f":"be familiar with","s":"วลี","b":"คุ้นเคยกับ","x":"Are you familiar with this software?"}]},{"id":"conf","name":"คำสับสน","cards":[{"f":"adopt / adapt","s":"คู่คำ","b":"adopt = นำมาใช้ · adapt = ปรับให้เหมาะ","x":"We adopted a new system and adapted it to our needs."},{"f":"affect / effect","s":"คู่คำ","b":"affect = กริยา ส่งผลต่อ · effect = คำนาม ผล","x":"The rain affected sales. The rule takes effect today."},{"f":"considerable / considerate","s":"คู่คำ","b":"considerable = มาก · considerate = เอาใจใส่คนอื่น","x":"It took considerable time. He is very considerate."},{"f":"economic / economical","s":"คู่คำ","b":"economic = เกี่ยวกับเศรษฐกิจ · economical = ประหยัด","x":"economic growth / an economical car"},{"f":"personal / personnel","s":"คู่คำ","b":"personal = ส่วนตัว · personnel = บุคลากร","x":"personal items / authorized personnel only"},{"f":"stationary / stationery","s":"คู่คำ","b":"stationary = อยู่กับที่ · stationery = เครื่องเขียน","x":"a stationary bike / a stationery store"},{"f":"complement / compliment","s":"คู่คำ","b":"complement = เสริมกัน · compliment = คำชม (complimentary = ฟรี)","x":"The wine complements the meal. Thanks for the compliment."},{"f":"rise / raise","s":"คู่คำ","b":"rise = เพิ่มขึ้นเอง ไม่มีกรรม · raise = ทำให้สูงขึ้น มีกรรม","x":"Prices rose. They raised prices."},{"f":"lend / borrow","s":"คู่คำ","b":"lend = ให้ยืม · borrow = ขอยืม","x":"Can you lend me a pen? Can I borrow your pen?"},{"f":"ensure / assure / insure","s":"คู่คำ","b":"ensure = ทำให้แน่ใจ · assure = ยืนยันกับคน · insure = ทำประกัน","x":"I assure you we will ensure quality."},{"f":"principal / principle","s":"คู่คำ","b":"principal = หลัก สำคัญสุด · principle = หลักการ","x":"the principal reason / accounting principles"},{"f":"access / assess","s":"คู่คำ","b":"access = เข้าถึง · assess = ประเมิน","x":"access the files / assess the damage"},{"f":"expand / extend","s":"คู่คำ","b":"expand = ขยายขนาด · extend = ขยายเวลาหรือความยาว","x":"expand the store / extend the deadline"},{"f":"remind / remember","s":"คู่คำ","b":"remind = เตือนคนอื่น · remember = จำได้เอง","x":"Remind me to call her. I remember her name."},{"f":"advice / advise","s":"คู่คำ","b":"advice = คำนาม นับไม่ได้ · advise = กริยา","x":"She gave me advice. She advised me to wait."},{"f":"thorough / through","s":"คู่คำ","b":"thorough = ละเอียดถี่ถ้วน · through = ผ่าน","x":"a thorough check / walk through the park"},{"f":"quite / quiet","s":"คู่คำ","b":"quite = ค่อนข้าง · quiet = เงียบ","x":"It's quite late. The library is quiet."},{"f":"later / latter","s":"คู่คำ","b":"later = ทีหลัง · latter = อย่างหลัง (จาก 2 อย่าง)","x":"Call me later. I prefer the latter option."},{"f":"successful / successive","s":"คู่คำ","b":"successful = ประสบความสำเร็จ · successive = ติดต่อกัน","x":"a successful launch / three successive wins"},{"f":"respective / respectable","s":"คู่คำ","b":"respective = ของแต่ละคน · respectable = น่านับถือ","x":"They returned to their respective offices."},{"f":"sensible / sensitive","s":"คู่คำ","b":"sensible = มีเหตุผล · sensitive = อ่อนไหว","x":"a sensible plan / sensitive information"},{"f":"beside / besides","s":"คู่คำ","b":"beside = ข้าง ๆ · besides = นอกจาก","x":"Sit beside me. Besides tea, we have juice."},{"f":"despite / although","s":"คู่คำ","b":"despite + คำนาม · although + ประโยค (ความหมายเหมือนกัน)","x":"despite the rain / although it rained"},{"f":"during / while","s":"คู่คำ","b":"during + คำนาม · while + ประโยคหรือ V-ing","x":"during the meeting / while I was waiting"},{"f":"by / until","s":"คู่คำ","b":"by = ภายใน (ทำให้เสร็จก่อน) · until = จนถึง (ทำต่อเนื่อง)","x":"Submit it by Friday. The store is open until nine."},{"f":"for / since","s":"คู่คำ","b":"for + ระยะเวลา · since + จุดเริ่มต้น","x":"for ten years / since 2016"}]},{"id":"para","name":"Paraphrase","cards":[{"f":"on back order","s":"ได้ยินหรืออ่าน","b":"temporarily out of stock","n":"สินค้าหมดชั่วคราว"},{"f":"I'll take care of the delivery charge","s":"ได้ยินหรืออ่าน","b":"waive a fee","n":"ไม่คิดค่าธรรมเนียม"},{"f":"paid back","s":"ได้ยินหรืออ่าน","b":"reimbursed","n":"ได้เงินคืน"},{"f":"at no cost / free of charge","s":"ได้ยินหรืออ่าน","b":"complimentary","n":"ฟรี"},{"f":"projector, printer, laptop","s":"ได้ยินหรืออ่าน","b":"equipment","n":"อุปกรณ์"},{"f":"helmets and vests","s":"ได้ยินหรืออ่าน","b":"protective gear","n":"อุปกรณ์ป้องกัน"},{"f":"fruit and vegetables","s":"ได้ยินหรืออ่าน","b":"produce","n":"ผักผลไม้สด"},{"f":"car, van, truck","s":"ได้ยินหรืออ่าน","b":"vehicle","n":"ยานพาหนะ"},{"f":"driver's license, passport","s":"ได้ยินหรืออ่าน","b":"identification","n":"บัตรแสดงตัว"},{"f":"running a little warm","s":"ได้ยินหรืออ่าน","b":"not cold enough","n":"เย็นไม่พอ"},{"f":"I'm stuck at work","s":"ได้ยินหรืออ่าน","b":"has to stay at work","n":"ติดงาน"},{"f":"transferred overseas","s":"ได้ยินหรืออ่าน","b":"move abroad","n":"ย้ายไปต่างประเทศ"},{"f":"give me a call back","s":"ได้ยินหรืออ่าน","b":"return a call","n":"โทรกลับ"},{"f":"get in touch with","s":"ได้ยินหรืออ่าน","b":"contact","n":"ติดต่อ"},{"f":"put off / push back","s":"ได้ยินหรืออ่าน","b":"postpone / delay","n":"เลื่อนออกไป"},{"f":"go over the slides","s":"ได้ยินหรืออ่าน","b":"review a presentation","n":"ตรวจทาน"},{"f":"hand out","s":"ได้ยินหรืออ่าน","b":"distribute","n":"แจกจ่าย"},{"f":"can't make it","s":"ได้ยินหรืออ่าน","b":"unable to attend","n":"ไปไม่ได้"},{"f":"fully booked","s":"ได้ยินหรืออ่าน","b":"no rooms available","n":"ห้องเต็ม"},{"f":"short of staff","s":"ได้ยินหรืออ่าน","b":"not enough employees","n":"คนไม่พอ"},{"f":"merge with","s":"ได้ยินหรืออ่าน","b":"combine / join","n":"รวมกิจการ"},{"f":"a quote","s":"ได้ยินหรืออ่าน","b":"cost information / price estimate","n":"ข้อมูลราคา"},{"f":"résumé and references","s":"ได้ยินหรืออ่าน","b":"application materials","n":"เอกสารสมัครงาน"},{"f":"moving to a new office","s":"ได้ยินหรืออ่าน","b":"relocating","n":"ย้ายสถานที่"},{"f":"sold out","s":"ได้ยินหรืออ่าน","b":"no tickets left","n":"บัตรหมด"},{"f":"spent a fortune","s":"ได้ยินหรืออ่าน","b":"expensive","n":"แพงมาก"},{"f":"cutting it close","s":"ได้ยินหรืออ่าน","b":"may not have enough time","n":"เวลาเฉียดฉิว"},{"f":"a great turnout","s":"ได้ยินหรืออ่าน","b":"many people attended","n":"คนมาเยอะ"},{"f":"TV or radio commercial","s":"ได้ยินหรืออ่าน","b":"advertisement","n":"โฆษณา"},{"f":"20 percent off","s":"ได้ยินหรืออ่าน","b":"reduced price / discount","n":"ลดราคา"},{"f":"sales went up","s":"ได้ยินหรืออ่าน","b":"revenue increased","n":"ยอดขายเพิ่ม"},{"f":"the local paper","s":"ได้ยินหรืออ่าน","b":"a newspaper / publication","n":"หนังสือพิมพ์"}]}];
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DECKS.forEach(d=>d.cards.forEach((c,i)=>c.key=d.id+':'+c.f));
const ALL={id:'all',name:'ทั้งหมด',cards:DECKS.flatMap(d=>d.cards.map(c=>Object.assign({deck:d.name},c)))};
let known=new Set(store.get('fc.known',[]));
let deckId=store.get('fc.deck','top');
let rev=store.get('fc.rev',false), shuf=store.get('fc.shuf',true);
let queue=[],flipped=false,cur=null;
const voice=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
const deck=()=>deckId==='all'?ALL:(DECKS.find(d=>d.id===deckId)||DECKS[0]);
const isEn=s=>/[A-Za-z]/.test(s)&&!/[฀-๿]/.test(s);
function posClass(s){s=(s||'').toLowerCase();if(s.startsWith('n.'))return 'n';if(s.startsWith('v.'))return 'v';if(s.startsWith('adj'))return 'adj';if(s.startsWith('adv'))return 'adv';return 'x'}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){queue=deck().cards.filter(c=>!known.has(c.key));if(shuf)shuffle(queue);next()}
function chips(){
  const list=[ALL,...DECKS];
  $('#chips').innerHTML=list.map(d=>`<button class="chip" data-d="${d.id}" aria-pressed="${d.id===deckId}">${esc(d.name)}<b>${d.cards.length}</b></button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{deckId=b.dataset.d;store.set('fc.deck',deckId);chips();build()});
  const on=$('#chips .chip[aria-pressed="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
}
function stats(){
  const cards=deck().cards,k=cards.filter(c=>known.has(c.key)).length;
  $('#stats').textContent=`จำได้ ${k}/${cards.length} · เหลือรอบนี้ ${queue.length+(cur?1:0)}`;
  $('#prog').style.width=(cards.length?k/cards.length*100:0)+'%';
}
function next(){cur=queue.shift()||null;flipped=false;render()}
function render(){
  stats();
  const st=$('#stage'),ctl=$('#ctl');
  if(!cur){
    const total=deck().cards.length,k=deck().cards.filter(c=>known.has(c.key)).length;
    st.innerHTML=`<div class="done"><h2>${k===total?'จำได้ครบทุกคำในหมวดนี้แล้ว':'จบรอบนี้แล้ว'}</h2><p>${k===total?'ลองหมวดอื่นต่อ หรือเริ่มหมวดนี้ใหม่เพื่อทวนอีกรอบ':'การ์ดที่ยังจำไม่ได้จะวนกลับมาจนกว่าจะกด "จำได้แล้ว"'}</p><div class="row"><button class="btn good" id="again2">ทวนหมวดนี้ใหม่ทั้งหมด</button></div></div>`;
    ctl.innerHTML='';$('#again2').onclick=resetDeck;return;
  }
  const c=cur,front=rev?c.b:c.f,back=rev?c.f:c.b,pc=posClass(c.s);
  const tag=c.s?`<span class="tag ${pc}">${esc(c.s)}</span>`:'<span></span>';
  const side=deckId==='all'&&c.deck?`<span>${esc(c.deck)}</span>`:(c.n&&c.n.startsWith('อันดับ')?`<span class="rank">${esc(c.n)}</span>`:'<span></span>');
  const wcls=(t)=>'word'+(t.length>28?' long':'')+(isEn(t)?'':' th');
  const sayBtn=en=>voice&&isEn(en)?`<span class="say" role="button" tabindex="0" data-say="${esc(en)}">ฟังเสียง</span>`:'';
  st.innerHTML=`<button class="card${flipped?' flip':''}" id="card" aria-label="พลิกการ์ด">
    <div class="face front"><div class="meta">${tag}${side}</div><div class="mid"><div class="${wcls(front)}">${esc(front)}</div>${!rev?sayBtn(c.f):''}</div><div class="hint">แตะเพื่อดูคำตอบ</div></div>
    <div class="face back"><div class="meta">${tag}${side}</div><div class="mid">
      <div class="q${isEn(front)?'':' th'}">${esc(front)}</div>
      <div class="mean${isEn(back)?' en':''}">${esc(back)}</div>
      ${c.x?`<div class="ex">${esc(c.x)}</div>`:''}
      ${c.n&&!c.n.startsWith('อันดับ')?`<div class="note">${esc(c.n)}</div>`:''}
      ${sayBtn(c.f)}</div></div></button>`;
  $('#card').onclick=e=>{const s=e.target.closest('[data-say]');if(s){e.stopPropagation();speak(s.dataset.say);return}flip()};
  st.querySelectorAll('[data-say]').forEach(s=>s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();speak(s.dataset.say)}});
  ctl.innerHTML=flipped?`<button class="btn again" id="bad">ยังจำไม่ได้<small>←</small></button><button class="btn good" id="ok">จำได้แล้ว<small>→</small></button>`:`<button class="btn flipbtn" id="fl">ดูคำตอบ<small>SPACE</small></button>`;
  if(flipped){$('#bad').onclick=again;$('#ok').onclick=good}else $('#fl').onclick=flip;
}
function flip(){if(!cur)return;flipped=!flipped;$('#card').classList.toggle('flip',flipped);
  const ctl=$('#ctl');ctl.innerHTML=flipped?`<button class="btn again" id="bad">ยังจำไม่ได้<small>←</small></button><button class="btn good" id="ok">จำได้แล้ว<small>→</small></button>`:`<button class="btn flipbtn" id="fl">ดูคำตอบ<small>SPACE</small></button>`;
  if(flipped){$('#bad').onclick=again;$('#ok').onclick=good}else $('#fl').onclick=flip}
function again(){if(!cur)return;const pos=Math.min(queue.length,3+Math.floor(Math.random()*4));queue.splice(pos,0,cur);next()}
function good(){if(!cur)return;known.add(cur.key);store.set('fc.known',[...known]);next()}
function resetDeck(){deck().cards.forEach(c=>known.delete(c.key));store.set('fc.known',[...known]);build()}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\s\/\s/g,', '));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
$('#rev').checked=rev;$('#shuf').checked=shuf;
$('#rev').onchange=e=>{rev=e.target.checked;store.set('fc.rev',rev);flipped=false;render()};
$('#shuf').onchange=e=>{shuf=e.target.checked;store.set('fc.shuf',shuf);build()};
$('#reset').onclick=resetDeck;
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,.chip,.link'))return;
  if(e.key===' '||e.key==='Enter'){if(e.target.closest&&e.target.closest('button,[role=button]'))return;e.preventDefault();flip()}
  else if(e.key==='ArrowRight'&&flipped)good();
  else if(e.key==='ArrowLeft'&&flipped)again();
});
chips();build();
</script>
