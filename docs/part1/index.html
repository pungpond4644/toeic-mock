<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TOEIC Part 1 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Same workstation look as the mock exam room: dark status bar, one work area, quiet panels. */
:root{
  --bg:#e9edef; --panel:#fff; --sheet:#fbfcfc; --ink:#17232b; --muted:#566670; --line:#c9d2d7;
  --bar:#14303b; --bar-ink:#eaf2f4; --bar-muted:#a5bcc5;
  --accent:#0d6275; --accent-ink:#fff; --accent-soft:#d9ebef;
  --flag:#9a6200; --flag-soft:#fbeed3; --ok:#17744a; --ok-soft:#dcf1e6; --bad:#b0342c; --bad-soft:#f9e1de;
  --mark:#fff0b8; --photo:#0b1418;
  --sans:"IBM Plex Sans","IBM Plex Sans Thai",Tahoma,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10191e; --panel:#1a262d; --sheet:#1f2d35; --ink:#e4ecef; --muted:#9db0ba; --line:#33454f;
  --bar:#0a1216; --bar-ink:#e4ecef; --bar-muted:#8ea5af;
  --accent:#4fb3c9; --accent-ink:#06222a; --accent-soft:#17404c;
  --flag:#e9b45a; --flag-soft:#3f3013; --ok:#5fcf9b; --ok-soft:#163a2a; --bad:#f28f86; --bad-soft:#47201d;
  --mark:#4a3f12; --photo:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10191e; --panel:#1a262d; --sheet:#1f2d35; --ink:#e4ecef; --muted:#9db0ba; --line:#33454f;
  --bar:#0a1216; --bar-ink:#e4ecef; --bar-muted:#8ea5af;
  --accent:#4fb3c9; --accent-ink:#06222a; --accent-soft:#17404c;
  --flag:#e9b45a; --flag-soft:#3f3013; --ok:#5fcf9b; --ok-soft:#163a2a; --bad:#f28f86; --bad-soft:#47201d;
  --mark:#4a3f12; --photo:#000; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* status bar */
.bar{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:5}
.bar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:6px 14px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.bar a,.bar button.lk{color:var(--bar-ink);text-decoration:none;font-weight:500;background:none;border:0;padding:6px 2px}
.bar a:hover{text-decoration:underline}
.bar .ttl{font-weight:600}
.bar .sp{flex:1}
.bar .meta{color:var(--bar-muted);font-size:14px;font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:8px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;fill:currentColor;flex:none}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* home */
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:34px;padding-block:30px 56px}
.hero{display:grid;gap:10px}
.hero h1{font-size:clamp(27px,5vw,40px);font-weight:700;letter-spacing:-.01em}
.hero p{max-width:64ch;color:var(--muted)}
.tag{justify-self:start;font-size:13px;font-weight:600;color:var(--flag);background:var(--flag-soft);padding:2px 9px;border-radius:3px}
.sec{display:grid;gap:14px}
.sec>h2{font-size:20px}
.sec>p{color:var(--muted);max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-size:18px}
.card .meta{color:var(--muted);font-size:14px}
.card.lead{border-color:var(--accent);background:var(--accent-soft)}
.stat{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat div{display:grid}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--muted);font-size:14px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.set{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink);display:grid;gap:2px}
.set:hover{border-color:var(--accent)}
.set b{font-size:17px}
.set span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set.done span.sc{color:var(--ok);font-weight:600}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.trap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink);display:grid;gap:4px}
.trap:hover{border-color:var(--accent)}
.trap b{font-size:16px}
.trap span{font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.grid100{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid100 a{display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-decoration:none;color:var(--ink);font:600 14px var(--mono)}
.grid100 a.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid100 a.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend .ok i{background:var(--ok-soft);border-color:var(--ok)}
.legend .bad i{background:var(--bad-soft);border-color:var(--bad)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:6px}

/* practice */
.pq{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;padding-block:20px 48px;align-items:start}
@media (max-width:860px){.pq{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:14px}}
.left{display:grid;gap:12px;position:sticky;top:64px}
@media (max-width:860px){.left{position:static}}
.ph{margin:0;background:var(--photo);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{display:block;max-width:100%;height:auto;max-height:56vh;width:auto;object-fit:contain}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px}
.ctrl .lbl{font-size:13px;color:var(--muted);min-width:76px}
.one button{width:44px;height:40px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font:600 15px var(--mono)}
.one button:hover{border-color:var(--accent)}
.playing{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.right{display:grid;gap:14px;min-width:0}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qh h2{font-size:22px}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans button{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:700 22px var(--mono);display:flex;align-items:center;justify-content:center}
.ans button:hover:not(:disabled){border-color:var(--accent)}
.ans button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ans button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ans button:disabled{cursor:default}
.ans button.ok:disabled,.ans button.bad:disabled{opacity:1}
.ans button:disabled:not(.ok):not(.bad){opacity:.5}
.verdict{border-radius:6px;padding:12px 14px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.stm{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stm li{display:grid;grid-template-columns:40px 28px minmax(0,1fr);gap:8px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 8px}
.stm li.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.stm li.bad{border-color:var(--bad)}
.stm .pl{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:flex;align-items:center;justify-content:center;padding:0}
.stm .pl svg{width:14px;height:14px;fill:currentColor}
.stm .L{font:700 16px/36px var(--mono)}
.stm .en{font-weight:500;font-size:17px;line-height:1.5}
.stm .th{font-size:15px;color:var(--muted);margin-top:2px}
.stm li.ok .th{color:var(--ok)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 2px}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.note h4{font-size:14px;color:var(--muted);font-weight:600}
.note.trapn{border-left-color:var(--flag)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;background:var(--accent-soft);border-radius:3px;padding:2px 8px;font-weight:500}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:4px}
.prev{font-size:14px;color:var(--muted)}
.prev .ok{color:var(--ok);font-weight:600}.prev .bad{color:var(--bad);font-weight:600}
.hint{font-size:14px;color:var(--muted)}

/* exam */
.ex{max-width:880px;margin:0 auto;display:grid;gap:16px;padding-block:18px 48px}
.ex .ph img{max-height:60vh}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--bar-muted);opacity:.35}
.dots i.done{opacity:1;background:var(--bar-muted)}
.dots i.now{opacity:1;background:var(--accent)}
.status{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.wave i{width:4px;background:var(--accent);border-radius:2px;animation:w 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;height:10px}}
.intro{max-width:720px;margin:0 auto;padding-block:30px 48px;display:grid;gap:18px}
.intro ul{margin:0;padding-left:22px;display:grid;gap:6px}
.res{max-width:880px;margin:0 auto;padding-block:26px 48px;display:grid;gap:18px}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;background:var(--panel);font-size:15px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.t th{background:var(--accent-soft);font-weight:600}
table.t img{width:72px;height:48px;object-fit:cover;border-radius:3px;display:block}
td.ok{color:var(--ok);font-weight:600}td.bad{color:var(--bad);font-weight:600}

/* method page */
.doc{max-width:860px;margin:0 auto;padding-block:30px 60px;display:grid;gap:34px}
.doc section{display:grid;gap:14px}
.doc h2{font-size:22px}
.doc h3{font-size:17px}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{margin:0;padding-left:22px;display:grid;gap:6px}
.steps{display:grid;gap:10px;counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px 14px 58px;position:relative;max-width:none}
.steps li::before{content:counter(s);position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 15px/28px var(--mono);text-align:center}
.steps b{display:block;margin-bottom:2px}
.ex-line{font-family:var(--sans);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:15px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:8px}
.tcard .egw{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.tcard .egw img{width:120px;height:80px;object-fit:cover;border-radius:4px;display:block}
@media (max-width:520px){.tcard .egw{grid-template-columns:84px minmax(0,1fr)}.tcard .egw img{width:84px;height:60px}}
.tcard .eg{display:grid;gap:4px;font-size:15px}
.tcard .eg div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.tcard .eg .y{color:var(--ok);font-weight:700}.tcard .eg .n{color:var(--bad);font-weight:700}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.vg table{font-size:14px}
</style>
</head>

  A.stop=to;A.cb=opt.cb||null;A.cues=opt.cues||null;A.all=!!opt.all;A.one=opt.one;
  const go=()=>{try{au.currentTime=from}catch(e){}au.playbackRate=rate;const p=au.play();if(p&&p.catch)p.catch(()=>{opt.blocked&&opt.blocked()})};
  if(au.readyState>=1)go();else{A.pending=()=>{A.pending=null;go()};au.addEventListener('loadedmetadata',A.pending,{once:true})}
}

/* ---------- routing ---------- */
let timers=[], last='';
const later=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};
function go(h){if(location.hash!==h)history.pushState(null,'',h);route(true)}
function route(force){
  const h=location.hash||'#home';
  if(!force&&h===last)return;
  last=h;stopAudio();clearTimers();E=null;
  const p=h.slice(1).split('/');
  if(p[0]==='p')practice(p[1]||'all',+p[2]||0);
  else if(p[0]==='x')examIntro(Math.min(NSET,Math.max(1,+p[1]||1)));
  else if(p[0]==='how')method();
  else home();
  window.scrollTo(0,0);
}
addEventListener('popstate',()=>route());
addEventListener('hashchange',()=>route());
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a&&!e.defaultPrevented&&!e.metaKey&&!e.ctrlKey){e.preventDefault();go(a.getAttribute('href'))}
});

/* ---------- helpers ---------- */
function bar(mid,right){
  return `<header class="bar"><div class="in pad">
    <a href="#home" class="ttl">TOEIC Part 1</a>${mid?`<span class="meta">${mid}</span>`:''}
    <span class="sp"></span>${right||''}
  </div></header>`;
}
function queue(f){
  if(f==='all')return Q.map(q=>q.n);
  if(TR[f])return Q.filter(q=>q.trap===f).map(q=>q.n);
  if(f==='wrong'){if(!queue.snap)queue.snap=Q.filter(q=>S.a[q.n]&&!S.a[q.n].ok).map(q=>q.n);return queue.snap.length?queue.snap:[1]}
  const m=/^s(\d+)$/.exec(f);
  if(m){const k=+m[1];return Q.filter(q=>q.n>(k-1)*10&&q.n<=k*10).map(q=>q.n)}
  return Q.map(q=>q.n);
}
function fname(f){
  if(f==='all')return 'ทั้งหมด';
  if(TR[f])return TR[f].name;
  if(f==='wrong')return 'ข้อที่เคยผิด';
  const m=/^s(\d+)$/.exec(f);return m?`ทวนชุด ${m[1]}`:'';
}
function hl(text,kw){
  let h=esc(text);
  const ks=[...kw].sort((a,b)=>b.length-a.length).filter(k=>k.length>1);
  if(!ks.length)return h;
  const re=new RegExp('\\b('+ks.map(k=>esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
  return h.replace(re,'<mark>$1</mark>');
}
function img(q,alt){return `<img src="img/${q.photo}.jpg" width="${q.wh[0]}" height="${q.wh[1]}" alt="${esc(alt)}" decoding="async">`}
function stats(){
  const done=Object.keys(S.a).length, ok=Object.values(S.a).filter(r=>r.ok).length;
  const by={};TORDER.forEach(t=>by[t]={n:0,done:0,ok:0});
  Q.forEach(q=>{const b=by[q.trap];b.n++;const r=S.a[q.n];if(r){b.done++;if(r.ok)b.ok++}});
  return {done,ok,by};
}

function example(t){
  const e=EG[t], q=Q.find(x=>x.photo===e[0])||Q.find(x=>x.trap===t);if(!q)return '';
  const y=q.opts['ABCD'.indexOf(q.ans)], n=q.opts.find(o=>o.t.startsWith(e[1]))||q.opts.find(o=>o!==y);
  return `<div class="egw"><a href="#p/all/${q.n}" aria-label="ดูข้อ ${q.n}"><img src="img/${q.photo}.jpg" alt="ภาพตัวอย่างข้อ ${q.n}" loading="lazy"></a><div class="eg"><div><span class="y">✓</span><span>${esc(y.t)}</span></div><div><span class="n">✗</span><span>${esc(n.t)} <span class="muted">· ${esc(n.r)}</span></span></div></div></div>`;
}
function vt(rows){return `<table class="t"><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`}

      ${TORDER.map(t=>`<div class="tcard"><h3><a href="#p/${t}/">${TR[t].name}</a> <span class="muted" style="font-weight:400;font-size:14px">${st.by[t].n} ข้อ</span></h3><p>${TR[t].desc}</p>${example(t)}</div>`).join('')}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toUpperCase();
  const m={'1':'A','2':'B','3':'C','4':'D'}[k]||k;
  if('ABCD'.includes(m)&&m.length===1){const b=$(`.ans button[data-a="${m}"]`);if(b&&!b.disabled){b.click();e.preventDefault()}}
  else if(C&&location.hash.startsWith('#p/')){
    if(e.key==='ArrowRight'){const a=$('.nav .btn.pri');a&&a.click()}
    else if(e.key==='ArrowLeft'){const a=$('.nav a.btn:not(.pri)');a&&a.click()}
    else if(e.key===' '&&!e.target.closest('button,a')){e.preventDefault();au.paused?$('#pall').click():stopAudio()}
  }
});
route(true);
